<script>
// ================= KLUBCHEF ENGINE (deterministisch) =================
// Alle Zufälle kommen aus RNG(seed, schlüssel) – jedes Gerät berechnet denselben Spielstand.
function h32(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function RNG(seed,key){const f=mulberry(h32(seed+'|'+key));return{f,
  int:(a,b)=>a+Math.floor(f()*(b-a+1)),
  pick:arr=>arr[Math.floor(f()*arr.length)],
  chance:p=>f()<p,
  shuffle:arr=>{const x=arr.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(f()*(i+1));const t=x[i];x[i]=x[j];x[j]=t;}return x;},
  norm:(m,s)=>{let u=0;for(let i=0;i<4;i++)u+=f();return m+(u-2)*1.732*s;},
  wpick:(items)=>{let tot=0;for(const it of items)tot+=it.w;let x=f()*tot;for(const it of items){x-=it.w;if(x<0)return it;}return items[items.length-1];}
};}
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const r2=x=>Math.round(x*100)/100;

const FIRST=['Lukas','Jonas','Leon','Finn','Elias','Noah','Paul','Ben','Felix','Max','Luca','Tim','Jan','Nico','Moritz','Julian','David','Simon','Fabian','Niklas','Marco','Kevin','Dennis','Timo','Sven','Florian','Tobias','Matteo','Emil','Anton','Malik','Yusuf','Mats','Ole','Hannes','Jannik','Kai','Robin','Lars','Erik','Mika','Aaron','Samuel','Joel','Tom','Linus','Theo','Adrian','Dario','Enzo','Luis','Mateo','Nils','Piet','Rafael','Henrik','Kilian','Levin','Milan','Oskar','Ilias','Can','Davor','Jakub','Andrés','Mamadou','Tiago','Kofi','Sander','Jari'];
const LAST=['Brandt','Kessler','Vogt','Hartmann','Lindner','Schäfer','Köhler','Wendt','Brenner','Albrecht','Ruhland','Seidel','Krämer','Busch','Engel','Graf','Haas','Jäger','Kurz','Lorenz','Marx','Nagel','Otto','Pohl','Rieger','Sauer','Thiel','Ulrich','Vetter','Winter','Zeller','Adler','Bauer','Dietz','Eckert','Fink','Gerber','Heller','Iser','Jansen','Kuhn','Lang','Maier','Neumeier','Oswald','Pfeiffer','Quast','Rapp','Stein','Thoma','Unger','Vollmer','Weiß','Ziegler','Berger','Fuchs','Hesse','Kaya','Novak','Silva','Diallo','Petrović','Lindqvist','Moreau','Costa','Kowalski','Mensah','Okafor','Hansen','Rossi','Yilmaz','Dvořák','Varga','Nowak','Martín','Delgado','Sørensen','Bakker','Laurent','Esposito'];
const NPC_NAMES=['FC Rheinstadt','SV Neckartal 08','Borussia Waldau','Eintracht Hafenburg','VfL Odenwald','SC Bodensee','Union Lindenau','Rot-Weiß Elbstadt','Alemannia Hochfeld','TSV Bergheim','Fortuna Mühlbach','Viktoria Kraichgau','SpVgg Talheim','Sportfreunde Auenthal'];
const COLORS=['#e5484d','#3e8bff','#f5c542','#2fbf71','#a16bff','#ff8a3d','#1fc6d4','#f0f0f0'];
const NPC_COL=['#7c8a85','#8a7f6e','#6e7d8a','#857089','#6f8a72','#8a6f6f','#7a7a95','#94866b'];
const POSL={G:'TW',D:'AB',M:'MF',A:'ST'};
const FORM={'4-4-2':[4,4,2],'4-3-3':[4,3,3],'3-5-2':[3,5,2],'5-3-2':[5,3,2],'4-5-1':[4,5,1],'3-4-3':[3,4,3]};
const TAC={
  bal:{n:'Ausgeglichen',d:'Keine Stärken, keine Schwächen.'},
  off:{n:'Offensiv',d:'Angriff +5, Abwehr −4.'},
  def:{n:'Defensiv',d:'Abwehr +5, Angriff −4.'},
  konter:{n:'Konter',d:'Mittelfeld −3. Angriff +6 gegen offensive oder pressende Gegner, sonst +1.'},
  press:{n:'Pressing',d:'Mittelfeld +5, Angriff +1, Abwehr −1. Verpufft gegen Konter, mehr Verletzungen.'}
};
const STAFF={
  co:{n:'Co-Trainer',d:'+2 auf Angriff, Mittelfeld und Abwehr'},
  phys:{n:'Physiotherapeut',d:'Halbes Verletzungsrisiko, kürzere Ausfälle'},
  fit:{n:'Fitnesstrainer',d:'Mittelfeld +2, Pressing ohne Zusatzrisiko'},
  scout:{n:'Chefscout',d:'−10 % auf alle Ablösen'},
  sd:{n:'Sportdirektor',d:'+15 % Erlös bei Verkäufen'},
  gk:{n:'Torwarttrainer',d:'Abwehr +2,5'},
  st:{n:'Stürmertrainer',d:'Angriff +3'},
  def:{n:'Abwehrtrainer',d:'Abwehr +3'},
  mkt:{n:'Marketingchef',d:'+1,5 Mio Sponsoring pro Saison',d3:'+3 Mio Sponsoring pro Saison'},
  youth:{n:'Jugendkoordinator',d:'Jugendspieler kommen mit +5 Stärke'}
};
const UPS={
  training:{n:'Trainingszentrum',d:l=>`Spieler bis 26 entwickeln sich um +${String((l-1)*0.5).replace('.',',')} pro Saison besser.`},
  scouting:{n:'Scouting-Netzwerk',d:l=>`Du siehst ${l>=4?'alle':'mehr'} Spieler am Markt${l>1?`, −${(l-1)*4} % Ablöse`:''}${l>=3?', Potenzial sichtbar':''}.`},
  stadium:{n:'Stadion',d:l=>`${CAP[l].toLocaleString('de-DE')} Plätze · +${l-1} Ruhm pro Saison.`},
  youth:{n:'Jugendakademie',d:l=>`Jede Sommerpause ein Talent mit Stärke ~${40+l*4}.`}
};
const UPCOST=[0,3,5,8,12];
const CAP=[0,15000,22000,32000,45000,60000];
const TICKET=50; // Euro
const QUOTA={G:2,D:5,M:5,A:3};
const SQUAD_MAX=22,SQUAD_MIN=12,LEAGUE=8,MAXH=6;
const PLACE_FAME=[10,7,5,4,3,2,1,0];
const CATCHUP=[0,1,2,3,3.5,4,4.5,5];
const CL_CLUBS=['Real Castilla CF','AC Lombardia','Olympique Riviera','Royal Thames FC','Sporting Atlântico','FC Amstel','Inter Partenope','Athletic Bravura','Dynamo Baltika','Galatasaray Bosporus'];
const CL_NATIONS=['Brasilien','Frankreich','Argentinien','Spanien','England','Portugal','Niederlande','Italien'];
const BUY_MAX=2;
const DIFF={leicht:{n:'Leicht',o:-5},normal:{n:'Normal',o:0},schwer:{n:'Schwer',o:4},profi:{n:'Profi',o:8}};
function doff(st){return st.rv>=2?(DIFF[st.settings.diff]||DIFF.normal).o:0;}
function seasonsLeft(st){return !st.settings.seasons||st.season<st.settings.seasons;}
function titles(c){return c.trophies.filter(t=>t.startsWith('Meister')).length;}
function clEligible(c){return c.fame>=50||titles(c)>=3;}

function Rej(m){this.m=m;}
function rej(m){throw new Rej(m);}

let CAREER_VAL=false;
function value(p){if(CAREER_VAL){const af=p.age<=21?1.3:p.age<=25?1.15:p.age<=29?1:p.age<=32?0.7:0.4;return Math.max(0.01,r2(0.05*Math.pow(1.13,p.rat-40)*af));}const x=Math.max(0,(p.rat-40)/10);let v=0.6*x*x*(1+0.1*x);const af=p.age<=21?1.3:p.age<=25?1.15:p.age<=29?1:p.age<=32?0.7:0.4;v*=af;return Math.max(0.2,Math.round(v*10)/10);}
function salary(p){if(CAREER_VAL)return Math.max(0.005,Math.round(value(p)*0.15*1000)/1000);return Math.max(0.1,r2(value(p)*0.12));}
function has(c,t){return c.staff&&c.staff.some(s=>s.type===t);}
function buyPrice(c,p){let v=value(p)*(1-0.04*(c.up.scouting-1));if(has(c,'scout'))v*=0.9;return r2(v);}
function sellPrice(c,p){let v=value(p)*0.8;if(has(c,'sd'))v*=1.15;return r2(v);}
function visible(c,p){return (p.tier||1)<=c.up.scouting+1;}
function money(c,x){c.cash=r2(c.cash+x);}
function newId(st){return 'p'+(st.nextId++);}
function pname(r){return r.pick(FIRST)+' '+r.pick(LAST);}
function tierOf(r,p){let t=p.rat>=80?5:p.rat>=75?4:p.rat>=70?3:p.rat>=62?2:1;if(p.age<=21&&p.pot>=80)t++;t+=r.int(-1,0);return clamp(t,1,5);}

function genPlayer(st,r,pos,mean,sd,amin,amax){
  const age=r.int(amin,amax);
  const rat=Math.round(clamp(r.norm(mean,sd),44,88));
  const pot=Math.min(95,rat+(age<=21?r.int(4,16):age<=24?r.int(1,8):r.int(0,2)));
  return{id:newId(st),name:pname(r),pos,age,rat,pot,inj:0};
}
function genYouth(st,r,c){
  const pos=r.wpick([{v:'G',w:1},{v:'D',w:3},{v:'M',w:3},{v:'A',w:3}]).v;
  let rat=40+c.up.youth*4+r.int(-2,3);if(has(c,'youth'))rat+=5;
  return{id:newId(st),name:pname(r),pos,age:17,rat,pot:Math.min(93,rat+r.int(12,24)),inj:0};
}
function genMarket(st,r,n){
  const out=[];
  for(let i=0;i<n;i++){
    const pos=r.wpick([{v:'G',w:2},{v:'D',w:5},{v:'M',w:6},{v:'A',w:5}]).v;
    const p=genPlayer(st,r,pos,67,8,18,33);p.tier=tierOf(r,p);out.push(p);
  }
  return out;
}
function genStaff(st,r,n){
  const types=r.shuffle(Object.keys(STAFF)).slice(0,n);
  if(st.rv>=3)return types.map(t=>({id:'s'+(st.nextId++),type:t,name:pname(r),fee:r.int(20,40)/10,sal:r.int(10,20)/10}));
  return types.map(t=>({id:'s'+(st.nextId++),type:t,name:pname(r),fee:r.int(4,12)/10,sal:r.int(3,9)/10}));
}
function humans(st){return st.players.map(p=>p.pid);}
function isHuman(st,pid){return st.players.some(p=>p.pid===pid);}
function feed(st,txt,pid){st.feed.push({s:st.season,md:st.md,txt,pid:pid||null});if(st.feed.length>120)st.feed.splice(0,st.feed.length-120);}
function isHost(st,a){return st.local||a.by===st.host;}

function createState(a){
  const s=a.settings||{};
  const rv=+a.rv||1;
  return{v:1,rv,code:String(a.code||''),seed:String(a.seed||'x'),host:a.by,local:!!a.local,phase:'lobby',
    settings:normSettings(s,rv),
    players:[],clubs:{},league:[],nextId:1,season:1,md:0,schedule:[],cupMds:[],table:{},cup:null,draft:null,
    market:[],staffPool:[],ready:{},last:null,feed:[],history:[],final:null,offFirst:false};
}

function normSettings(s,rv){
  let n=Number(s.seasons);
  const seasons=rv>=2?(n===0?0:clamp(Number.isFinite(n)&&n>0?n:3,1,20)):clamp(+s.seasons||3,1,6);
  const o={seasons,double:!!s.double,draft:s.draft==='auto'?'auto':'manual'};
  if(rv>=2)o.diff=DIFF[s.diff]?s.diff:'normal';
  return o;
}
function newHumanClub(p){

// ---------- Draft ----------
function drafterAt(st,p){const d=st.draft,n=d.order.length;const rd=Math.floor(p/n),i=p%n;if(d.board)return d.order[(rd+i)%n];return d.order[rd%2?n-1-i:i];}
function drafter(st){return drafterAt(st,st.draft.pick);}
const BOARD=10;
function boardPlayer(st,r,pos){if(!pos)pos=r.wpick([{v:'G',w:2},{v:'D',w:5},{v:'M',w:5},{v:'A',w:3}]).v;return genPlayer(st,r,pos,64,8,18,33);}
function fillBoard(st){
  const d=st.draft;const r=RNG(st.seed,'board'+d.pick);
  while(d.board.length<BOARD)d.board.push(boardPlayer(st,r));
  const c=st.clubs[drafter(st)];
  if(c&&c.human&&!d.board.some(p=>canTake(c,p.pos))){const need=['G','D','M','A'].filter(p=>canTake(c,p));if(need.length)d.board.push(boardPlayer(st,r,r.pick(need)));}
}
function npcDraft(st){
  while(st.draft&&st.draft.board&&st.draft.pick<st.draft.total){
    const c=st.clubs[drafter(st)];if(c.human)break;
    const r=RNG(st.seed,'npcpick'+st.draft.pick);
    const top=st.draft.board.slice().sort((a,b)=>b.rat-a.rat||(a.id<b.id?-1:1)).slice(0,3);
    takeDraft(st,c,r.f()<0.6?top[0]:r.pick(top));
  }
}
function canTake(c,pos){return c.squad.filter(p=>p.pos===pos).length<QUOTA[pos];}
function autoPick(st){
  const c=st.clubs[drafter(st)];
  const cand=(st.draft.board||st.draft.pool).filter(p=>canTake(c,p.pos)).sort((a,b)=>b.rat-a.rat||(a.id<b.id?-1:1));
  takeDraft(st,c,cand[0]);
}
function takeDraft(st,c,p){
  const d=st.draft;
  if(d.board){
    d.board=d.board.filter(x=>x.id!==p.id);if(c.human)c.squad.push(p);
    d.log.push({c:c.id,n:p.name,pos:p.pos,rat:p.rat});if(d.log.length>12)d.log.shift();
    d.pick++;
    if(d.pick>=d.total){finishDraft(st);return;}
    fillBoard(st);npcDraft(st);return;
  }
  st.draft.pool=st.draft.pool.filter(x=>x.id!==p.id);c.squad.push(p);st.draft.pick++;
  if(st.draft.pick>=st.draft.total)finishDraft(st);
}
function finishDraft(st){
  const r=RNG(st.seed,'afterdraft');
  const left=(st.draft.board||st.draft.pool).map(p=>{p.tier=tierOf(r,p);return p;});
  st.market=left.concat(genMarket(st,r,8));
  st.staffPool=genStaff(st,r,6);
  st.draft=null;
  setupSeason(st);
  st.phase='offseason';st.offFirst=true;st.ready={};
  for(const pid of humans(st)){st.clubs[pid].buys=0;if(st.rv>=3)st.clubs[pid].hires=0;}
  feed(st,'Der Draft ist beendet. Die Sommerpause beginnt – Transfermarkt geöffnet!');
}

// ---------- Saison ----------
function roundRobin(ids){
  const n=ids.length,arr=ids.slice(),rounds=[];
  for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];m.push((r+i)%2?[b,a]:[a,b]);}rounds.push(m);arr.splice(1,0,arr.pop());}
  return rounds;
}
function setupSeason(st){
  if(statsOn(st))st.ss={};
  const r=RNG(st.seed,'season'+st.season);
  const order=r.shuffle(st.league);
  let rr=roundRobin(order);
  if(st.settings.double)rr=rr.concat(rr.map(m=>m.map(([a,b])=>[b,a])));
  st.schedule=rr;st.md=0;
  const L=rr.length;st.cupMds=[Math.floor(L*0.25),Math.floor(L*0.55),L-1];
  st.table={};for(const id of st.league)st.table[id]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
  const cupOrder=r.shuffle(st.league);
  st.cup={round:0,alive:cupOrder,log:[],winner:null,finalist:null};
}
function sortedTable(st){
  return st.league.map(id=>({id,...st.table[id]})).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||(a.id<b.id?-1:1));
}
const CUPN=['Viertelfinale','Halbfinale','Finale'];

function pickXI(c,form){
  const F=FORM[form]||FORM['4-4-2'];
  const avail=c.squad.filter(p=>!(p.inj>0)).sort((a,b)=>b.rat-a.rat||(a.id<b.id?-1:1));
  const used=new Set();
  const take=(pos,n)=>{const out=[];for(const p of avail){if(out.length>=n)break;if(p.pos===pos&&!used.has(p.id)){out.push({p,r:p.rat});used.add(p.id);}}return out;};
  let xi;
  if(c.lineup){
    xi={G:[],D:[],M:[],A:[]};const need={G:1,D:F[0],M:F[1],A:F[2]};
    for(const k of ['G','D','M','A'])for(const id of (c.lineup[k]||[])){
      if(xi[k].length>=need[k])break;const p=avail.find(q=>q.id===id);if(!p||used.has(p.id))continue;
      used.add(p.id);xi[k].push(p.pos===k?{p,r:p.rat}:{p,r:p.rat-(k==='G'||p.pos==='G'?25:12),oop:true});
    }
    for(const k of ['G','D','M','A'])xi[k]=xi[k].concat(take(k,need[k]-xi[k].length));
  }else xi={G:take('G',1),D:take('D',F[0]),M:take('M',F[1]),A:take('A',F[2])};
  for(const [k,n] of [['G',1],['D',F[0]],['M',F[1]],['A',F[2]]]){
    while(xi[k].length<n){
      const p=avail.find(q=>!used.has(q.id)&&(k==='G'||q.pos!=='G'));
      if(p){used.add(p.id);xi[k].push({p,r:p.rat-(k==='G'?25:12),oop:true});}
      else xi[k].push({p:null,r:35});
    }
  }
  return xi;
}
function teamRat(c,form,tac,oppTac,home){
  let A,M,D,xi=null;
  if(c.human){
    xi=pickXI(c,form);const F=FORM[form]||FORM['4-4-2'];
    const av=a=>a.reduce((s,x)=>s+x.r,0)/a.length;
    D=0.35*xi.G[0].r+0.65*av(xi.D)+(F[0]-4)*4;
    M=av(xi.M)+(F[1]-4)*4;
    A=0.75*av(xi.A)+0.25*av(xi.M)+(F[2]-2)*4;
    const m=(c.moral-3)*1.5;A+=m;M+=m;D+=m;
    if(has(c,'co')){A+=2;M+=2;D+=2;}
    if(has(c,'gk'))D+=2.5;if(has(c,'st'))A+=3;if(has(c,'def'))D+=3;if(has(c,'fit'))M+=2;
  }else{A=c.A;M=c.M;D=c.D;}
  if(home){A+=1.5;M+=1.5;D+=1.5;}
  if(tac==='off'){A+=5;D-=4;}
  else if(tac==='def'){A-=4;D+=5;}
  else if(tac==='konter'){M-=3;A+=(oppTac==='off'||oppTac==='press')?6:1;}
  else if(tac==='press'){M+=oppTac==='konter'?0:5;A+=1;D-=1;}
  return{A,M,D,xi};
}
function npcTac(r){return r.wpick([{v:'bal',w:3},{v:'off',w:2},{v:'def',w:2},{v:'konter',w:1},{v:'press',w:1}]).v;}
function scorer(c,R,r){
  if(!c.human)return r.pick(FIRST)[0]+'. '+r.pick(LAST);
  const pool=[];for(const [k,w] of [['A',6],['M',3],['D',1]])for(const x of R.xi[k])if(x.p)pool.push({v:x.p.name,w});
  return pool.length?r.wpick(pool).v:'Eigentor';
}
function statsOn(st){return st.rv>=6||!!st.career;}
function goalStat(st,c,R,r){
  if(!st.ss)st.ss={};
  const bump=(key,n,cid,f)=>{const e=st.ss[key]||(st.ss[key]={n,c:cid,lg:c.lg||0,g:0,a:0});e[f]++;e.lg=c.lg||0;};
  if(c.human){
    const pool=[];for(const [k,w] of [['A',6],['M',3],['D',1]])for(const x of R.xi[k])if(x.p)pool.push({v:x.p,w});
    if(!pool.length)return{x:'Eigentor'};
    const p=r.wpick(pool).v;p.gs=(p.gs||0)+1;p.gc=(p.gc||0)+1;bump('p'+p.id,p.name,c.id,'g');
    let an=null;
    if(r.f()<0.7){const ap=[];for(const [k,w] of [['M',5],['A',3],['D',2]])for(const x of R.xi[k])if(x.p&&x.p!==p)ap.push({v:x.p,w});
      if(ap.length){const q=r.wpick(ap).v;q.as=(q.as||0)+1;q.ac=(q.ac||0)+1;bump('p'+q.id,q.name,c.id,'a');an=q.name;}}
    return{x:p.name,as:an};
  }
  if(!c.sc){c.sc=[];for(let i=0;i<8;i++)c.sc.push({v:r.pick(FIRST)[0]+'. '+r.pick(LAST),w:[6,5,4,3,2,2,1,1][i]});}
  const sn=r.wpick(c.sc).v;bump(c.id+'|'+sn,sn,c.id,'g');
  let an=null;if(r.f()<0.7){const o=c.sc.filter(x=>x.v!==sn);if(o.length){an=r.wpick(o).v;bump(c.id+'|'+an,an,c.id,'a');}}
  return{x:sn,as:an};
}
function topScorer(st,filt){const l=Object.values(st.ss||{}).filter(e=>!filt||filt(e)).sort((a,b)=>b.g-a.g||b.a-a.a);return l[0]&&l[0].g>0?{n:l[0].n,c:l[0].c,g:l[0].g}:null;}
function playMatch(st,hId,aId,r,o){
  const h=st.clubs[hId],a=st.clubs[aId];
  const th=h.human?h.tac:npcTac(r),ta=a.human?a.tac:npcTac(r);
  const RH=teamRat(h,h.form,th,ta,true),RA=teamRat(a,a.form,ta,th,false);
  let gh=0,ga=0;const ev=[];
  for(let s=0;s<12;s++){
    const d=RH.M-RA.M;const p=0.5+d/(2*(Math.abs(d)+14));
    const home=r.f()<p;const att=home?RH:RA,def=home?RA:RH;
    if(r.f()<0.55){
      const gp=clamp(0.33+(att.A-def.D)/45,0.08,0.7);
      const min=Math.floor(s*7.5)+r.int(1,7);
      if(r.f()<gp){if(home)gh++;else ga++;if(statsOn(st)){const g=goalStat(st,home?h:a,att,r);ev.push({m:min,t:'g',s:home?'h':'a',x:g.x,as:g.as,sc:gh+':'+ga});}else ev.push({m:min,t:'g',s:home?'h':'a',x:scorer(home?h:a,att,r),sc:gh+':'+ga});}
      else if(r.f()<0.3)ev.push({m:min,t:'c',s:home?'h':'a',x:scorer(home?h:a,att,r)});
    }
  }
  const m={h:hId,a:aId,gh,ga,ev,th,ta,cup:o.cupName||null,pens:null};
  if(o.cup&&gh===ga){
    let ph=0,pa=0,i=0;
    while(i<5||ph===pa){if(r.chance(0.76))ph++;if(r.chance(0.76))pa++;i++;if(i>30)break;}
    m.pens=[ph,pa];
  }
  const hw=m.pens?m.pens[0]>m.pens[1]:gh>ga, aw=m.pens?m.pens[1]>m.pens[0]:ga>gh;
  m.w=hw?hId:aw?aId:null;
  if(!o.cup){
    const T=st.table;
    for(const [id,gf,gA] of [[hId,gh,ga],[aId,ga,gh]]){const t=T[id];t.p++;t.gf+=gf;t.ga+=gA;if(gf>gA){t.w++;t.pts+=3;}else if(gf===gA){t.d++;t.pts++;}else t.l++;}
  }
  for(const [c,R,mine,other,tac] of [[h,RH,gh,ga,th],[a,RA,ga,gh,ta]]){
    if(!c.human)continue;
    const won=m.w?m.w===c.id:mine>other, lost=m.w?m.w!==c.id:mine<other, draw=!won&&!lost;
    const CE=st.career?careerEcon(st,c):null;
    if(c===h)money(c,CE?CE.ticket:Math.min(c.fans,CAP[c.up.stadium])*TICKET/1e6);
    if(won){money(c,CE?CE.win*(o.cup?2:1):o.cup?0.5:0.25);if(CE&&!o.cup&&c.spon&&c.spon.perWin)money(c,c.spon.perWin);c.fans+=CE?Math.round(c.fans*0.01)+10:300;if(r.chance(0.5)&&c.moral<5)c.moral++;}
    else if(draw){money(c,CE?r2(CE.win/3):0.1);}
    else{c.fans=CE?Math.max(150,Math.round(c.fans*0.99)):Math.max(3000,c.fans-200);if(r.chance(0.5)&&c.moral>1)c.moral--;}
    if(st.rv>=5)for(const k of ['G','D','M','A'])for(const x of R.xi[k])if(x.p)x.p.apps=(x.p.apps||0)+1;
    let risk=0.025+(tac==='press'&&!has(c,'fit')?0.02:0);if(has(c,'phys'))risk/=2;
    for(const k of ['G','D','M','A'])for(const x of R.xi[k]){
      if(x.p&&r.f()<risk){const n=Math.max(1,r.int(1,4)-(has(c,'phys')?1:0));o.inj.push([x.p,n]);ev.push({m:r.int(5,88),t:'i',s:c===h?'h':'a',x:x.p.name,n});}
    }
  }
  ev.sort((x,y)=>x.m-y.m);
  return m;
}

function resolveMatchday(st){

  if(ci>=0&&st.cup&&!st.cup.winner){
    const al=st.cup.alive,win=[],ms=[];
    for(let i=0;i<al.length;i+=2){const m=playMatch(st,al[i],al[i+1],r,{cup:true,cupName:CUPN[ci],inj});ms.push(m);results.push(m);win.push(m.w);}
    st.cup.log.push({round:CUPN[ci],ms:ms.map(m=>({h:m.h,a:m.a,gh:m.gh,ga:m.ga,pens:m.pens,w:m.w}))});
    st.cup.alive=win;st.cup.round++;
    if(win.length===1){st.cup.winner=win[0];const f=ms[0];st.cup.finalist=f.w===f.h?f.a:f.h;feed(st,`🏆 ${st.clubs[win[0]].name} gewinnt den Pokal!`);
      const wc=st.clubs[win[0]];if(wc.human){money(wc,2);wc.fans+=3000;}}
  }
  for(const pid of humans(st))for(const p of st.clubs[pid].squad)if(p.inj>0)p.inj--;
  for(const [p,n] of inj)p.inj=Math.max(p.inj||0,n);
  const cards={};
  for(const pid of humans(st)){
    const c=st.clubs[pid];const card=r.wpick(CARDS);
    const data=card.prep?card.prep(c,r,st):{};
    if(card.prep&&!data){cards[pid]={t:'Ruhige Woche',x:'Keine Schlagzeilen.',g:1};continue;}
    const x=card.run(c,r,st,data);
    cards[pid]={t:card.t,x,g:card.g};
    if(card.opts){c.pending={k:card.k,t:card.t,x,opts:card.opts,data};cards[pid].choice=true;}
  }
  st.last={season:st.season,md:st.md,results,cards};
  st.md++;st.ready={};
  if(st.md>=st.schedule.length)endSeason(st);
}

function endSeason(st){
  const tbl=sortedTable(st);
  const champ=tbl[0].id;
  feed(st,`🥇 ${st.clubs[champ].name} ist Meister der Saison ${st.season}!`);
  st.history.push({season:st.season,champ,cup:st.cup.winner,order:tbl.map(t=>t.id),top:statsOn(st)?topScorer(st):undefined});
  for(const pid of humans(st)){
    const c=st.clubs[pid];const place=tbl.findIndex(t=>t.id===pid)+1;
    if(c.pending){c.pending=null;}
    const fame=[[`Platz ${place} in der Liga`,PLACE_FAME[place-1]||0]];
    if(st.cup.winner===pid)fame.push(['Pokalsieg',5]);else if(st.cup.finalist===pid)fame.push(['Pokalfinale',2]);
    if(c.up.stadium>1)fame.push(['Stadion-Prestige',c.up.stadium-1]);
    if(place===1){c.trophies.push('Meister '+st.season);c.fans+=5000;}
    if(st.cup.winner===pid)c.trophies.push('Pokal '+st.season);
    let fsum=0;for(const f of fame)fsum+=f[1];c.fame+=fsum;
    const sal=r2(c.squad.reduce((s,p)=>s+salary(p),0));
    const ssal=r2(c.staff.reduce((s,x)=>s+x.sal,0));
    const fin=[['TV-Geld',r2(9-(place-1)*5/7)],['Sponsoring',r2(3+0.15*c.fame)]];
    if(has(c,'mkt'))fin.push(['Marketingchef',st.rv>=3?3:1.5]);
    fin.push(['Gehälter Spieler',-sal]);if(ssal)fin.push(['Gehälter Staff',-ssal]);
    if(st.rv>=2&&CATCHUP[place-1])fin.push(['Ausgleichsbonus',CATCHUP[place-1]]);
    if(c.debt>0)fin.push(['Kreditzinsen (10 %)',-r2(c.debt*0.1)]);
    for(const f of fin)money(c,f[1]);
    let emer=0;while(c.cash<0&&c.debt<60){money(c,5);c.debt+=5;emer++;}
    if(emer){fin.push(['Notkredit',emer*5]);c.fame-=emer;fame.push(['Notkredit (Imageschaden)',-emer]);}
    c.report={season:st.season,place,fin,fame};
  }
  st.cl=null;
  if(st.rv>=2){
    const ent={};
    for(const pid of humans(st)){const c=st.clubs[pid];if(!clEligible(c))continue;
      const r=RNG(st.seed,`cl-${st.season}-${pid}`);const nat=r.chance(0.4);
      const base=(nat?r.int(77,82):r.int(75,81))+Math.round(doff(st)/2);const id='cl'+st.season+pid;
      st.clubs[id]={id,human:false,cl:true,name:nat?r.pick(CL_NATIONS):r.pick(CL_CLUBS),color:'#c9a227',A:base+r.int(-2,2),M:base+r.int(-2,2),D:base+r.int(-2,2)};
      ent[pid]=id;feed(st,`⭐ ${c.name} hat sich für die Champions League qualifiziert – Gegner: ${st.clubs[id].name}!`);}
    if(Object.keys(ent).length)st.cl={season:st.season,ent};
  }
  st.phase='seasonEnd';st.ready={};
}
function resolveCL(st){
  if(!st.cl)return [];
  const r=RNG(st.seed,'clplay'+st.season);const results=[],winners=[];
  for(const pid of humans(st)){const oid=st.cl.ent[pid];if(!oid)continue;
    const m=playMatch(st,pid,oid,r,{cup:true,cupName:'Champions League',inj:[]});results.push(m);
    const c=st.clubs[pid];
    if(m.w===pid){winners.push(pid);c.trophies.push('Champions League '+st.season);feed(st,`🏆⭐ ${c.name} gewinnt die Champions League gegen ${st.clubs[oid].name}!`);}
    else{const old=c.fame;c.fame=Math.floor(c.fame/2);feed(st,`${c.name} verliert das CL-Finale gegen ${st.clubs[oid].name} – die Sterne halbieren sich (${old} → ${c.fame}).`);}
  }
  st.last={season:st.season,md:'CL',results,cards:{}};
  st.cl.done=true;
  return winners;
}

function devHuman(st,c,r){
const dev=[],gone=[];
    const loans=c.squad.filter(p=>p.loan);for(const p of loans)gone.push(`${p.name} (Leihende)`);
    c.squad=c.squad.filter(p=>!p.loan);
    const keep=[];
    for(const p of c.squad){
      p.age++;p.inj=0;
      if(p.age>=34&&(p.age>=36||r.chance(0.5))){gone.push(`${p.name} (Karriereende mit ${p.age})`);continue;}
      let d=p.age<=21?r.int(1,4):p.age<=24?r.int(0,3):p.age<=28?r.int(-1,2):p.age<=31?r.int(-2,1):r.int(-4,0);
      if(p.age<=26){const b=(c.up.training-1)*0.5;d+=Math.floor(b)+(r.f()<b-Math.floor(b)?1:0);}
      if(statsOn(st)){p.gs=0;p.as=0;}
      let eb=0;if(st.rv>=5){const share=(p.apps||0)/Math.max(1,st.schedule.length);if(p.age<=24)eb=share>=0.7?2:share>=0.4?1:0;d+=eb;p.apps=0;}
      const before=p.rat;let nr=p.rat+d;if(d>0)nr=Math.min(nr,Math.max(p.pot,p.rat));nr=clamp(nr,35,95);
      p.rat=nr;if(p.pot<p.rat)p.pot=p.rat;
      if(nr!==before)dev.push({n:p.name,a:before,b:nr,age:p.age,eb});
      keep.push(p);
    }
    c.squad=keep;
    const youth=[];
    if(c.squad.length<SQUAD_MAX){const y=genYouth(st,r,c);c.squad.push(y);youth.push(`${y.name} (${POSL[y.pos]}, ${y.rat})`);}
    const amateurs=[];
    const need=pos=>c.squad.filter(p=>p.pos===pos).length;
    if(need('G')<1){const p={id:newId(st),name:pname(r),pos:'G',age:r.int(22,30),rat:50,pot:52,inj:0};c.squad.push(p);amateurs.push(p.name);}
    while(c.squad.length<SQUAD_MIN){const pos=r.pick(['D','M','A']);const p={id:newId(st),name:pname(r),pos,age:r.int(20,30),rat:r.int(48,54),inj:0};p.pot=p.rat+2;c.squad.push(p);amateurs.push(p.name);}
    c.moral=3;c.pending=null;c.buys=0;c.camp=null;if(st.rv>=3)c.hires=0;
    c.devReport={dev,gone,youth,amateurs};
}
function nextSeason(st){
  st.season++;
  const r=RNG(st.seed,'ns'+st.season);
  for(const pid of humans(st))devHuman(st,st.clubs[pid],r);
  for(const id of st.league){const c=st.clubs[id];if(c.human)continue;
    if(st.rv>=2){{const o=doff(st);for(const k of ['A','M','D'])c[k]=clamp(c[k]+r.int(-2,2)+(c[k]<66+o?1:c[k]>72+o?-1:0),58+o,80+o);}}
    else{c.A=clamp(c.A+r.int(-1,3),55,84);c.M=clamp(c.M+r.int(-1,3),55,84);c.D=clamp(c.D+r.int(-1,3),55,84);}}
  st.cl=null;
  st.market=genMarket(st,r,18);
  st.staffPool=genStaff(st,r,6);
  setupSeason(st);
  st.phase='offseason';st.offFirst=false;st.ready={};
  feed(st,`Sommerpause vor Saison ${st.season}: neuer Transfermarkt, neue Trainer auf Jobsuche.`);
}

function finishGame(st,win){
  win=win||[];st.clWinner=win.length?win:null;
  const ps=humans(st).slice().sort((a,b)=>{if(win.includes(a)!==win.includes(b))return win.includes(a)?-1:1;const A=st.clubs[a],B=st.clubs[b];return B.fame-A.fame||B.trophies.length-A.trophies.length||B.cash-A.cash||(a<b?-1:1);});
  st.final=ps;st.phase='over';st.ready={};
  feed(st,`Spielende! ${st.clubs[ps[0]].manager} macht ${st.clubs[ps[0]].name} zum Klub der Legenden.`);
}

function checkAdvance(st){
  const hs=humans(st);if(!hs.length||!hs.every(p=>st.ready[p]))return;
  if(st.phase==='offseason'){st.phase='matchday';st.ready={};st.offFirst=false;feed(st,`Anpfiff zur Saison ${st.season}!`);}
  else if(st.phase==='matchday')resolveMatchday(st);
  else if(st.phase==='seasonEnd'){
    if(st.rv>=2){const w=resolveCL(st);if(w.length)finishGame(st,w);else if(!seasonsLeft(st))finishGame(st);else nextSeason(st);}
    else{if(st.season>=st.settings.seasons)finishGame(st);else nextSeason(st);}
  }
}

function myClub(st,a){const c=st.clubs[a.by];if(!c||!c.human)rej('Du bist kein Manager in diesem Spiel.');return c;}
function needPhase(st,...ph){if(!ph.includes(st.phase))rej('Gerade nicht möglich.');}
function setLineup(c,lu){
  if(!lu||typeof lu!=='object'){c.lineup=null;return;}
  const ids=new Set(c.squad.map(p=>p.id)),seen=new Set(),out={};
  for(const k of ['G','D','M','A']){out[k]=[];for(const id of (Array.isArray(lu[k])?lu[k]:[]).slice(0,5)){if(ids.has(id)&&!seen.has(id)){seen.add(id);out[k].push(id);}}}
  c.lineup=out;
}
const H={

    names.forEach((n,i)=>{const b=r.int(63,71)+doff(st);st.clubs['n'+i]={id:'n'+i,human:false,name:n,color:NPC_COL[i%NPC_COL.length],A:b+r.int(-4,4),M:b+r.int(-4,4),D:b+r.int(-4,4)};});

    st.draft={pool,order:r.shuffle(st.players.map(p=>p.pid)),pick:0,total:n*15};

  PICK(st,a){needPhase(st,'draft');if(drafter(st)!==a.by)rej('Du bist nicht dran.');const c=st.clubs[a.by];
    const p=(st.draft.board||st.draft.pool).find(x=>x.id===a.player);if(!p)rej('Spieler ist weg.');if(!canTake(c,p.pos))rej(`Du hast schon genug ${POSL[p.pos]}.`);takeDraft(st,c,p);},
  AUTOPICK(st,a){needPhase(st,'draft');if(!isHuman(st,a.by)&&!isHost(st,a))rej('Nicht erlaubt.');autoPick(st);},
  AUTODRAFT(st,a){needPhase(st,'draft');if(!isHost(st,a))rej('Nur der Host.');while(st.draft&&st.draft.pick<st.draft.total)autoPick(st);},
  BUY(st,a){needPhase(st,'offseason');const c=myClub(st,a);if(st.ready[a.by])rej('Du bist schon bereit.');
    const p=st.market.find(x=>x.id===a.player);if(!p)rej('Der Spieler ist schon vergeben.');if(!visible(c,p))rej('Dein Scouting kennt diesen Spieler nicht.');

    st.market=st.market.filter(x=>x!==p);delete p.tier;p.inj=0;c.squad.push(p);money(c,-price);if(st.rv>=2)c.buys=(c.buys||0)+1;
    feed(st,`${c.name} holt ${p.name} (${POSL[p.pos]}, ${p.rat}) für ${price.toFixed(1).replace('.',',')} Mio.`,c.id);},
  SELL(st,a){needPhase(st,'offseason');const c=myClub(st,a);if(st.ready[a.by])rej('Du bist schon bereit.');
    const p=c.squad.find(x=>x.id===a.player);if(!p)rej('Spieler nicht im Kader.');if(p.loan)rej('Leihspieler kannst du nicht verkaufen.');

    money(c,-cost);c.up[a.kind]=l+1;feed(st,`${c.name} baut ${UPS[a.kind].n} auf Stufe ${l+1} aus.`,c.id);},
  HIRE(st,a){needPhase(st,'offseason');const c=myClub(st,a);if(st.ready[a.by])rej('Du bist schon bereit.');
    const s=st.staffPool.find(x=>x.id===a.staff);if(!s)rej('Schon vergeben.');if(c.staff.length>=3)rej('Maximal 3 Mitarbeiter.');
    if(has(c,s.type))rej('Diese Position ist schon besetzt.');if(st.rv>=3&&(c.hires||0)>=1)rej('Nur eine Neueinstellung pro Sommerpause.');if(c.cash<s.fee)rej('Nicht genug Geld.');
    st.staffPool=st.staffPool.filter(x=>x!==s);c.staff.push(s);money(c,-s.fee);if(st.rv>=3)c.hires=(c.hires||0)+1;feed(st,`${c.name} stellt ${s.name} als ${STAFF[s.type].n} ein.`,c.id);},
  FIRE(st,a){needPhase(st,'offseason');const c=myClub(st,a);if(st.ready[a.by])rej('Du bist schon bereit.');
    const s=c.staff.find(x=>x.id===a.staff);if(!s)rej('Nicht gefunden.');c.staff=c.staff.filter(x=>x!==s);feed(st,`${c.name} trennt sich von ${s.name}.`,c.id);},
  LOAN(st,a){needPhase(st,'offseason','matchday');const c=myClub(st,a);if(c.debt+5>30)rej('Die Bank gibt nicht mehr als 30 Mio.');c.debt+=5;money(c,5);},
  REPAY(st,a){needPhase(st,'offseason','matchday');const c=myClub(st,a);if(c.debt<5)rej('Keine Schulden.');if(c.cash<5)rej('Nicht genug Geld.');c.debt-=5;money(c,-5);},
  CHOOSE(st,a){const c=myClub(st,a);const pd=c.pending;if(!pd)rej('Keine offene Entscheidung.');const card=CARDS.find(x=>x.k===pd.k);

function reduce(st,a){

  if(a.type==='CREATE')return st;

}

function CR(st){return RNG(st.seed,'c'+(st.rc++));}
function mktRate(c){return Math.round(SPON[c.lg]*0.6/18*1000)/1000;}
function careerEcon(st,c){const t=c.lg;return{ticket:r2(Math.min(c.fans,CCAP[c.up.stadium])*TPRICE[t]/1e6),win:WINB[t]};}
function clubName(r,used){for(let i=0;i<200;i++){const n=r.pick(PREF)+' '+r.pick(TOWNS);if(!used.has(n)){used.add(n);return n;}}return 'SV '+used.size;}
function lgClubs(st,L){return st.order[L];}
function careerTable(st,L){return st.order[L].map(id=>({id,...st.tables[L][id]})).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||(a.id<b.id?-1:1));}

    market:[],staffPool:[],ready:{},last:null,feed:[],history:[],offFirst:true,cups:{},spOffers:null,cl:null};

      st.clubs[id]={id,human:false,lg:L,name:clubName(r,used),color:NPC_COL[k%NPC_COL.length],A:b+r.int(-3,3),M:b+r.int(-3,3),D:b+r.int(-3,3)};st.order[L].push(id);}

function careerSetupSeason(st){
  st.ss={};

  for(let L=1;L<=4;L++){
    const ids=r.shuffle(st.order[L]);let rr=roundRobin(ids);rr=rr.concat(rr.map(m=>m.map(([a,b])=>[b,a])));
    st.sched[L]=rr;st.tables[L]={};for(const id of st.order[L])st.tables[L][id]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
  }

  let l3=r.shuffle(st.order[3]);let pick3=l3.slice(0,6);if(me.lg===3&&!pick3.includes('me'))pick3[0]='me';
  st.cups={kreis:{name:'Kreispokal',mds:CMD_KREIS,alive:r.shuffle(st.order[4].concat(pick3)),log:[],winner:null},land:null};
}

  ];

function careerCupRound(st,cup,r,inj,results){
  const ci=cup.mds.indexOf(st.md);if(ci<0||cup.winner)return;
  const al=cup.alive,win=[],ms=[];const rn=CUPR[4-Math.log2(al.length)]||'Runde';
  for(let i=0;i<al.length;i+=2){
    const h=st.clubs[al[i]],a=st.clubs[al[i+1]];
    const m=playMatch(st,al[i],al[i+1],r,{cup:true,cupName:cup.name+' · '+rn,inj});ms.push(m);win.push(m.w);
    if(h.human||a.human)results.push(m);
    const me=st.clubs.me;if(m.w==='me')money(me,cup.name==='Kreispokal'?0.01:0.15);
  }
  cup.log.push({round:rn,ms:ms.map(m=>({h:m.h,a:m.a,gh:m.gh,ga:m.ga,pens:m.pens,w:m.w}))});
  cup.alive=win;
  if(win.length===1){cup.winner=win[0];feed(st,`🏆 ${st.clubs[win[0]].name} gewinnt den ${cup.name}!`);
    if(win[0]==='me'){const c=st.clubs.me;c.trophies.push(cup.name+' '+st.season);money(c,cup.name==='Kreispokal'?0.04:1);c.fans+=Math.round(c.fans*0.1);}}
}
function careerResolve(st){

    for(const [h,a] of st.sched[L][st.md]){const m=playMatch(st,h,a,r,{cup:false,inj});m.lg=L;(L===me.lg?results:other).push(m);}}

    const l2=r.shuffle(st.order[2].filter(x=>x!=='me')).slice(0,me.lg===2?4:5);if(me.lg===2)l2.push('me');
    const parts=st.order[1].concat(l2,[st.cups.kreis.winner]);
    st.cups.land={name:'Landespokal',mds:CMD_LAND,alive:r.shuffle(parts),log:[],winner:null};
    if(st.cups.kreis.winner==='me')feed(st,`⭐ Als Kreispokalsieger spielt ${me.name} im Landespokal gegen die Großen!`);
  }
  if(st.cups.land)careerCupRound(st,st.cups.land,r,inj,results);

  const F=SPON[me.lg];const card=r.wpick(CCARDS);const data=card.prep?card.prep(me,r,st,F):{};
  const cards={};
  if(card.prep&&!data)cards.me={t:'Ruhige Woche',x:'Keine Schlagzeilen.',g:1};
  else{const x=card.run(me,r,st,F,data);cards.me={t:card.t,x,g:card.g};if(card.opts){me.pending={k:card.k,t:card.t,x,opts:card.opts,data,career:true};cards.me.choice=true;}}
  st.last={season:st.season,md:st.md,results,other,cards};
  st.md++;st.ready={};
  if(st.md>=18)careerEndSeason(st);
}
function careerEndSeason(st){
  const me=st.clubs.me;const t=me.lg;const r=CR(st);
  const tb={};for(let L=1;L<=4;L++)tb[L]=careerTable(st,L);
  const place=tb[t].findIndex(x=>x.id==='me')+1;
  const champs={};for(let L=1;L<=4;L++)champs[L]=tb[L][0].id;
  if(place===1){me.trophies.push(`Meister ${LNAME[t]} ${st.season}`);}
  // Auf-/Abstieg
  const moves=[];
  for(let L=1;L<=3;L++){const down=tb[L].slice(-2).map(x=>x.id),up=tb[L+1].slice(0,2).map(x=>x.id);moves.push([L,down,up]);}
  const newOrder={1:st.order[1].slice(),2:st.order[2].slice(),3:st.order[3].slice(),4:st.order[4].slice()};
  for(const [L,down,up] of moves){newOrder[L]=newOrder[L].filter(x=>!down.includes(x)).concat(up);newOrder[L+1]=newOrder[L+1].filter(x=>!up.includes(x)).concat(down);}
  let status='Klassenerhalt';
  for(let L=1;L<=4;L++)for(const id of newOrder[L]){const c=st.clubs[id];if(id==='me'){if(L<t)status='Aufstieg';else if(L>t)status='Abstieg';}c.newLg=L;}
  if(t===1&&place===1)status='Meister';
  // Finanzen
  const fin=[];const tv=r2(TVB[t]*(1.25-0.05*(place-1)));fin.push(['TV-Geld',tv]);
  const sp=me.spon;if(sp){fin.push(['Sponsor '+sp.n,sp.amount]);if(sp.type==='goal'){const ok=sp.goal==='Top 3'?place<=3:status==='Aufstieg'||place===1;if(ok)fin.push(['Sponsor-Bonus ('+sp.goal+')',sp.bonus]);}}
  const sal=r2(me.squad.reduce((s,p)=>s+salary(p),0)),ssal=r2(me.staff.reduce((s,x)=>s+x.sal,0));
  fin.push(['Gehälter Spieler',-sal]);if(ssal)fin.push(['Gehälter Staff',-ssal]);
  if(status==='Aufstieg'){const nl=t-1;fin.push(['Aufstiegsprämie',r2(TVB[nl]*0.5)]);}
  if(me.debt>0)fin.push(['Kreditzinsen (10 %)',-r2(me.debt*0.1)]);
  for(const f of fin)money(me,f[1]);
  if(me.mktPaid){fin.splice(sp?(fin.length>2&&fin[2][0].startsWith('Sponsor-Bonus')?3:2):1,0,['Marketingchef (schon ausgezahlt)',r2(me.mktPaid)]);me.mktPaid=0;}
  let emer=0;const ls=LOANS[t];while(me.cash<0&&emer<20){money(me,ls);me.debt=r2(me.debt+ls);emer++;}

  me.report={season:st.season,place,lg:t,status,fin};
  const tops={};for(let L=1;L<=4;L++)tops[L]=topScorer(st,e=>e.lg===L);
  st.history.push({season:st.season,lg:t,place,status,champs:Object.assign({},champs),kreis:st.cups.kreis.winner,land:st.cups.land&&st.cups.land.winner,tops});
  st.pendingMoves=newOrder;
  feed(st,`Saison ${st.season} beendet: ${me.name} wird ${place}. in der ${LNAME[t]} – ${status}!`);
  for(let L=1;L<=4;L++)feed(st,`🥇 ${st.clubs[champs[L]].name} ist Meister der ${LNAME[L]}.`);
  st.cl=null;
  if(t===1&&place===1){const nat=r.chance(0.4);const base=nat?r.int(78,84):r.int(77,83);const id='clX'+st.season;
    st.clubs[id]={id,human:false,cl:true,name:nat?r.pick(CL_NATIONS):r.pick(CL_CLUBS),color:'#c9a227',A:base+r.int(-2,2),M:base+r.int(-2,2),D:base+r.int(-2,2)};
    st.cl={season:st.season,ent:{me:id}};feed(st,`⭐ Als Meister der 1. Liga spielt ${me.name} das Champions-League-Finale gegen ${st.clubs[id].name}!`);}
  st.phase='seasonEnd';st.ready={};
}
function careerNext(st){

    if(m.w==='me'){me.trophies.push('Champions League '+st.season);money(me,10);me.fans+=Math.round(me.fans*0.15);feed(st,`🏆⭐ ${me.name} gewinnt die Champions League!`);}
    else feed(st,`${me.name} verliert das CL-Finale gegen ${st.clubs[oid].name}.`);}
  const oldLg=me.lg;
  st.order=st.pendingMoves;st.pendingMoves=null;
  for(let L=1;L<=4;L++)for(const id of st.order[L]){const c=st.clubs[id];c.lg=L;delete c.newLg;
    if(!c.human)for(const k of ['A','M','D'])c[k]=clamp(Math.round(c[k]+(TMEAN[L]-c[k])*0.35+r.int(-2,2)),40,88);}

  me.fans=Math.round(me.fans+(EXPFANS[me.lg]-me.fans)*0.4);
  careerSetupSeason(st);careerOffseason(st,false);
  feed(st,`Sommerpause vor Saison ${st.season}: ${me.name} spielt in der ${LNAME[me.lg]}.`);
}

    const cost=(a.kind==='stadium'?CUPCOST:CUPCOST2)[l];if(c.cash<cost)rej('Nicht genug Geld.');money(c,-cost);c.up[a.kind]=l+1;feed(st,`${c.name} baut ${UPS[a.kind].n} auf Stufe ${l+1} aus.`,c.id);},
  LOAN(st,a){const c=st.clubs.me;const s=LOANS[c.lg];if(c.debt+s>s*6+0.001)rej(`Die Bank gibt höchstens ${fm(s*6)}.`);c.debt=r2(c.debt+s);money(c,s);},
  REPAY(st,a){const c=st.clubs.me;const s=Math.min(c.debt,LOANS[c.lg]);if(s<=0)rej('Keine Schulden.');if(c.cash<s)rej('Nicht genug Geld.');c.debt=r2(c.debt-s);money(c,-s);},
  CAMP(st,a){needPhase(st,'matchday');const c=st.clubs.me;if(c.campSeason===st.season)rej('Diese Saison gab es schon ein Camp.');const big=a.size===2;const cost=r2(CAMPC[c.lg]*(big?2:1));if(c.cash<cost)rej('Nicht genug Geld.');
    const r=CR(st);const kids=[];
    for(let i=0;i<(big?4:2);i++){const pos=r.wpick([{v:'G',w:1},{v:'D',w:3},{v:'M',w:3},{v:'A',w:3}]).v;let rat=r.int(34,58)+Math.round((TMEAN[c.lg]-50)*0.6);if(r.chance(0.18))rat+=r.int(10,24);rat=clamp(rat,34,84);kids.push({id:newId(st),name:pname(r),pos,age:r.int(16,19),rat,pot:Math.min(94,rat+r.int(0,26)),inj:0});}
    money(c,-cost);c.campSeason=st.season;c.camp={kids};feed(st,`${c.name} veranstaltet ein Sichtungscamp.`,c.id);},
  CHOOSE(st,a){const c=st.clubs.me;const pd=c.pending;if(!pd)rej('Keine offene Entscheidung.');const card=CCARDS.find(x=>x.k===pd.k);c.pending=null;c.lastChoice={t:pd.t,x:card.choose(c,a.opt===0?0:1,st,pd.data)};},
  SPONSOR(st,a){needPhase(st,'offseason');const o=st.spOffers.find(x=>x.id===a.offer);if(!o)rej('?');st.clubs.me.spon=Object.assign({},o);feed(st,`${st.clubs.me.name} unterschreibt bei ${o.n}.`,'me');},
  READY(st,a){const c=st.clubs.me;
    if(st.phase==='offseason'){if(!c.spon)rej('Wähle zuerst einen Sponsor (Büro).');if(c.cash<0)rej('Kontostand negativ – verkaufe Spieler oder nimm einen Kredit auf.');st.phase='matchday';st.offFirst=false;feed(st,`Anpfiff zur Saison ${st.season}!`);return;}
    if(st.phase==='matchday'){if(c.pending)rej('Triff erst deine offene Entscheidung.');if(a.form&&FORM[a.form])c.form=a.form;if(a.tac&&TAC[a.tac])c.tac=a.tac;setLineup(c,a.lineup);careerResolve(st);return;}
    if(st.phase==='seasonEnd'){if(st.cl&&!st.cl.done){if(a.form&&FORM[a.form])c.form=a.form;if(a.tac&&TAC[a.tac])c.tac=a.tac;setLineup(c,a.lineup);}careerNext(st);}
  }
};

</script>
<script>
// ================= KLUBCHEF UI =================
const ui={view:'start',tab:null,sub:null,pos:'all',confirm:null,seat:null,loadMsg:'',jColor:COLORS[0],form:null,tac:null,openList:null,tickerShown:null};
const NET={mode:null,code:null,raw:[],unsub:null,db:null,user:null,pid:null,canWrite:null,lastMeta:'',timer:null,ready:false};
let ST=null,applied=[];const mySent=new Set();
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
function rnd(n,alpha){const a=new Uint32Array(n);crypto.getRandomValues(a);let s='';for(const x of a)s+=alpha[x%alpha.length];return s;}
const rid=n=>rnd(n,'abcdefghijkmnpqrstuvwxyz23456789');
const genCode=()=>rnd(5,'ABCDEFGHJKLMNPQRSTUVWXYZ23456789');
function me(){return NET.mode==='local'?ui.seat:NET.mode==='career'?'me':NET.pid;}
function myC(){if(!ST)return null;const c=ST.clubs[me()];return c&&c.human?c:null;}
function isHostMe(){return ST&&(ST.local||ST.host===me());}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fm(x){const a=Math.abs(x);if(a>0&&a<0.995){const k=Math.round(a*1000);return (x<0?'−':'')+(k>=10?Math.round(k/10)*10:k)+' Tsd.';}const v=Math.round(x*10)/10;return (v<0?'−':'')+Math.abs(v).toFixed(1).replace('.',',')+' Mio';}
function num(x){return Math.round(x).toLocaleString('de-DE');}
function ratCol(r){return r>=80?'var(--gold)':r>=72?'var(--acc)':r>=64?'var(--ink)':'var(--mut)';}
function val(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function toast(msg,ok){const t=document.createElement('div');t.className='toast'+(ok?' ok':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3400);}
function conf(key){if(ui.confirm===key){ui.confirm=null;return true;}ui.confirm=key;render();setTimeout(()=>{if(ui.confirm===key){ui.confirm=null;render();}},4000);return false;}
function cl(key,label,sure){return ui.confirm===key?(sure||'Sicher?'):label;}

// ---------- Netz ----------
async function send(type,p){
  p=p||{};
  let by=me();
  if(type==='CREATE')by=NET.mode==='local'?'L0':NET.pid;
  if(!by){toast('Wähle zuerst deinen Platz.');return;}
  const a=Object.assign({},p,{id:String(applied.length).padStart(5,'0')+'-'+rid(6),seq:applied.length,ts:Date.now(),by,type});
  if(NET.mode==='career'){
    try{const h=CH[type];if(h)h(ST,a);}catch(e){if(e instanceof Rej)toast(e.m);else{console.error(e);toast('Fehler: '+e.message);}}
    saveCareer();if(ui.lastPhase!==ST.phase){scrollTo(0,0);ui.tab=null;ui.sub=null;ui.confirm=null;}ui.lastPhase=ST.phase;render();checkTicker();return;
  }
  mySent.add(a.id);
  if(NET.mode==='local'){NET.raw.push(a);LS.set('kc:local',{raw:NET.raw});recompute();return;}
  try{await NET.db.collection(`g/${NET.code}/a`).doc(a.id).set(a);writeMeta();}
  catch(e){mySent.delete(a.id);const c=e&&e.code;
    toast(c==='permission-denied'?'Die Datenbank lehnt den Zug ab (Sicherheitsregeln prüfen).':c==='invalid_argument'?'Keine Schreibrechte – der Besitzer muss dich als Bearbeiter einladen.':c==='quota_exceeded'?'Der Speicher ist voll.':'Senden fehlgeschlagen – bitte nochmal versuchen.');}
}
function recompute(){
  const acts=NET.raw.slice().sort((x,y)=>(x.seq-y.seq)||(x.ts-y.ts)||(x.id<y.id?-1:x.id>y.id?1:0));
  let ok=applied.length<=acts.length;
  if(ok)for(let i=0;i<applied.length;i++)if(acts[i].id!==applied[i]){ok=false;break;}
  if(!ok){ST=null;applied=[];}
  for(let i=applied.length;i<acts.length;i++){
    const a=acts[i];
    try{ST=reduce(ST,a);}catch(e){if(e instanceof Rej){if(mySent.has(a.id))toast(e.m);}else console.error(e);}
    mySent.delete(a.id);applied.push(a.id);
  }
  if(ST){
    if(NET.mode==='local'&&!ST.players.some(p=>p.pid===ui.seat))ui.seat=ST.players[0]?ST.players[0].pid:null;
    if(NET.mode==='local'&&ST.phase==='draft')ui.seat=drafter(ST);
    if(ui.lastPhase&&ui.lastPhase!==ST.phase){scrollTo(0,0);ui.confirm=null;ui.tab=null;ui.sub=null;}
    ui.lastPhase=ST.phase;
    updateMine();
  }
  render();checkTicker();
}
async function writeMeta(){
  if(NET.mode!=='online'||!ST)return;
  const m={code:ST.code,phase:ST.phase,season:ST.season,seasons:ST.settings.seasons,clubs:ST.players.map(p=>p.club)};
  const k=JSON.stringify(m);if(k===NET.lastMeta)return;NET.lastMeta=k;
  try{await NET.db.doc('g/'+ST.code).set(Object.assign({},m,{updated:Date.now()}));}catch(e){}
}
function saveCareer(){if(ST&&ST.career)LS.set('kc:career',ST);}
function rememberGame(code){const l=LS.get('kc:mine',[]).filter(x=>x.code!==code);l.unshift({code,t:Date.now(),club:''});LS.set('kc:mine',l.slice(0,8));}
function updateMine(){if(NET.mode!=='online')return;const c=myC();if(!c)return;const l=LS.get('kc:mine',[]);const e=l.find(x=>x.code===ST.code);if(e&&e.club!==c.name){e.club=c.name;LS.set('kc:mine',l);}}
function cleanup(){ui.lastPhase=null;CAREER_VAL=false;if(NET.unsub){try{NET.unsub();}catch(e){}}NET.unsub=null;clearTimeout(NET.timer);ST=null;applied=[];NET.raw=[];NET.lastMeta='';ui.tab=null;ui.sub=null;ui.form=null;ui.tac=null;ui.lu=undefined;ui.loadMsg='';}
async function openGame(code,create){
  cleanup();NET.mode='online';NET.code=code;ui.view='game';
  const pids=LS.get('kc:pids',{});NET.pid=pids[code]||('m'+rid(8));pids[code]=NET.pid;LS.set('kc:pids',pids);
  rememberGame(code);render();
  NET.timer=setTimeout(()=>{if(!ST){ui.loadMsg=create?'Keine Verbindung zur Datenbank.':'Spiel nicht gefunden – stimmt der Code?';render();}},10000);
  NET.unsub=NET.db.collection(`g/${code}/a`).onSnapshot(snap=>{
    NET.raw=snap.docs.map(d=>d.data());
    if(!snap.metadata.fromCache)clearTimeout(NET.timer);
    recompute();
  },err=>{clearTimeout(NET.timer);ui.loadMsg='Verbindung unterbrochen ('+(err&&err.code||'?')+'). Öffne das Spiel bitte neu.';render();});
  if(create)await send('CREATE',{seed:rid(12),code,rv:6,settings:{seasons:0,double:false,draft:'manual',diff:'normal'}});
}
async function loadOpen(){
  if(!NET.db)return;
  try{const s=await NET.db.collection('g').orderBy('updated','desc').limit(15).get();ui.openList=s.docs.map(d=>d.data());}catch(e){ui.openList=[];}
  if(ui.view==='start')render();
}

// ---------- Rendern ----------
function saveInputs(){const o={};document.querySelectorAll('#app input[id]').forEach(i=>o[i.id]=i.value);const f=document.activeElement;return{o,f:f&&f.id&&f.tagName==='INPUT'?f.id:null,s:f&&f.selectionStart};}
function restoreInputs(k){for(const id in k.o){const i=document.getElementById(id);if(i)i.value=k.o[id];}if(k.f){const i=document.getElementById(k.f);if(i){i.focus();try{i.setSelectionRange(k.s,k.s);}catch(e){}}}}
function render(){const app=document.getElementById('app');const k=saveInputs();app.innerHTML=ui.view==='start'?vStart():vGame();restoreInputs(k);}

function rulesCard(){return `<div class="card"><details><summary>So funktioniert's</summary><div class="small" style="margin-top:8px">
<p><b>Ziel:</b> Gewinne die <b>Champions League</b>. Dafür brauchst du am Saisonende 50 Sterne ★ oder 3 Meistertitel. Verlierst du das CL-Finale, halbieren sich deine Sterne.</p>
<p><b>1. Draft:</b> Alle 8 Vereine – auch die Computer – wählen reihum aus 10 ausliegenden Spielern, nach jedem Pick wird nachgelegt. Jede Runde beginnt ein anderer Klub. Du brauchst 15 Spieler: 2 Torhüter, 5 Abwehr, 5 Mittelfeld, 3 Sturm.</p>
<p><b>2. Sommerpause:</b> Bis zu 2 Spieler kaufen, beliebig verkaufen, bis zu 3 Mitarbeiter einstellen, Trainingszentrum, Scouting, Stadion und Jugendakademie ausbauen, notfalls Kredit aufnehmen. Wer fertig ist, tippt auf <i>Bereit</i>.</p>
<p><b>3. Spieltage:</b> Formation, Taktik und – wenn du willst – deine Startelf selbst wählen. Spieler bis 24 mit viel Einsatzzeit entwickeln sich schneller. Konter schlägt offensive und pressende Gegner, Pressing gewinnt das Mittelfeld, Defensiv mauert. Sind alle bereit, wird simuliert – mit Live-Ticker, Verletzungen und einer Ereigniskarte für jeden.</p>
<p><b>Pokal:</b> Läuft nebenher mit Viertelfinale, Halbfinale und Finale.</p><p><b>Sichtungscamp:</b> Einmal pro Saison Talente (16–19) für 1–2 Mio sichten – mit etwas Glück ist ein Rohdiamant dabei.</p>
<p><b>Saisonende:</b> Ruhm für die Platzierung (10/7/5/4/3/2/1/0), Pokalsieg +5, Finale +2, Stadion-Prestige. Geld gibt es aus TV-Vertrag, Sponsoring und dem Ausgleichsbonus (Letzter 5 Mio … Meister 0), Gehälter und Zinsen gehen ab. Spieler altern, Talente wachsen, Veteranen hören auf.</p>
<p class="mut">Ein eigenständiges Spiel – Vereine und Spieler sind frei erfunden.</p></div></details></div>`;}

function vStart(){
  const online=!!NET.db;
  let h=`<div class="hero"><div class="logo">KLUB<span>CHEF</span></div><div class="mut">Das Fußballmanager-Spiel für eure Runde</div></div>`;
  h+=`<div class="card"><h3>Online spielen</h3>`;
  if(!NET.ready)h+='<p class="mut small">Verbinde…</p>';
  else if(online){
    h+=`<p class="small mut">Jeder spielt auf seinem eigenen Handy. Erstelle ein Spiel und schick den Code an deine Freunde.</p>
    <button class="btn pri block" data-a="newOnline">Neues Spiel erstellen</button>
    <div class="row" style="margin-top:10px"><input type="text" id="codeIn" placeholder="Spielcode" maxlength="5" autocapitalize="characters" autocomplete="off" style="margin:0;text-transform:uppercase"><button class="btn" data-a="joinCode">Beitreten</button></div>`;
    if(NET.canWrite===false)h+='<p class="small" style="color:var(--bad)">Du hast nur Leserechte. Bitte den Besitzer, dich als Bearbeiter einzuladen.</p>';
  }else h+=window.FIREBASE_CONFIG&&/DEIN/.test(window.FIREBASE_CONFIG.apiKey||'')?'<p class="small mut">Online ist noch nicht eingerichtet: Die Firebase-Konfiguration fehlt in der Datei. Lokal auf einem Gerät geht schon.</p>':'<p class="small mut">Online-Spiele sind gerade nicht verfügbar (keine Verbindung). Lokal auf einem Gerät geht immer.</p>';
  h+='</div>';
  if(online){
    const mine=LS.get('kc:mine',[]);
    const meta={};(ui.openList||[]).forEach(g=>meta[g.code]=g);
    if(mine.length)h+=`<div class="card"><h3>Meine Spiele</h3>${mine.map(g=>{const m=meta[g.code];return `<div class="pl"><div class="pn"><b>${esc(g.club||'Spiel')} <span class="tag">#${esc(g.code)}</span></b><span>${m?esc(phaseName(m.phase)+(m.phase!=='lobby'?' · Saison '+m.season+'/'+m.seasons:'')):'—'}</span></div><button class="btn sm" data-a="openGame" data-v="${esc(g.code)}">Öffnen</button></div>`;}).join('')}</div>`;
    const open=(ui.openList||[]).filter(g=>g.phase==='lobby'&&!mine.some(m=>m.code===g.code));
    h+=`<div class="card"><div class="row"><h3 style="margin:0">Offene Lobbys</h3><span class="sp"></span><button class="btn sm" data-a="refreshOpen">↻</button></div>${ui.openList===null?'<div class="empty">Lade…</div>':open.length?open.map(g=>`<div class="pl"><div class="pn"><b>#${esc(g.code)}</b><span>${esc((g.clubs||[]).join(', ')||'noch leer')}</span></div><button class="btn sm" data-a="openGame" data-v="${esc(g.code)}">Beitreten</button></div>`).join(''):'<div class="empty small">Gerade keine offenen Lobbys.</div>'}</div>`;
  }
  const car=LS.get('kc:career',null);
  h+=`<div class="card"><h3>⚽ Karriere</h3><p class="small mut">Allein gegen den Computer: Starte mit einem Dorfverein in der Kreisliga und arbeite dich durch 4 Ligen hoch – mit Auf- und Abstieg, Kreis- und Landespokal.</p>${car?`<div class="small" style="margin-bottom:8px">Gespeichert: <b>${esc(car.clubs.me.name)}</b> · Saison ${car.season} · ${LNAME[car.clubs.me.lg]}</div><button class="btn pri block" data-a="contCareer">Karriere fortsetzen</button>`:''}
  ${ui.newCar||!car?`<div style="margin-top:10px"><label class="small mut">Dein Name</label><input type="text" id="cName" maxlength="20" placeholder="z. B. Patrick"><label class="small mut">Vereinsname</label><input type="text" id="cClub" maxlength="24" placeholder="z. B. SV Schriesheim"><div class="chips">${COLORS.map(c=>`<span class="chip ${ui.jColor===c?'on':''}" data-a="color" data-v="${c}" style="padding:7px 9px"><span class="dot" style="background:${c}"></span></span>`).join('')}</div><button class="btn ok block" style="margin-top:12px" data-a="newCareer">${car?cl('newCareer','Neue Karriere starten','Alte Karriere überschreiben?'):'Karriere starten'}</button></div>`:`<button class="btn block" style="margin-top:8px" data-a="showNewCar">Neue Karriere…</button>`}</div>`;
  const loc=LS.get('kc:local',null);
  h+=`<div class="card"><h3>Ein Gerät</h3><p class="small mut">Alle Manager teilen sich ein Handy und wechseln oben den aktiven Manager.</p><div class="row">${loc?'<button class="btn" data-a="contLocal">Fortsetzen</button>':''}<button class="btn" data-a="newLocal">${loc?cl('newLocal','Neues lokales Spiel','Altes überschreiben?'):'Lokales Spiel starten'}</button></div></div>`;
  return h+rulesCard();
}
function phaseName(p){return{lobby:'Lobby',draft:'Draft',offseason:'Sommerpause',matchday:'Saison läuft',seasonEnd:'Saisonende',over:'Beendet'}[p]||p;}

function vGame(){
  if(!ST)return `<header><div class="top"><button class="ic" data-a="home">‹</button><div class="ttl">KLUBCHEF</div></div></header><div class="card empty">${ui.loadMsg?esc(ui.loadMsg):'Lade Spiel…'}</div>`;
  const tabs=tabsFor();if(!tabs.find(t=>t[0]===ui.tab))ui.tab=tabs[0][0];
  let h=header();
  if(NET.mode==='online'&&ST.phase!=='lobby'&&!myC())h+=claimCard(true);
  h+=VIEWS[ui.tab]();
  h+=readyBar();
  if(tabs.length>1)h+=`<nav><div class="in">${tabs.map(t=>`<button class="${ui.tab===t[0]?'on':''}" data-a="tab" data-v="${t[0]}"><i>${t[1]}</i>${t[2]}</button>`).join('')}</div></nav>`;
  return h;
}
function tabsFor(){
  if(ST.career)return{offseason:[['coffice','💼','Büro'],['market','🔁','Markt'],['squad','👕','Kader'],['cleague','🏆','Ligen'],['news','📰','News']],
    matchday:[['cmatch','⚽','Spieltag'],['squad','👕','Kader'],['cleague','🏆','Ligen'],['coffice','💼','Klub'],['news','📰','News']],
    seasonEnd:[['cseason','🏁','Saison'],['cleague','🏆','Ligen'],['squad','👕','Kader'],['news','📰','News']]}[ST.phase];
  return{lobby:[['lobby','🏟','Lobby']],
    draft:[['draft','📋','Draft'],['squad','👕','Kader'],['news','📰','News']],
    offseason:[['office','💼','Büro'],['market','🔁','Markt'],['squad','👕','Kader'],['league','🏆','Liga'],['news','📰','News']],
    matchday:[['match','⚽','Spieltag'],['squad','👕','Kader'],['league','🏆','Liga'],['office','💼','Klub'],['news','📰','News']],
    seasonEnd:[['season','🏁','Saison'],['league','🏆','Liga'],['squad','👕','Kader'],['news','📰','News']],
    over:[['over','🏆','Ergebnis'],['league','📊','Liga'],['news','📰','News']]}[ST.phase];
}
function header(){
  const c=myC();
  const ph={lobby:'Lobby',draft:'Draft',offseason:'Sommerpause',matchday:`Spieltag ${ST.md+1}/${ST.schedule.length}`,seasonEnd:'Saisonende',over:'Spielende'}[ST.phase];
  let seat='';
  if(NET.mode==='local'&&ST.players.length)seat=`<div class="row" style="margin-top:8px"><span class="small mut">Am Handy:</span><select data-ch="seat" style="flex:1">${ST.players.map(p=>`<option value="${esc(p.pid)}" ${p.pid===ui.seat?'selected':''}>${esc(p.name)} – ${esc(p.club)}${ST.ready[p.pid]?' ✓':''}</option>`).join('')}</select></div>`;
  return `<header><div class="top"><button class="ic" data-a="home">‹</button><div class="ttl">KLUBCHEF${NET.mode==='online'?`<small>#${esc(ST.code)}</small>`:''}</div>${['lobby','draft'].includes(ST.phase)?'':`<span class="pill">S${ST.season}/${ST.settings.seasons||'∞'}</span>`}<span class="pill">${ph}</span></div>
  ${c&&ST.phase!=='lobby'?`<div class="clubbar"><span class="dot" style="background:${c.color}"></span><b>${esc(c.name)}</b><span class="stat ${c.cash<0?'neg':''}">${fm(c.cash)}</span><span class="stat">${ST.career?esc(LNAME[c.lg]):'★ '+c.fame}</span></div>`:''}${seat}</header>`;
}
function claimCard(spect){
  const free=ST.players;if(!free.length)return '';
  return `<div class="card"><h3>${spect?'Du schaust zu':'Schon dabei?'}</h3><p class="small mut">${spect?'Bist du Manager in diesem Spiel (z. B. von einem anderen Gerät)? Tippe auf deinen Verein.':'Du bist auf einem anderen Gerät beigetreten? Tippe auf deinen Verein, um ihn hier weiterzuspielen.'}</p><div class="chips">${free.map(p=>`<span class="chip" data-a="claim" data-v="${esc(p.pid)}"><span class="dot" style="background:${p.color}"></span> ${esc(p.club)}</span>`).join('')}</div></div>`;
}
function prow(p,o){
  o=o||{};
  return `<div class="pl"><span class="pos ${p.pos}">${POSL[p.pos]}</span><span class="rt" style="color:${ratCol(p.rat)}">${p.rat}</span><div class="pn"><b>${esc(p.name)}${p.inj>0?`<span class="tag inj">🚑 ${p.inj}</span>`:''}${p.loan?'<span class="tag">Leihe</span>':''}${o.xi?'<span class="tag xi">Elf</span>':''}</b><span>${p.age} J. · Pot. ${o.pot?p.pot:'?'} · ${fm(value(p))}${o.sal?' · Gehalt '+fm(salary(p)):''}${o.apps?' · '+(p.apps||0)+' Einsätze':''}${o.st?` · ⚽ ${p.gs||0} · 🅰️ ${p.as||0}`:''}</span></div>${o.right||''}</div>`;

  if(ST.clubs[mgr[0]&&mgr[0].pid])h+=`<div class="card"><h3>Ruhm-Wertung</h3>${mgr.map((p,i)=>{const c=ST.clubs[p.pid];return `<div class="pl"><b style="width:18px">${i+1}</b>${dot(c)}<div class="pn"><b>${esc(c.name)}</b><span>${esc(p.name)}${ST.rv>=2?` · Meister ${titles(c)}/3`:''}${c.trophies.length?' · 🏆 '+esc(c.trophies.join(', ')):''}</span></div><b>★ ${c.fame}${ST.rv>=2?'<span class="tiny mut">/50</span>':''}</b></div>`;}).join('')}${ST.rv>=2?'<p class="tiny mut" style="margin:8px 0 0">⭐ Champions League: Wer am Saisonende 50 ★ oder 3 Meistertitel hat, spielt das CL-Finale. Sieg = Spielgewinn, Niederlage = Sterne halbiert.</p>':''}</div>`;
  if(ST.history.length)h+=`<div class="card"><h3>Chronik</h3>${ST.history.map(x=>`<div class="fin"><span>Saison ${x.season}</span><span class="small">🥇 ${esc(ST.clubs[x.champ].name)} · 🏆 ${x.cup?esc(ST.clubs[x.cup].name):'—'}${x.top?` · ⚽ ${esc(x.top.n)} (${x.top.g})`:''}</span></div>`).join('')}</div>`;
  return h;
},
news(){
  const f=ST.feed.slice().reverse();
  return `<div class="card"><h3>News</h3>${f.map(x=>`<div class="pl"><span class="tag" style="flex:none">S${x.s}</span><div class="pn small" style="white-space:normal">${esc(x.txt)}</div></div>`).join('')||'<div class="empty">Noch nichts los.</div>'}</div>`;
},
match(){
  const c=myC();let h='';
  if(c){
    const md=ST.md;const fx=ST.schedule[md].find(m=>m.includes(c.id));const home=fx[0]===c.id;const opp=ST.clubs[home?fx[1]:fx[0]];
    const form=ui.form||c.form,tac=ui.tac||c.tac,rd=!!ST.ready[me()];
    const ci=ST.cupMds.indexOf(md);let cupOpp=null;
    if(ci>=0&&!ST.cup.winner){const i=ST.cup.alive.indexOf(c.id);if(i>=0)cupOpp=ST.clubs[ST.cup.alive[i^1]];}
    const R=teamRat(Object.assign({},c,{lineup:curLu(c)}),form,tac,'bal',home);const O=teamRat(opp,opp.human?opp.form:'4-4-2','bal',tac,!home);
    if(c.pending){h+=`<div class="evc"><div class="tiny mut">EREIGNISKARTE – ENTSCHEIDUNG</div><b>🃏 ${esc(c.pending.t)}</b><div class="small" style="margin:4px 0 10px">${esc(c.pending.x)}</div><div class="row">${c.pending.opts.map((o,i)=>`<button class="btn sm ${i===0?'pri':''}" data-a="choose" data-v="${i}">${esc(o)}</button>`).join('')}</div></div>`;}
    else if(c.lastChoice&&ST.last&&ST.last.cards[c.id]&&ST.last.cards[c.id].choice){h+=`<div class="evc"><b>🃏 ${esc(c.lastChoice.t)}</b><div class="small">${esc(c.lastChoice.x)}</div></div>`;}
    h+=`<div class="card"><div class="mut small">Spieltag ${md+1} · ${home?'Heimspiel':'Auswärtsspiel'}</div><h3 style="margin:4px 0">${esc(c.name)} ${home?'vs':'@'} ${esc(opp.name)}</h3>${cupOpp?`<div class="small">🏆 Außerdem ${esc(CUPN[ci])}: gegen <b>${esc(cupOpp.name)}</b></div>`:''}
    <div class="row tiny mut" style="margin-top:10px"><span style="width:82px"></span><span class="sp">Du</span><span>${esc(opp.name)}${opp.human?' (geschätzt)':''}</span></div>
    ${rbar('Angriff',R.A,O.A)}${rbar('Mittelfeld',R.M,O.M)}${rbar('Abwehr',R.D,O.D)}</div>`;
    h+=tacPicker(c,form,tac,rd);
    h+=luCard(c,form,rd);
    h+=campCard(c,rd);
  }
  if(ST.last&&ST.last.season===ST.season){
    const L=ST.last;const mine=c?L.results.filter(m=>m.h===c.id||m.a===c.id):[];const card=c&&L.cards[c.id];
    h+=`<div class="card"><h3>Spieltag ${L.md+1} – Ergebnisse</h3>${mine.map(resLine).join('')}${mine.length?'<button class="btn sm" style="margin:8px 0" data-a="ticker">▶ Ticker ansehen</button>':''}${card?`<div class="evc ${card.g?'':'bad'}"><b>🃏 ${esc(card.t)}</b><div class="small">${esc(card.x)}</div></div>`:''}<h4>Alle Spiele</h4>${L.results.filter(m=>!mine.includes(m)).map(resLine).join('')}</div>`;
  }else if(!c)h+='<div class="card empty">Die Saison beginnt gleich.</div>';
  return h;
},
season(){
  const c=myC();const H=ST.history[ST.history.length-1];
  let h=`<div class="card" style="text-align:center"><div class="mut small">Saison ${ST.season} beendet</div><div class="h" style="font-size:30px;margin:6px 0">🥇 ${esc(ST.clubs[H.champ].name)}</div><div>🏆 Pokal: <b>${H.cup?esc(ST.clubs[H.cup].name):'—'}</b></div></div>`;
  if(c&&c.report){const R=c.report;const tot=R.fin.reduce((s,x)=>s+x[1],0);const ft=R.fame.reduce((s,x)=>s+x[1],0);
    h+=`<div class="card"><h3>Dein Abschluss · Platz ${R.place}</h3>${R.fin.map(([l,v])=>`<div class="fin"><span>${esc(l)}</span><span class="${v<0?'neg-p':'pos-p'}">${v>0?'+':''}${fm(v)}</span></div>`).join('')}<div class="fin t"><span>Saldo</span><span>${tot>0?'+':''}${fm(tot)}</span></div><h4>Ruhm</h4>${R.fame.map(([l,v])=>`<div class="fin"><span>${esc(l)}</span><span>${v>0?'+':''}${v} ★</span></div>`).join('')}<div class="fin t"><span>Diese Saison</span><span>${ft>=0?'+':''}${ft} ★</span></div></div>`;}
  if(ST.cl){
    const mine=c&&ST.cl.ent[c.id];
    if(mine){const o=ST.clubs[mine];const form=ui.form||c.form,tac=ui.tac||c.tac,rd=!!ST.ready[me()];
      const R=teamRat(Object.assign({},c,{lineup:curLu(c)}),form,tac,'bal',true),O=teamRat(o,'4-4-2','bal',tac,false);
      h+=`<div class="evc" style="border-color:var(--gold)"><div class="tiny" style="color:var(--gold)">⭐ CHAMPIONS LEAGUE – FINALE</div><div class="h" style="font-size:28px;margin:4px 0">${esc(c.name)} vs ${esc(o.name)}</div><div class="small">Gewinnst du, gewinnst du das ganze Spiel. Verlierst du, halbieren sich deine Sterne.</div>
      <div class="row tiny mut" style="margin-top:10px"><span style="width:82px"></span><span class="sp">Du</span><span>${esc(o.name)}</span></div>${rbar('Angriff',R.A,O.A)}${rbar('Mittelfeld',R.M,O.M)}${rbar('Abwehr',R.D,O.D)}</div>`;
      h+=tacPicker(c,form,tac,rd);h+=luCard(c,form,rd);}
    const others=Object.keys(ST.cl.ent).filter(p=>!c||p!==c.id);
    if(others.length)h+=`<div class="card"><h3>⭐ Champions League</h3>${others.map(p=>`<div class="small">${esc(ST.clubs[p].name)} spielt gegen <b>${esc(ST.clubs[ST.cl.ent[p]].name)}</b>.</div>`).join('')}</div>`;
  }
  h+=`<div class="card"><h3>Abschlusstabelle</h3>${tableHtml(true)}</div>`;
  return h;
},
over(){
  const F=ST.final||[];const w=ST.clubs[F[0]];
  let h=`<div class="hero"><div class="mut small">Nach ${ST.season} Saison${ST.season>1?'s':''}</div><div class="logo" style="font-size:44px">🏆 ${esc(w.manager)}</div><div>${ST.clWinner?`gewinnt mit <b>${esc(w.name)}</b> die Champions League!`:`macht <b>${esc(w.name)}</b> zum Klub der Legenden`}</div></div>`;
  h+=`<div class="card"><h3>Endstand</h3>${F.map((pid,i)=>{const c=ST.clubs[pid];return `<div class="pl"><b style="width:18px">${i+1}</b>${dot(c)}<div class="pn"><b>${esc(c.name)}</b><span>${esc(c.manager)} · ${c.trophies.length?'🏆 '+esc(c.trophies.join(', ')):'ohne Titel'} · ${fm(c.cash)}</span></div><b>★ ${c.fame}</b></div>`;}).join('')}</div>`;
  h+='<button class="btn pri block" data-a="home">Zurück zum Start</button>';
  return h;
}
};

// ---------- Live-Ticker ----------
let TK=null;
function checkTicker(){
  if(!ST||!ST.last)return;const c=myC();if(!c)return;
  const tag=`${ST.code}:${me()}:${ST.last.season}-${ST.last.md}`;
  if(ui.tickerShown===tag)return;
  const seen=LS.get('kc:seen',{});const key=ST.code+':'+(ST.career?ST.seed+':':'')+me();
  ui.tickerShown=tag;
  if(seen[key]===`${ST.last.season}-${ST.last.md}`)return;
  seen[key]=`${ST.last.season}-${ST.last.md}`;LS.set('kc:seen',seen);
  showTicker();
}
function showTicker(){
  const c=myC();if(!c||!ST.last)return;
  const ms=ST.last.results.filter(m=>m.h===c.id||m.a===c.id);if(!ms.length)return;
  if(TK&&TK.iv)clearInterval(TK.iv);
  TK={ms,i:0,min:0,card:ST.last.cards[c.id],showCard:false,md:ST.last.md};
  document.getElementById('ov').style.display='flex';
  runTicker();
}
function runTicker(){clearInterval(TK.iv);TK.min=0;drawTicker();TK.iv=setInterval(()=>{TK.min++;if(TK.min>=90){TK.min=90;clearInterval(TK.iv);}drawTicker();},75);}
function drawTicker(){
  const box=document.getElementById('ovb');
  if(TK.showCard){const k=TK.card;box.innerHTML=`<div class="row"><span class="pill">Ereigniskarte</span><span class="sp"></span><button class="ic" data-ov="close">✕</button></div><div class="evc ${k.g?'':'bad'}" style="margin-top:12px;padding:18px"><div class="h" style="font-size:28px">🃏 ${esc(k.t)}</div><div>${esc(k.x)}</div>${k.choice?'<p class="small" style="margin-bottom:0"><b>Deine Entscheidung ist gefragt</b> – im Spieltag-Tab.</p>':''}</div><button class="btn pri block" data-ov="close">Weiter</button>`;return;}
  const m=TK.ms[TK.i];const H=ST.clubs[m.h],A=ST.clubs[m.a];
  const ev=m.ev.filter(e=>e.m<=TK.min);let gh=0,ga=0;for(const e of ev)if(e.t==='g'){if(e.s==='h')gh++;else ga++;}
  const done=TK.min>=90;
  const more=TK.i<TK.ms.length-1;
  box.innerHTML=`<div class="row"><span class="pill">${m.cup?'Pokal · '+esc(m.cup):'Liga · Spieltag '+(TK.md+1)}</span><span class="sp"></span><button class="ic" data-ov="close">✕</button></div>
  <div class="score"><div class="tm">${dot(H)}<br>${esc(H.name)}</div><div class="sc">${gh}:${ga}</div><div class="tm">${dot(A)}<br>${esc(A.name)}</div></div>
  <div class="row tiny mut"><span class="sp" style="text-align:center">${esc(TAC[m.th].n)}</span><span class="sp" style="text-align:center">${esc(TAC[m.ta].n)}</span></div>
  <div class="clock" style="margin-top:6px">${done?(m.pens?`Elfmeterschießen ${m.pens[0]}:${m.pens[1]}`:'Abpfiff'):TK.min+'′'}</div>
  <div style="margin-top:10px;min-height:120px">${ev.slice().reverse().map(e=>`<div class="tk ${e.s}"><span class="m">${e.m}′</span><span>${e.t==='g'?`⚽ <b>Tor!</b> ${esc(e.x)} <span class="mut">(${e.sc})</span>${e.as?`<br><span class="tiny mut">Vorlage: ${esc(e.as)}</span>`:''}`:e.t==='c'?`💨 Chance für ${esc(e.x)}`:`🚑 ${esc(e.x)} verletzt (${e.n} Sp.)`}</span></div>`).join('')||'<div class="mut small" style="text-align:center;padding-top:30px">Anpfiff…</div>'}</div>
  ${done?(more?'<button class="btn pri block" style="margin-top:12px" data-ov="next">Nächstes Spiel</button>':TK.card?'<button class="btn pri block" style="margin-top:12px" data-ov="card">Ereigniskarte aufdecken</button>':'<button class="btn pri block" style="margin-top:12px" data-ov="close">Schließen</button>'):'<button class="btn block" style="margin-top:12px" data-ov="skip">Überspringen</button>'}`;
}
document.getElementById('ov').addEventListener('click',e=>{
  const b=e.target.closest('[data-ov]');if(!b||!TK)return;const a=b.dataset.ov;
  if(a==='close'){clearInterval(TK.iv);document.getElementById('ov').style.display='none';TK=null;return;}
  if(a==='skip'){clearInterval(TK.iv);TK.min=90;drawTicker();}
  if(a==='next'){TK.i++;runTicker();}
  if(a==='card'){TK.showCard=true;drawTicker();}
});

// ---------- Aktionen ----------
const ACT={
  home(){cleanup();ui.view='start';NET.mode=null;render();loadOpen();scrollTo(0,0);},
  async newOnline(){await openGame(genCode(),true);},
  joinCode(){const code=val('codeIn').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==5){toast('Der Code hat 5 Zeichen.');return;}openGame(code,false);},
  openGame(v){openGame(v,false);},
  refreshOpen(){ui.openList=null;render();loadOpen();},
  newLocal(){if(LS.get('kc:local',null)&&!conf('newLocal'))return;cleanup();NET.mode='local';NET.raw=[];ui.seat=null;ui.view='game';LS.set('kc:local',{raw:[]});send('CREATE',{seed:rid(12),code:'LOKAL',local:true,rv:6,settings:{seasons:0,double:false,draft:'manual',diff:'normal'}});},
  contLocal(){cleanup();NET.mode='local';const d=LS.get('kc:local',{raw:[]});NET.raw=d.raw||[];ui.seat=null;ui.view='game';recompute();},
  copy(){const c=ST.code;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(c).then(()=>toast('Code kopiert: '+c,true)).catch(()=>toast('Code: '+c,true));else toast('Code: '+c,true);},
  color(v){ui.jColor=v;render();},
  join(){const name=val('jName'),club=val('jClub');if(!name||!club){toast('Bitte Name und Vereinsname eingeben.');return;}
    const pid=NET.mode==='local'?'L'+rid(6):NET.pid;['jName','jClub'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
    if(NET.mode==='local'){const prev=ui.seat;ui.seat=pid;send('JOIN',{pid,name,club,color:ui.jColor});if(!ST.players.some(p=>p.pid===pid))ui.seat=prev;}
    else send('JOIN',{pid,name,club,color:ui.jColor});
    ui.jColor=COLORS[(COLORS.indexOf(ui.jColor)+1)%COLORS.length];},
  claim(v){NET.pid=v;const pids=LS.get('kc:pids',{});pids[ST.code]=v;LS.set('kc:pids',pids);ui.tickerShown=null;toast('Willkommen zurück!',true);render();},
  kick(v){if(conf('kick'+v))send('KICK',{pid:v});},
  set(v,k){const s=Object.assign({},ST.settings);s[k]=k==='seasons'?+v:k==='double'?v==='true':v;send('SETTINGS',{settings:s});},
  start(){send('START');},
  pick(v){send('PICK',{player:v});},
  autopick(){if(drafter(ST)!==me()&&!conf('autopick'))return;send('AUTOPICK');},
  autodraft(){if(conf('autodraft'))send('AUTODRAFT');},
  tab(v){ui.tab=v;ui.confirm=null;render();scrollTo(0,0);},
  sub(v){ui.sub=v;render();},
  pos(v){ui.pos=v;render();},
  buy(v){send('BUY',{player:v});},
  sell(v){if(conf('sell'+v))send('SELL',{player:v});},
  up(v){if(conf('up'+v))send('UPGRADE',{kind:v});},
  hire(v){send('HIRE',{staff:v});},
  fire(v){if(conf('fire'+v))send('FIRE',{staff:v});},
  loan(){send('LOAN');},
  repay(){send('REPAY');},
  form(v){ui.form=v;render();},
  tac(v){ui.tac=v;render();},
  choose(v){send('CHOOSE',{opt:+v});},
  ticker(){showTicker();},
  showNewCar(){ui.newCar=true;render();},
  newCareer(){const name=val('cName'),club=val('cClub');if(!name||!club){toast('Bitte Name und Vereinsname eingeben.');return;}
    if(LS.get('kc:career',null)&&!conf('newCareer'))return;
    cleanup();NET.mode='career';CAREER_VAL=true;ST=newCareer(name,club,ui.jColor);ui.view='game';ui.lastPhase=ST.phase;ui.newCar=false;saveCareer();render();scrollTo(0,0);},
  contCareer(){const d=LS.get('kc:career',null);if(!d)return;cleanup();NET.mode='career';CAREER_VAL=true;ST=d;ui.view='game';ui.lastPhase=ST.phase;render();scrollTo(0,0);},
  sponsor(v){send('SPONSOR',{offer:v});},
  lgv(v){ui.lgv=+v;render();},
  luAuto(){ui.lu=null;render();},
  luManual(){const c=myC();const form=ui.form||c.form;const X=pickXI(Object.assign({},c,{lineup:null}),form);const lu={};for(const k of ['G','D','M','A'])lu[k]=X[k].filter(x=>x.p).map(x=>x.p.id);ui.lu=lu;render();},
  luSet(v){const c=myC();const [id,k]=v.split('|');const lu=JSON.parse(JSON.stringify(curLu(c)||{G:[],D:[],M:[],A:[]}));
    for(const s of ['G','D','M','A'])lu[s]=(lu[s]||[]).filter(x=>x!==id);
    if(k!=='B'){const F=FORM[ui.form||c.form];const need={G:1,D:F[0],M:F[1],A:F[2]};if(lu[k].length>=need[k]){toast(`${POSL[k]} ist voll – setz erst jemanden auf die Bank.`);return;}lu[k].push(id);}
    ui.lu=lu;render();},
  camp(v){if(conf('camp'+v))send('CAMP',{size:+v});},
  campSign(v){send('CAMP_SIGN',{player:v});},
  campSkip(){if(conf('campSkip'))send('CAMP_SKIP');},
  async ready(){const c=myC();if(!c)return;const p=(ST.phase==='matchday'||(ST.phase==='seasonEnd'&&ST.cl&&ST.cl.ent[c.id]))?{form:ui.form||c.form,tac:ui.tac||c.tac}:{};
    if(ST.rv>=5&&p.form)p.lineup=curLu(c)||null;
    const who=me();await send('READY',p);ui.form=null;ui.tac=null;ui.lu=undefined;
    if(NET.mode==='local'&&ST&&ST.ready[who]){const nx=ST.players.find(x=>!ST.ready[x.pid]);if(nx){ui.seat=nx.pid;toast('Weiter mit '+nx.name,true);render();}}},
  unready(){send('UNREADY');},
  force(v){if(conf('force'+v))send('FORCE',{target:v});}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=ACT[el.dataset.a];if(f)f(el.dataset.v,el.dataset.k,el);});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(!el)return;if(el.dataset.ch==='seat'){ui.seat=el.value;ui.form=null;ui.tac=null;ui.lu=undefined;ui.confirm=null;ui.tickerShown=null;render();checkTicker();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='codeIn')ACT.joinCode();});

// ---------- Start ----------
async function initFirebase(cfg){
  const V='https://www.gstatic.com/firebasejs/10.12.2/';
  const {initializeApp}=await import(V+'firebase-app.js');
  const fs=await import(V+'firebase-firestore.js');
  const db=fs.getFirestore(initializeApp(cfg));
  const wrap=s=>({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()})),metadata:s.metadata});
  const docRef=p=>({set:d=>fs.setDoc(fs.doc(db,p),d)});
  const q=(path,cons)=>({
    orderBy:(f,d)=>q(path,cons.concat(fs.orderBy(f,d||'asc'))),
    limit:n=>q(path,cons.concat(fs.limit(n))),
    doc:id=>docRef(path+'/'+id),
    get:async()=>wrap(await fs.getDocs(fs.query(fs.collection(db,path),...cons))),
    onSnapshot:(next,err)=>fs.onSnapshot(fs.query(fs.collection(db,path),...cons),s=>next(wrap(s)),e=>err&&err({code:e.code,message:e.message}))
  });
  return{doc:docRef,collection:p=>q(p,[])};
}
render();
(async()=>{
  try{
    const cfg=window.FIREBASE_CONFIG;
    if(cfg&&cfg.apiKey&&!/DEIN|YOUR/.test(cfg.apiKey)){NET.web=true;NET.db=await initFirebase(cfg);NET.canWrite=true;}
    else if(window.claude&&typeof window.claude.use==='function'){
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      NET.db=db||null;NET.user=user||null;
      if(user){try{NET.canWrite=await user.can('data.write');}catch(e){}}
    }
  }catch(e){console.error(e);}
  NET.ready=true;if(ui.view==='start')render();
  if(NET.db)loadOpen();
})();
