// ================= KLUBCHEF ENGINE (deterministisch) =================
// Alle Zufälle kommen aus RNG(seed, schlüssel) – jedes Gerät berechnet denselben Spielstand.
function h32(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function RNG(seed,key){const f=mulberry(h32(seed+'|'+key));return{f,
  int:(a,b)=>a+Math.floor(f()*(b-a+1)),
  pick:arr=>arr[Math.floor(f()*arr.length)],
  chance:p=>f()<p,
  shuffle:arr=>{const x=arr.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(f()*(i+1));const t=x[i];x[i]=x[j];x[j]=t;}return x;},
  norm:(m,s)=>{let u=0;for(let i=0;i<4;i++)u+=f();return m+(u-2)*1.732*s;},
  wpick:(items)=>{let tot=0;for(const it of items)tot+=it.w;let x=f()*tot;for(const it of items){x-=it.w;if(x<0)return it;}return items[items.length-1];}
};}
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const r2=x=>Math.round(x*100)/100;

function doff(st){return st.rv>=2?(DIFF[st.settings.diff]||DIFF.normal).o:0;}
function seasonsLeft(st){return !st.settings.seasons||st.season<st.settings.seasons;}
function titles(c){return c.trophies.filter(t=>t.startsWith('Meister')).length;}
function clEligible(c){return c.fame>=50||titles(c)>=3;}

function Rej(m){this.m=m;}
function rej(m){throw new Rej(m);}

let CAREER_VAL=false;
function value(p){if(CAREER_VAL){const af=p.age<=21?1.3:p.age<=25?1.15:p.age<=29?1:p.age<=32?0.7:0.4;return Math.max(0.01,r2(0.05*Math.pow(1.13,p.rat-40)*af));}const x=Math.max(0,(p.rat-40)/10);let v=0.6*x*x*(1+0.1*x);const af=p.age<=21?1.3:p.age<=25?1.15:p.age<=29?1:p.age<=32?0.7:0.4;v*=af;return Math.max(0.2,Math.round(v*10)/10);}
function salary(p){if(p.sal!=null)return p.sal;return calcSal(p);}
function calcSal(p){if(CAREER_VAL)return Math.max(0.005,Math.round(value(p)*0.15*1000)/1000);return Math.max(0.1,r2(value(p)*0.12));}
function has(c,t){return c.staff&&c.staff.some(s=>s.type===t&&!s.exp);}
function fmtM(x){return x<1?Math.round(x*1000)+' Tsd.':x.toFixed(1).replace('.',',')+' Mio';}
function completeBuy(st,c,p,price,a){
  st.market=st.market.filter(x=>x!==p);delete p.tier;p.inj=0;
  if(p.free){p.free=false;p.sal=Math.round(calcSal(p)*1.1*1000)/1000;}
  p.ct=RNG(st.seed,'ct'+p.id).int(2,4);
  c.squad.push(p);money(c,-price);c.buys=(c.buys||0)+1;
  feed(st,`${c.name} holt ${p.name} (${POSL[p.pos]}, ${p.rat}) für ${fmtM(price)}.`,c.id);
  const r=RNG(st.seed,'ai'+a.id);
  if(st.market.length&&r.f()<0.5){const q=r.pick(st.market);st.market=st.market.filter(x=>x!==q);feed(st,`${q.name} (${q.rat}) wechselt zu ${st.clubs[r.pick(npcNames(st,c))].name}.`);}
}
function buyPrice(c,p){if(p.free)return Math.max(0.005,r2(salary(p)));let v=value(p)*(1-0.04*(c.up.scouting-1));if(has(c,'scout'))v*=0.9;return r2(v);}
function sellPrice(c,p){let v=value(p)*0.8;if(has(c,'sd'))v*=1.15;return r2(v);}
function visible(c,p){return (p.tier||1)<=c.up.scouting+1;}
function money(c,x){c.cash=r2(c.cash+x);}
function newId(st){return 'p'+(st.nextId++);}
function pname(r){return r.pick(FIRST)+' '+r.pick(LAST);}
function tierOf(r,p){let t=p.rat>=80?5:p.rat>=75?4:p.rat>=70?3:p.rat>=62?2:1;if(p.age<=21&&p.pot>=80)t++;t+=r.int(-1,0);return clamp(t,1,5);}

function genPlayer(st,r,pos,mean,sd,amin,amax){
  const age=r.int(amin,amax);
  const rat=Math.round(clamp(r.norm(mean,sd),44,88));
  const pot=Math.min(95,rat+(age<=21?r.int(4,16):age<=24?r.int(1,8):r.int(0,2)));
  return{id:newId(st),name:pname(r),pos,age,rat,pot,inj:0};
}

function roundRobin(ids){

function teamRat(c,form,tac,oppTac,home){

function npcTac(r){return r.wpick([{v:'bal',w:3},{v:'off',w:2},{v:'def',w:2},{v:'konter',w:1},{v:'press',w:1}]).v;}

function mFinish(st,ctx,r,o){

    if(st.rv>=5)for(const k of ['G','D','M','A'])for(const x of R.xi[k])if(x.p)x.p.apps=(x.p.apps||0)+1;
    let risk=0.025+(tac==='press'&&!has(c,'fit')?0.02:0);if(has(c,'phys'))risk/=2;
    for(const k of ['G','D','M','A'])for(const x of R.xi[k]){
      const rk=x.p&&x.p.tr==='ver'?risk*2:risk;

    }
  }

}

function applySus(st,ids){for(const pid of humans(st))for(const p of st.clubs[pid].squad){if(p.sus>0)p.sus--;if(ids.includes(p.id))p.sus=1;}}
function resolveMatchday(st){
  const r=RNG(st.seed,`md-${st.season}-${st.md}`);
  const results=[];const inj=[];const sus=[];
  for(const [h,a] of st.schedule[st.md])results.push(playMatch(st,h,a,r,{cup:false,inj,sus}));
  const ci=st.cupMds.indexOf(st.md);
  if(ci>=0&&st.cup&&!st.cup.winner){
    const al=st.cup.alive,win=[],ms=[];
    for(let i=0;i<al.length;i+=2){const m=playMatch(st,al[i],al[i+1],r,{cup:true,cupName:CUPN[ci],inj,sus});ms.push(m);results.push(m);win.push(m.w);}
    st.cup.log.push({round:CUPN[ci],ms:ms.map(m=>({h:m.h,a:m.a,gh:m.gh,ga:m.ga,pens:m.pens,w:m.w}))});
    st.cup.alive=win;st.cup.round++;
    if(win.length===1){st.cup.winner=win[0];const f=ms[0];st.cup.finalist=f.w===f.h?f.a:f.h;feed(st,`🏆 ${st.clubs[win[0]].name} gewinnt den Pokal!`);
      const wc=st.clubs[win[0]];if(wc.human){money(wc,2);wc.fans+=3000;}}
  }
  for(const pid of humans(st))for(const p of st.clubs[pid].squad)if(p.inj>0)p.inj--;
  for(const [p,n] of inj)p.inj=Math.max(p.inj||0,n);
  if(feat(st))applySus(st,sus);
  const cards={};
  for(const pid of humans(st)){
    const c=st.clubs[pid];const card=r.wpick(CARDS);
    const data=card.prep?card.prep(c,r,st):{};
    if(card.prep&&!data){cards[pid]={t:'Ruhige Woche',x:'Keine Schlagzeilen.',g:1};continue;}
    const x=card.run(c,r,st,data);
    cards[pid]={t:card.t,x,g:card.g};
    if(card.opts){c.pending={k:card.k,t:card.t,x,opts:card.opts,data};cards[pid].choice=true;}
  }
  st.last={season:st.season,md:st.md,results,cards};
  st.md++;st.ready={};
  if(st.md>=st.schedule.length)endSeason(st);
}

function endSeason(st){
  const tbl=sortedTable(st);
  const champ=tbl[0].id;
  feed(st,`🥇 ${st.clubs[champ].name} ist Meister der Saison ${st.season}!`);
  st.history.push({season:st.season,champ,cup:st.cup.winner,order:tbl.map(t=>t.id),top:statsOn(st)?topScorer(st):undefined});
  for(const pid of humans(st)){
    const c=st.clubs[pid];const place=tbl.findIndex(t=>t.id===pid)+1;
    if(c.pending){c.pending=null;}
    const fame=[[`Platz ${place} in der Liga`,PLACE_FAME[place-1]||0]];
    if(st.cup.winner===pid)fame.push(['Pokalsieg',5]);else if(st.cup.finalist===pid)fame.push(['Pokalfinale',2]);
    if(c.up.stadium>1)fame.push(['Stadion-Prestige',c.up.stadium-1]);
    if(place===1){c.trophies.push('Meister '+st.season);c.fans+=5000;}
    if(st.cup.winner===pid)c.trophies.push('Pokal '+st.season);
    let fsum=0;for(const f of fame)fsum+=f[1];c.fame+=fsum;
    const sal=r2(c.squad.reduce((s,p)=>s+salary(p),0));
    const ssal=r2(c.staff.reduce((s,x)=>s+x.sal,0));
    const fin=[['TV-Geld',r2(9-(place-1)*5/7)],['Sponsoring',r2(3+0.15*c.fame)]];
    if(has(c,'mkt'))fin.push(['Marketingchef',st.rv>=3?3:1.5]);
    fin.push(['Gehälter Spieler',-sal]);if(ssal)fin.push(['Gehälter Staff',-ssal]);
    if(st.rv>=2&&CATCHUP[place-1])fin.push(['Ausgleichsbonus',CATCHUP[place-1]]);
    if(c.debt>0)fin.push(['Kreditzinsen (10 %)',-r2(c.debt*0.1)]);
    for(const f of fin)money(c,f[1]);
    let emer=0;while(c.cash<0&&c.debt<60){money(c,5);c.debt+=5;emer++;}
    if(emer){fin.push(['Notkredit',emer*5]);c.fame-=emer;fame.push(['Notkredit (Imageschaden)',-emer]);}
    c.report={season:st.season,place,fin,fame};
  }
  st.cl=null;
  if(st.rv>=2){
    const ent={};
    for(const pid of humans(st)){const c=st.clubs[pid];if(!clEligible(c))continue;
      const r=RNG(st.seed,`cl-${st.season}-${pid}`);const nat=r.chance(0.4);
      const base=(nat?r.int(77,82):r.int(75,81))+Math.round(doff(st)/2);const id='cl'+st.season+pid;
      st.clubs[id]={id,human:false,cl:true,name:nat?r.pick(CL_NATIONS):r.pick(CL_CLUBS),color:'#c9a227',A:base+r.int(-2,2),M:base+r.int(-2,2),D:base+r.int(-2,2)};
      ent[pid]=id;feed(st,`⭐ ${c.name} hat sich für die Champions League qualifiziert – Gegner: ${st.clubs[id].name}!`);}
    if(Object.keys(ent).length)st.cl={season:st.season,ent};
  }
  st.phase='seasonEnd';st.ready={};
}
function resolveCL(st){
  if(!st.cl)return [];
  const r=RNG(st.seed,'clplay'+st.season);const results=[],winners=[];
  for(const pid of humans(st)){const oid=st.cl.ent[pid];if(!oid)continue;
    const m=playMatch(st,pid,oid,r,{cup:true,cupName:'Champions League',inj:[]});results.push(m);
    const c=st.clubs[pid];
    if(m.w===pid){winners.push(pid);c.trophies.push('Champions League '+st.season);feed(st,`🏆⭐ ${c.name} gewinnt die Champions League gegen ${st.clubs[oid].name}!`);}
    else{const old=c.fame;c.fame=Math.floor(c.fame/2);feed(st,`${c.name} verliert das CL-Finale gegen ${st.clubs[oid].name} – die Sterne halbieren sich (${old} → ${c.fame}).`);}
  }
  st.last={season:st.season,md:'CL',results,cards:{}};
  st.cl.done=true;
  return winners;
}

function devHuman(st,c,r){
const dev=[],gone=[];
    const loans=c.squad.filter(p=>p.loan);for(const p of loans)gone.push(`${p.name} (Leihende)`);
    c.squad=c.squad.filter(p=>!p.loan);
    const keep=[];
    for(const p of c.squad){
      if(feat(st)){p.sus=0;if(p.ct!=null){p.ct--;if(p.ct<=0){gone.push(`${p.name} (Vertrag ausgelaufen)`);p.free=true;p.ct=null;p.inj=0;(st.freeAg=st.freeAg||[]).push(p);continue;}}}
      p.age++;p.inj=0;
      if(p.age>=34&&(p.age>=36||r.chance(0.5))){gone.push(`${p.name} (Karriereende mit ${p.age})`);continue;}
      let d=p.age<=21?r.int(1,4):p.age<=24?r.int(0,3):p.age<=28?r.int(-1,2):p.age<=31?r.int(-2,1):r.int(-4,0);
      if(p.tr==='tal'&&p.age<=24)d+=1;if(p.tr==='rou'&&p.age>=29&&d<0)d+=1;
      if(p.age<=26){const b=(c.up.training-1)*0.5;d+=Math.floor(b)+(r.f()<b-Math.floor(b)?1:0);}
      if(statsOn(st)){p.gs=0;p.as=0;}
      let eb=0;if(st.rv>=5){const share=(p.apps||0)/Math.max(1,st.schedule.length);if(p.age<=24)eb=share>=0.7?2:share>=0.4?1:0;d+=eb;p.apps=0;}
      const before=p.rat;let nr=p.rat+d;if(d>0)nr=Math.min(nr,Math.max(p.pot,p.rat));nr=clamp(nr,35,95);
      p.rat=nr;if(p.pot<p.rat)p.pot=p.rat;
      if(nr!==before)dev.push({n:p.name,a:before,b:nr,age:p.age,eb});
      keep.push(p);
    }
    c.squad=keep;
    const youth=[];
    if(c.squad.length<SQUAD_MAX){const y=genYouth(st,r,c);c.squad.push(y);youth.push(`${y.name} (${POSL[y.pos]}, ${y.rat})`);}
    const amateurs=[];
    const need=pos=>c.squad.filter(p=>p.pos===pos).length;
    if(need('G')<1){const p={id:newId(st),name:pname(r),pos:'G',age:r.int(22,30),rat:50,pot:52,inj:0};c.squad.push(p);amateurs.push(p.name);}
    while(c.squad.length<SQUAD_MIN){const pos=r.pick(['D','M','A']);const p={id:newId(st),name:pname(r),pos,age:r.int(20,30),rat:r.int(48,54),inj:0};p.pot=p.rat+2;c.squad.push(p);amateurs.push(p.name);}
    c.moral=3;c.pending=null;c.buys=0;c.camp=null;if(st.rv>=3)c.hires=0;
    c.devReport={dev,gone,youth,amateurs};
}
function nextSeason(st){
  st.season++;
  const r=RNG(st.seed,'ns'+st.season);
  for(const pid of humans(st))devHuman(st,st.clubs[pid],r);
  for(const id of st.league){const c=st.clubs[id];if(c.human)continue;
    if(st.rv>=2){{const o=doff(st);for(const k of ['A','M','D'])c[k]=clamp(c[k]+r.int(-2,2)+(c[k]<66+o?1:c[k]>72+o?-1:0),58+o,80+o);}}
    else{c.A=clamp(c.A+r.int(-1,3),55,84);c.M=clamp(c.M+r.int(-1,3),55,84);c.D=clamp(c.D+r.int(-1,3),55,84);}}
  st.cl=null;
  st.market=genMarket(st,r,18);
  if(feat(st)){if(st.freeAg){for(const p of st.freeAg){p.tier=1;st.market.push(p);}st.freeAg=null;}ensureAll(st);makeOffers(st);}
  st.staffPool=genStaff(st,r,6);
  setupSeason(st);
  st.phase='offseason';st.offFirst=false;st.ready={};
  feed(st,`Sommerpause vor Saison ${st.season}: neuer Transfermarkt, neue Trainer auf Jobsuche.`);
}

function finishGame(st,win){
  win=win||[];st.clWinner=win.length?win:null;
  const ps=humans(st).slice().sort((a,b)=>{if(win.includes(a)!==win.includes(b))return win.includes(a)?-1:1;const A=st.clubs[a],B=st.clubs[b];return B.fame-A.fame||B.trophies.length-A.trophies.length||B.cash-A.cash||(a<b?-1:1);});
  st.final=ps;st.phase='over';st.ready={};
  feed(st,`Spielende! ${st.clubs[ps[0]].manager} macht ${st.clubs[ps[0]].name} zum Klub der Legenden.`);
}

function checkAdvance(st){
  const hs=humans(st);if(!hs.length||!hs.every(p=>st.ready[p]))return;
  if(st.phase==='offseason'){if(feat(st))for(const pid of hs){st.clubs[pid].offers=[];st.clubs[pid].bid=null;}st.phase='matchday';st.ready={};st.offFirst=false;feed(st,`Anpfiff zur Saison ${st.season}!`);}
  else if(st.phase==='matchday')resolveMatchday(st);
  else if(st.phase==='seasonEnd'){
    if(st.rv>=2){const w=resolveCL(st);if(w.length)finishGame(st,w);else if(!seasonsLeft(st))finishGame(st);else nextSeason(st);}
    else{if(st.season>=st.settings.seasons)finishGame(st);else nextSeason(st);}
  }
}

function myClub(st,a){const c=st.clubs[a.by];if(!c||!c.human)rej('Du bist kein Manager in diesem Spiel.');return c;}
function needPhase(st,...ph){if(!ph.includes(st.phase))rej('Gerade nicht möglich.');}
function setLineup(c,lu){
  if(!lu||typeof lu!=='object'){c.lineup=null;return;}
  const ids=new Set(c.squad.map(p=>p.id)),seen=new Set(),out={};
  for(const k of ['G','D','M','A']){out[k]=[];for(const id of (Array.isArray(lu[k])?lu[k]:[]).slice(0,5)){if(ids.has(id)&&!seen.has(id)){seen.add(id);out[k].push(id);}}}
  c.lineup=out;
}
const H={
  JOIN(st,a){
    needPhase(st,'lobby');
    const pid=String(a.pid||'');if(!/^[A-Za-z0-9_-]{2,24}$/.test(pid))rej('Ungültige ID.');
    if(isHuman(st,pid))rej('Du bist schon dabei.');
    if(st.players.length>=MAXH)rej('Spiel ist voll (max. 6 Manager).');
    const name=String(a.name||'').trim().slice(0,20)||'Manager';
    const club=String(a.club||'').trim().slice(0,24)||'Mein Klub';
    if(st.players.some(p=>p.club.toLowerCase()===club.toLowerCase()))rej('Diesen Vereinsnamen gibt es schon.');
    const color=COLORS.includes(a.color)?a.color:COLORS[st.players.length%COLORS.length];
    st.players.push({pid,name,club,color});
    feed(st,`${name} übernimmt ${club}.`);
  },
  KICK(st,a){needPhase(st,'lobby');if(!isHost(st,a))rej('Nur der Host.');st.players=st.players.filter(p=>p.pid!==a.pid);},
  SETTINGS(st,a){needPhase(st,'lobby');if(!isHost(st,a))rej('Nur der Host.');const s=a.settings||{};

function reduce(st,a){
  if(!st){return a&&a.type==='CREATE'?createState(a):null;}
  if(a.type==='CREATE')return st;
  const h=H[a.type];if(!h)return st;
  h(st,a);if(feat(st))ensureAll(st);return st;
}

function clubName(r,used){for(let i=0;i<200;i++){const n=r.pick(PREF)+' '+r.pick(TOWNS);if(!used.has(n)){used.add(n);return n;}}return 'SV '+used.size;}

      st.clubs[id]={id,human:false,lg:L,name:clubName(r,used),color:NPC_COL[k%NPC_COL.length],A:b+r.int(-3,3),M:b+r.int(-3,3),D:b+r.int(-3,3)};st.order[L].push(id);}

  st.order[4].push('me');
  careerSetupSeason(st);careerOffseason(st,true);
  feed(st,`${name} übernimmt ${club} in der Kreisliga. Das Ziel: ganz nach oben!`);
  return st;
}
function careerSetupSeason(st){
  st.ss={};
  const r=CR(st);
  for(let L=1;L<=4;L++){
    const ids=r.shuffle(st.order[L]);let rr=roundRobin(ids);rr=rr.concat(rr.map(m=>m.map(([a,b])=>[b,a])));
    st.sched[L]=rr;st.tables[L]={};for(const id of st.order[L])st.tables[L][id]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
  }
  const me=st.clubs.me;st.schedule=st.sched[me.lg];st.md=0;
  // Kreispokal: alle aus Liga 4 + 6 aus Liga 3
  let l3=r.shuffle(st.order[3]);let pick3=l3.slice(0,6);if(me.lg===3&&!pick3.includes('me'))pick3[0]='me';
  st.cups={kreis:{name:'Kreispokal',mds:CMD_KREIS,alive:r.shuffle(st.order[4].concat(pick3)),log:[],winner:null},land:null};
}
function careerOffseason(st,first){
  const r=CR(st);const c=st.clubs.me;const t=c.lg;
  st.market=[];for(let i=0;i<18;i++){const pos=r.wpick([{v:'G',w:2},{v:'D',w:5},{v:'M',w:6},{v:'A',w:5}]).v;const p=genPlayer(st,r,pos,TMEAN[t]+4,7,18,33);p.tier=tierOf(r,p);st.market.push(p);}
  const f=STAFFF[t];
  st.staffPool=r.shuffle(Object.keys(STAFF)).slice(0,6).map(ty=>({id:'s'+(st.nextId++),type:ty,name:pname(r),fee:r2(r.int(20,40)/10*f),sal:r2(r.int(10,20)/10*f),ct:r.int(2,3)}));
  const ff=Math.sqrt(clamp(c.fans/EXPFANS[t],0.5,2.5));const base=r2(SPON[t]*ff*(0.9+r.f()*0.2));
  const goal=t===1?'Top 3':'Aufstieg';
  st.spOffers=[
    {id:'a',n:r.pick(SPONSN)+' '+r.pick(TOWNS),type:'fix',amount:base,d:`${fm(base)} fest für die Saison.`},
    {id:'b',n:r.pick(SPONSN)+' '+r.pick(TOWNS),type:'win',amount:r2(base*0.55),perWin:r2(base*0.06),d:`${fm(base*0.55)} fest + ${fm(base*0.06)} pro Ligasieg.`},
    {id:'c',n:r.pick(SPONSN)+' '+r.pick(TOWNS),type:'goal',amount:r2(base*0.45),goal,bonus:r2(base*1.3),d:`${fm(base*0.45)} fest + ${fm(base*1.3)} Bonus bei ${goal}.`}
  ];
  if(st.freeAg){for(const p of st.freeAg){p.tier=1;st.market.push(p);}st.freeAg=null;}
  c.spon=null;c.buys=0;c.hires=0;c.camp=null;c.bid=null;
  ensureAll(st);makeOffers(st);
  st.phase='offseason';st.offFirst=!!first;st.ready={};
}
function careerCupRound(st,cup,r,inj,results,sus){
  const ci=cup.mds.indexOf(st.md);if(ci<0||cup.winner)return;
  const al=cup.alive,win=[],ms=[];const rn=CUPR[4-Math.log2(al.length)]||'Runde';
  for(let i=0;i<al.length;i+=2){
    const h=st.clubs[al[i]],a=st.clubs[al[i+1]];
    const m=playMatch(st,al[i],al[i+1],r,{cup:true,cupName:cup.name+' · '+rn,inj,sus});ms.push(m);win.push(m.w);
    if(h.human||a.human)results.push(m);
    const me=st.clubs.me;if(m.w==='me')money(me,cup.name==='Kreispokal'?0.01:0.15);
  }
  cup.log.push({round:rn,ms:ms.map(m=>({h:m.h,a:m.a,gh:m.gh,ga:m.ga,pens:m.pens,w:m.w}))});
  cup.alive=win;
  if(win.length===1){cup.winner=win[0];feed(st,`🏆 ${st.clubs[win[0]].name} gewinnt den ${cup.name}!`);
    if(win[0]==='me'){const c=st.clubs.me;c.trophies.push(cup.name+' '+st.season);money(c,cup.name==='Kreispokal'?0.04:1);c.fans+=Math.round(c.fans*0.1);}}
}
function careerKickoff(st){
  const me=st.clubs.me;const fx=st.sched[me.lg][st.md].find(m=>m.includes('me'));
  const r=CR(st);const ctx=mStart(st,fx[0],fx[1],r);mRun(st,ctx,r,6,{});
  delete ctx.RH;delete ctx.RA;st.ht={ctx};st.phase='halftime';
  for(const id of ctx.sus||[]){const p=me.squad.find(x=>x.id===id);if(p)p.sent=true;}
}
function careerSecondHalf(st){
  const me=st.clubs.me;const ctx=st.ht.ctx;const r=CR(st);
  const side=ctx.h==='me'?'h':'a';ctx['t'+side]=me.tac;
  const keep=me.planB;me.planB=null;halftimeSwitch(st,ctx,r);me.planB=keep;ctx['t'+side]=me.tac;
  mRun(st,ctx,r,12,{});
  for(const p of me.squad)delete p.sent;
  st.ht=null;st.phase='matchday';
  careerResolve(st,ctx);
}
function careerResolve(st,myCtx){
  const r=CR(st);const inj=[];const sus=[];const results=[],other=[];const me=st.clubs.me;
  for(let L=1;L<=4;L++){st.table=st.tables[L];
    for(const [h,a] of st.sched[L][st.md]){let m;
      if(myCtx&&(h==='me'||a==='me')){m=mFinish(st,myCtx,r,{cup:false,inj,sus});m.ht=true;}
      else m=playMatch(st,h,a,r,{cup:false,inj,sus});
      m.lg=L;(L===me.lg?results:other).push(m);}}
  careerCupRound(st,st.cups.kreis,r,inj,results,sus);
  if(st.md===CMD_LAND[0]&&!st.cups.land){
    const l2=r.shuffle(st.order[2].filter(x=>x!=='me')).slice(0,me.lg===2?4:5);if(me.lg===2)l2.push('me');
    const parts=st.order[1].concat(l2,[st.cups.kreis.winner]);
    st.cups.land={name:'Landespokal',mds:CMD_LAND,alive:r.shuffle(parts),log:[],winner:null};
    if(st.cups.kreis.winner==='me')feed(st,`⭐ Als Kreispokalsieger spielt ${me.name} im Landespokal gegen die Großen!`);
  }
  if(st.cups.land)careerCupRound(st,st.cups.land,r,inj,results,sus);
  if(has(me,'mkt')){const x=mktRate(me);me.cash=Math.round((me.cash+x)*1000)/1000;me.mktPaid=Math.round(((me.mktPaid||0)+x)*1000)/1000;}
  for(const p of me.squad)if(p.inj>0)p.inj--;
  for(const [p,n] of inj)p.inj=Math.max(p.inj||0,n);
  applySus(st,sus);
  const F=SPON[me.lg];const card=r.wpick(CCARDS);const data=card.prep?card.prep(me,r,st,F):{};
  const cards={};
  if(card.prep&&!data)cards.me={t:'Ruhige Woche',x:'Keine Schlagzeilen.',g:1};
  else{const x=card.run(me,r,st,F,data);cards.me={t:card.t,x,g:card.g};if(card.opts){me.pending={k:card.k,t:card.t,x,opts:card.opts,data,career:true};cards.me.choice=true;}}
  st.last={season:st.season,md:st.md,results,other,cards};
  st.md++;st.ready={};
  if(st.md>=18)careerEndSeason(st);
}
function careerEndSeason(st){
  const me=st.clubs.me;const t=me.lg;const r=CR(st);
  const tb={};for(let L=1;L<=4;L++)tb[L]=careerTable(st,L);
  const place=tb[t].findIndex(x=>x.id==='me')+1;
  const champs={};for(let L=1;L<=4;L++)champs[L]=tb[L][0].id;
  if(place===1){me.trophies.push(`Meister ${LNAME[t]} ${st.season}`);}
  // Auf-/Abstieg
  const moves=[];
  for(let L=1;L<=3;L++){const down=tb[L].slice(-2).map(x=>x.id),up=tb[L+1].slice(0,2).map(x=>x.id);moves.push([L,down,up]);}
  const newOrder={1:st.order[1].slice(),2:st.order[2].slice(),3:st.order[3].slice(),4:st.order[4].slice()};
  for(const [L,down,up] of moves){newOrder[L]=newOrder[L].filter(x=>!down.includes(x)).concat(up);newOrder[L+1]=newOrder[L+1].filter(x=>!up.includes(x)).concat(down);}
  let status='Klassenerhalt';
  for(let L=1;L<=4;L++)for(const id of newOrder[L]){const c=st.clubs[id];if(id==='me'){if(L<t)status='Aufstieg';else if(L>t)status='Abstieg';}c.newLg=L;}
  if(t===1&&place===1)status='Meister';
  // Finanzen
  const fin=[];const tv=r2(TVB[t]*(1.25-0.05*(place-1)));fin.push(['TV-Geld',tv]);
  const sp=me.spon;if(sp){fin.push(['Sponsor '+sp.n,sp.amount]);if(sp.type==='goal'){const ok=sp.goal==='Top 3'?place<=3:status==='Aufstieg'||place===1;if(ok)fin.push(['Sponsor-Bonus ('+sp.goal+')',sp.bonus]);}}
  const sal=r2(me.squad.reduce((s,p)=>s+salary(p),0)),ssal=r2(me.staff.reduce((s,x)=>s+x.sal,0));
  fin.push(['Gehälter Spieler',-sal]);if(ssal)fin.push(['Gehälter Staff',-ssal]);
  if(status==='Aufstieg'){const nl=t-1;fin.push(['Aufstiegsprämie',r2(TVB[nl]*0.5)]);}
  if(me.debt>0)fin.push(['Kreditzinsen (10 %)',-r2(me.debt*0.1)]);
  for(const f of fin)money(me,f[1]);
  if(me.mktPaid){fin.splice(sp?(fin.length>2&&fin[2][0].startsWith('Sponsor-Bonus')?3:2):1,0,['Marketingchef (schon ausgezahlt)',r2(me.mktPaid)]);me.mktPaid=0;}
  let emer=0;const ls=LOANS[t];while(me.cash<0&&emer<20){money(me,ls);me.debt=r2(me.debt+ls);emer++;}
  if(emer)fin.push(['Notkredit',r2(emer*ls)]);
  me.report={season:st.season,place,lg:t,status,fin};
  const tops={};for(let L=1;L<=4;L++)tops[L]=topScorer(st,e=>e.lg===L);
  st.history.push({season:st.season,lg:t,place,status,champs:Object.assign({},champs),kreis:st.cups.kreis.winner,land:st.cups.land&&st.cups.land.winner,tops});
  st.pendingMoves=newOrder;
  feed(st,`Saison ${st.season} beendet: ${me.name} wird ${place}. in der ${LNAME[t]} – ${status}!`);
  for(let L=1;L<=4;L++)feed(st,`🥇 ${st.clubs[champs[L]].name} ist Meister der ${LNAME[L]}.`);
  st.cl=null;
  if(t===1&&place===1){const nat=r.chance(0.4);const base=nat?r.int(78,84):r.int(77,83);const id='clX'+st.season;
    st.clubs[id]={id,human:false,cl:true,name:nat?r.pick(CL_NATIONS):r.pick(CL_CLUBS),color:'#c9a227',A:base+r.int(-2,2),M:base+r.int(-2,2),D:base+r.int(-2,2)};
    st.cl={season:st.season,ent:{me:id}};feed(st,`⭐ Als Meister der 1. Liga spielt ${me.name} das Champions-League-Finale gegen ${st.clubs[id].name}!`);}
  st.phase='seasonEnd';st.ready={};
}
function careerNext(st){
  const me=st.clubs.me;const r=CR(st);
  if(st.cl&&!st.cl.done){const oid=st.cl.ent.me;const m=playMatch(st,'me',oid,r,{cup:true,cupName:'Champions League',inj:[]});
    st.last={season:st.season,md:'CL',results:[m],other:[],cards:{}};st.cl.done=true;
    if(m.w==='me'){me.trophies.push('Champions League '+st.season);money(me,10);me.fans+=Math.round(me.fans*0.15);feed(st,`🏆⭐ ${me.name} gewinnt die Champions League!`);}
    else feed(st,`${me.name} verliert das CL-Finale gegen ${st.clubs[oid].name}.`);}
  const oldLg=me.lg;
  st.order=st.pendingMoves;st.pendingMoves=null;
  for(let L=1;L<=4;L++)for(const id of st.order[L]){const c=st.clubs[id];c.lg=L;delete c.newLg;
    if(!c.human)for(const k of ['A','M','D'])c[k]=clamp(Math.round(c[k]+(TMEAN[L]-c[k])*0.35+r.int(-2,2)),40,88);}
  for(const id of Object.keys(st.clubs))if(st.clubs[id].cl)delete st.clubs[id];
  st.season++;
  for(const x of me.staff){x.ct=(x.ct==null?1:x.ct)-1;if(x.ct<=0){x.ct=0;x.exp=true;const f=STAFFF[me.lg];x.newSal=r2(1.6*f);x.bonus=r2(f);feed(st,`📝 Vertrag von ${x.name} (${STAFF[x.type].n}) ist ausgelaufen – im Büro › Staff verlängern oder gehen lassen.`,'me');}}
  devHuman(st,me,r);
  if(me.lg<oldLg)me.fans=Math.round(me.fans*1.5);else if(me.lg>oldLg)me.fans=Math.round(me.fans*0.75);
  me.fans=Math.round(me.fans+(EXPFANS[me.lg]-me.fans)*0.4);
  careerSetupSeason(st);careerOffseason(st,false);
  feed(st,`Sommerpause vor Saison ${st.season}: ${me.name} spielt in der ${LNAME[me.lg]}.`);
}

const CH={
  BUY:(st,a)=>H.BUY(st,a), SELL:(st,a)=>H.SELL(st,a), HIRE:(st,a)=>H.HIRE(st,a), FIRE:(st,a)=>H.FIRE(st,a),
  CAMP_SIGN:(st,a)=>H.CAMP_SIGN(st,a), BID_OK:(st,a)=>H.BID_OK(st,a), BID_NO:(st,a)=>H.BID_NO(st,a), OFFER_OK:(st,a)=>H.OFFER_OK(st,a), OFFER_NO:(st,a)=>H.OFFER_NO(st,a), EXTEND:(st,a)=>H.EXTEND(st,a), CAMP_SKIP:(st,a)=>H.CAMP_SKIP(st,a), UNREADY(){},
  UPGRADE(st,a){needPhase(st,'offseason');const c=st.clubs.me;if(!UPS[a.kind])rej('Unbekannt.');const l=c.up[a.kind];if(l>=5)rej('Maximale Stufe.');
    const cost=(a.kind==='stadium'?CUPCOST:CUPCOST2)[l];if(c.cash<cost)rej('Nicht genug Geld.');money(c,-cost);c.up[a.kind]=l+1;feed(st,`${c.name} baut ${UPS[a.kind].n} auf Stufe ${l+1} aus.`,c.id);},
  LOAN(st,a){const c=st.clubs.me;const s=LOANS[c.lg];if(c.debt+s>s*6+0.001)rej(`Die Bank gibt höchstens ${fm(s*6)}.`);c.debt=r2(c.debt+s);money(c,s);},
  REPAY(st,a){const c=st.clubs.me;const s=Math.min(c.debt,LOANS[c.lg]);if(s<=0)rej('Keine Schulden.');if(c.cash<s)rej('Nicht genug Geld.');c.debt=r2(c.debt-s);money(c,-s);},
  CAMP(st,a){needPhase(st,'matchday');const c=st.clubs.me;if(c.campSeason===st.season)rej('Diese Saison gab es schon ein Camp.');const big=a.size===2;const cost=r2(CAMPC[c.lg]*(big?2:1));if(c.cash<cost)rej('Nicht genug Geld.');
    const r=CR(st);const kids=[];
    for(let i=0;i<(big?4:2);i++){const pos=r.wpick([{v:'G',w:1},{v:'D',w:3},{v:'M',w:3},{v:'A',w:3}]).v;let rat=r.int(34,58)+Math.round((TMEAN[c.lg]-50)*0.6);if(r.chance(0.18))rat+=r.int(10,24);rat=clamp(rat,34,84);kids.push({id:newId(st),name:pname(r),pos,age:r.int(16,19),rat,pot:Math.min(94,rat+r.int(0,26)),inj:0});}
    money(c,-cost);c.campSeason=st.season;c.camp={kids};feed(st,`${c.name} veranstaltet ein Sichtungscamp.`,c.id);},
  CHOOSE(st,a){const c=st.clubs.me;const pd=c.pending;if(!pd)rej('Keine offene Entscheidung.');const card=CCARDS.find(x=>x.k===pd.k);c.pending=null;c.lastChoice={t:pd.t,x:card.choose(c,a.opt===0?0:1,st,pd.data)};},
  SPONSOR(st,a){needPhase(st,'offseason');const o=st.spOffers.find(x=>x.id===a.offer);if(!o)rej('?');st.clubs.me.spon=Object.assign({},o);feed(st,`${st.clubs.me.name} unterschreibt bei ${o.n}.`,'me');},
  STAFF_EXT(st,a){needPhase(st,'offseason');const c=st.clubs.me;const x=c.staff.find(y=>y.id===a.staff);if(!x||!x.exp)rej('Kein auslaufender Vertrag.');const yrs=a.yrs===3?3:2;
    if(c.cash<x.bonus)rej('Nicht genug Geld für das Handgeld.');money(c,-x.bonus);x.sal=x.newSal;x.ct=yrs;delete x.exp;delete x.newSal;delete x.bonus;feed(st,`${c.name} verlängert mit ${x.name} (${STAFF[x.type].n}) um ${yrs} Jahre.`,c.id);},
  STAFF_GO(st,a){needPhase(st,'offseason');const c=st.clubs.me;const x=c.staff.find(y=>y.id===a.staff);if(!x)rej('?');c.staff=c.staff.filter(y=>y!==x);feed(st,`${x.name} (${STAFF[x.type].n}) verlässt ${c.name}.`,c.id);},
  READY(st,a){const c=st.clubs.me;
    if(st.phase==='offseason'){const gone=c.staff.filter(x=>x.exp);for(const x of gone)feed(st,`${x.name} (${STAFF[x.type].n}) verlässt ${c.name} – Vertrag ausgelaufen.`,c.id);c.staff=c.staff.filter(x=>!x.exp);if(!c.spon)rej('Wähle zuerst einen Sponsor (Büro).');if(c.cash<0)rej('Kontostand negativ – verkaufe Spieler oder nimm einen Kredit auf.');c.offers=[];c.bid=null;st.phase='matchday';st.offFirst=false;feed(st,`Anpfiff zur Saison ${st.season}!`);return;}
    if(st.phase==='matchday'){if(c.pending)rej('Triff erst deine offene Entscheidung.');if(a.form&&FORM[a.form])c.form=a.form;if(a.tac&&TAC[a.tac])c.tac=a.tac;setLineup(c,a.lineup);careerKickoff(st);return;}
    if(st.phase==='halftime'){if(a.form&&FORM[a.form])c.form=a.form;if(a.tac&&TAC[a.tac])c.tac=a.tac;setLineup(c,a.lineup);careerSecondHalf(st);return;}
    if(st.phase==='seasonEnd'){if(st.cl&&!st.cl.done){if(a.form&&FORM[a.form])c.form=a.form;if(a.tac&&TAC[a.tac])c.tac=a.tac;setLineup(c,a.lineup);}careerNext(st);}
  }
};

</script>
<script>
// ================= KLUBCHEF UI =================
const ui={view:'start',tab:null,sub:null,pos:'all',confirm:null,seat:null,loadMsg:'',jColor:COLORS[0],form:null,tac:null,openList:null,tickerShown:null};
const NET={mode:null,code:null,raw:[],unsub:null,db:null,user:null,pid:null,canWrite:null,lastMeta:'',timer:null,ready:false};
let ST=null,applied=[];const mySent=new Set();
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
function rnd(n,alpha){const a=new Uint32Array(n);crypto.getRandomValues(a);let s='';for(const x of a)s+=alpha[x%alpha.length];return s;}
const rid=n=>rnd(n,'abcdefghijkmnpqrstuvwxyz23456789');
const genCode=()=>rnd(5,'ABCDEFGHJKLMNPQRSTUVWXYZ23456789');
function me(){return NET.mode==='local'?ui.seat:NET.mode==='career'?'me':NET.pid;}
function myC(){if(!ST)return null;const c=ST.clubs[me()];return c&&c.human?c:null;}
function isHostMe(){return ST&&(ST.local||ST.host===me());}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fm(x){const a=Math.abs(x);if(a>0&&a<0.995){const k=Math.round(a*1000);return (x<0?'−':'')+(k>=10?Math.round(k/10)*10:k)+' Tsd.';}const v=Math.round(x*10)/10;return (v<0?'−':'')+Math.abs(v).toFixed(1).replace('.',',')+' Mio';}
function num(x){return Math.round(x).toLocaleString('de-DE');}
function ratCol(r){return r>=80?'var(--gold)':r>=72?'var(--acc)':r>=64?'var(--ink)':'var(--mut)';}
function val(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function toast(msg,ok){const t=document.createElement('div');t.className='toast'+(ok?' ok':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3400);}
function conf(key){if(ui.confirm===key){ui.confirm=null;return true;}ui.confirm=key;render();setTimeout(()=>{if(ui.confirm===key){ui.confirm=null;render();}},4000);return false;}
function cl(key,label,sure){return ui.confirm===key?(sure||'Sicher?'):label;}

// ---------- Netz ----------
async function send(type,p){
  p=p||{};
  let by=me();
  if(type==='CREATE')by=NET.mode==='local'?'L0':NET.pid;
  if(!by){toast('Wähle zuerst deinen Platz.');return;}
  const a=Object.assign({},p,{id:String(applied.length).padStart(5,'0')+'-'+rid(6),seq:applied.length,ts:Date.now(),by,type});
  if(NET.mode==='career'){
    try{const h=CH[type];if(h)h(ST,a);ensureAll(ST);}catch(e){if(e instanceof Rej)toast(e.m);else{console.error(e);toast('Fehler: '+e.message);}}
    saveCareer();if(ui.lastPhase!==ST.phase){scrollTo(0,0);ui.tab=null;ui.sub=null;ui.confirm=null;}ui.lastPhase=ST.phase;render();checkTicker();return;
  }
  mySent.add(a.id);
  if(NET.mode==='local'){NET.raw.push(a);LS.set('kc:local',{raw:NET.raw});recompute();return;}
  try{await NET.db.collection(`g/${NET.code}/a`).doc(a.id).set(a);writeMeta();}
  catch(e){mySent.delete(a.id);const c=e&&e.code;
    toast(c==='permission-denied'?'Die Datenbank lehnt den Zug ab (Sicherheitsregeln prüfen).':c==='invalid_argument'?'Keine Schreibrechte – der Besitzer muss dich als Bearbeiter einladen.':c==='quota_exceeded'?'Der Speicher ist voll.':'Senden fehlgeschlagen – bitte nochmal versuchen.');}
}
function recompute(){
  const acts=NET.raw.slice().sort((x,y)=>(x.seq-y.seq)||(x.ts-y.ts)||(x.id<y.id?-1:x.id>y.id?1:0));
  let ok=applied.length<=acts.length;
  if(ok)for(let i=0;i<applied.length;i++)if(acts[i].id!==applied[i]){ok=false;break;}
  if(!ok){ST=null;applied=[];}
  for(let i=applied.length;i<acts.length;i++){
    const a=acts[i];
    try{ST=reduce(ST,a);}catch(e){if(e instanceof Rej){if(mySent.has(a.id))toast(e.m);}else console.error(e);}
    mySent.delete(a.id);applied.push(a.id);
  }
  if(ST){
    if(NET.mode==='local'&&!ST.players.some(p=>p.pid===ui.seat))ui.seat=ST.players[0]?ST.players[0].pid:null;
    if(NET.mode==='local'&&ST.phase==='draft')ui.seat=drafter(ST);
    if(ui.lastPhase&&ui.lastPhase!==ST.phase){scrollTo(0,0);ui.confirm=null;ui.tab=null;ui.sub=null;}
    ui.lastPhase=ST.phase;
    updateMine();
  }
  render();checkTicker();
}

  const m={code:ST.code,phase:ST.phase,season:ST.season,seasons:ST.settings.seasons,clubs:ST.players.map(p=>p.club)};

}

// ---------- Live-Ticker ----------
let TK=null;
function checkTicker(){
  if(!ST||!ST.last)return;const c=myC();if(!c)return;
  const tag=`${ST.code}:${me()}:${ST.last.season}-${ST.last.md}`;
  if(ui.tickerShown===tag)return;
  const seen=LS.get('kc:seen',{});const key=ST.code+':'+(ST.career?ST.seed+':':'')+me();
  ui.tickerShown=tag;
  if(seen[key]===`${ST.last.season}-${ST.last.md}`)return;
  seen[key]=`${ST.last.season}-${ST.last.md}`;LS.set('kc:seen',seen);
  showTicker(true);
}
function showTicker(auto){
  const c=myC();if(!c||!ST.last)return;
  const ms=ST.last.results.filter(m=>m.h===c.id||m.a===c.id);if(!ms.length)return;
  if(TK&&TK.iv)clearInterval(TK.iv);
  TK={ms,i:0,min:0,card:ST.last.cards[c.id],showCard:false,md:ST.last.md,auto:!!auto};
  document.getElementById('ov').style.display='flex';
  runTicker();
}
function runTicker(){clearInterval(TK.iv);const m0=TK.ms[TK.i];TK.min=TK.auto&&m0&&m0.ht?45:0;drawTicker();TK.iv=setInterval(()=>{TK.min++;if(TK.min>=90){TK.min=90;clearInterval(TK.iv);}drawTicker();},75);}
function drawTicker(){
  const box=document.getElementById('ovb');
  if(TK.showCard){const k=TK.card;box.innerHTML=`<div class="row"><span class="pill">Ereigniskarte</span><span class="sp"></span><button class="ic" data-ov="close">✕</button></div><div class="evc ${k.g?'':'bad'}" style="margin-top:12px;padding:18px"><div class="h" style="font-size:28px">🃏 ${esc(k.t)}</div><div>${esc(k.x)}</div>${k.choice?'<p class="small" style="margin-bottom:0"><b>Deine Entscheidung ist gefragt</b> – im Spieltag-Tab.</p>':''}</div><button class="btn pri block" data-ov="close">Weiter</button>`;return;}
  const m=TK.ms[TK.i];const H=ST.clubs[m.h],A=ST.clubs[m.a];
  const ev=m.ev.filter(e=>e.m<=TK.min);let gh=0,ga=0;for(const e of ev)if(e.t==='g'){if(e.s==='h')gh++;else ga++;}
  const done=TK.min>=90;
  const more=TK.i<TK.ms.length-1;
  box.innerHTML=`<div class="row"><span class="pill">${m.cup?'Pokal · '+esc(m.cup):'Liga · Spieltag '+(TK.md+1)}</span><span class="sp"></span><button class="ic" data-ov="close">✕</button></div>
  <div class="score"><div class="tm">${dot(H)}<br>${esc(H.name)}</div><div class="sc">${gh}:${ga}</div><div class="tm">${dot(A)}<br>${esc(A.name)}</div></div>
  <div class="row tiny mut"><span class="sp" style="text-align:center">${esc(TAC[m.th].n)}</span><span class="sp" style="text-align:center">${esc(TAC[m.ta].n)}</span></div>
  <div class="clock" style="margin-top:6px">${done?(m.pens?`Elfmeterschießen ${m.pens[0]}:${m.pens[1]}`:'Abpfiff'):TK.min+'′'}</div>
  <div style="margin-top:10px;min-height:120px">${ev.slice().reverse().map(e=>`<div class="tk ${e.s}"><span class="m">${e.m}′</span><span>${e.t==='g'?`⚽ <b>Tor!</b> ${esc(e.x)} <span class="mut">(${e.sc})</span>${e.as?`<br><span class="tiny mut">Vorlage: ${esc(e.as)}</span>`:''}`:e.t==='c'?`💨 Chance für ${esc(e.x)}`:`🚑 ${esc(e.x)} verletzt (${e.n} Sp.)`}</span></div>`).join('')||'<div class="mut small" style="text-align:center;padding-top:30px">Anpfiff…</div>'}</div>
  ${done?(more?'<button class="btn pri block" style="margin-top:12px" data-ov="next">Nächstes Spiel</button>':TK.card?'<button class="btn pri block" style="margin-top:12px" data-ov="card">Ereigniskarte aufdecken</button>':'<button class="btn pri block" style="margin-top:12px" data-ov="close">Schließen</button>'):'<button class="btn block" style="margin-top:12px" data-ov="skip">Überspringen</button>'}`;
}
document.getElementById('ov').addEventListener('click',e=>{
  const b=e.target.closest('[data-ov]');if(!b||!TK)return;const a=b.dataset.ov;
  if(a==='close'){clearInterval(TK.iv);document.getElementById('ov').style.display='none';TK=null;return;}
  if(a==='skip'){clearInterval(TK.iv);TK.min=90;drawTicker();}
  if(a==='next'){TK.i++;runTicker();}
  if(a==='card'){TK.showCard=true;drawTicker();}
});

ui.subs={};
function subNav(tab,list){

const PREFIXES=['FC','SV','TSV','VfB','SC','1.','SpVgg','FV','TuS','VfL','SG','DJK'];
function initials(n){const w=String(n).split(/\s+/).filter(x=>x&&!PREFIXES.includes(x));const s=(w.length>1?w[0][0]+w[1][0]:(w[0]||n).slice(0,2));return s.toUpperCase();}
function crest(c,sz){sz=sz||28;const col=c.color||'#888';const ini=esc(initials(c.name));
  return `<svg class="crest" width="${sz}" height="${Math.round(sz*1.15)}" viewBox="0 0 40 46" aria-hidden="true"><path d="M20 2 L37 8 V22 C37 34 29 41 20 44 C11 41 3 34 3 22 V8 Z" fill="${col}" stroke="rgba(255,255,255,.55)" stroke-width="2"/><path d="M3 20 H37" stroke="rgba(0,0,0,.18)" stroke-width="7"/><text x="20" y="28" text-anchor="middle" font-family="Bebas Neue,Impact,sans-serif" font-size="17" fill="${col==='#f0f0f0'||col==='#f5c542'?'#13210f':'#fff'}">${ini}</text></svg>`;}
function dot(c){return `<span class="dot" style="background:${c.color}"></span>`;}
function ticons(p,mk){let s='';if(p.tr&&TRAITS[p.tr])s+=` <span title="${esc(TRAITS[p.tr].n)}">${TRAITS[p.tr].i}</span>`;if(p.inj>0)s+=` <span class="tag inj">🚑${p.inj}</span>`;if(p.sus>0)s+=' <span class="tag inj">🟥</span>';if(p.loan)s+=' <span class="tag">Leihe</span>';if(p.ct===1&&!mk)s+=' <span class="tag" style="color:var(--gold);border-color:#f5c54255">📝</span>';return s;}
function crow(p,o){o=o||{};

// ---------- Spielfeld ----------
function pitchSvg(c,form){
  const X=pickXI(Object.assign({},c,{lineup:curLu(c)}),form);
  const rows=[['A',X.A,16],['M',X.M,40],['D',X.D,64],['G',X.G,86]];
  let pl='';
  for(const [k,arr,y] of rows){const n=arr.length;arr.forEach((x,i)=>{const cx=(i+1)*100/(n+1);
    const nm=x.p?esc(x.p.name.split(' ').slice(-1)[0]):'Amateur';const r=x.p?Math.round(x.r):35;
    const ed=xiEditable()&&x.p;const sel=ed&&ui.xiSel&&ui.xiSel.id===x.p.id;
    pl+=`<g transform="translate(${cx},${y})" ${ed?`data-a="xiTap" data-v="${k}|${x.p.id}" style="cursor:pointer"`:''}>${sel?'<circle r="7.2" fill="none" stroke="#d8f24a" stroke-width="1.2"/>':''}<circle r="5.2" fill="${x.oop?'#ff9a3d':c.color}" stroke="#fff" stroke-width=".7"/><text y="1.6" text-anchor="middle" font-size="4.2" font-weight="700" fill="${c.color==='#f0f0f0'||c.color==='#f5c542'?'#13210f':'#fff'}">${r}</text><text y="10" text-anchor="middle" font-size="3.6" fill="#eef3e8">${nm}</text></g>`;});}
  return `<svg viewBox="0 0 100 100" style="width:100%;display:block;border-radius:12px;background:repeating-linear-gradient(180deg,#1d6b3a 0 10%,#1a6135 10% 20%)"><rect x="3" y="3" width="94" height="94" fill="none" stroke="rgba(255,255,255,.5)" stroke-width=".6"/><line x1="3" y1="50" x2="97" y2="50" stroke="rgba(255,255,255,.35)" stroke-width=".5"/><circle cx="50" cy="50" r="9" fill="none" stroke="rgba(255,255,255,.35)" stroke-width=".5"/><rect x="30" y="80" width="40" height="17" fill="none" stroke="rgba(255,255,255,.4)" stroke-width=".5"/><rect x="30" y="3" width="40" height="17" fill="none" stroke="rgba(255,255,255,.4)" stroke-width=".5"/>${pl}</svg><p class="tiny mut" style="margin:6px 0 0">Orange = auf fremder Position.${xiEditable()?' Tippe auf einen Spieler, um ihn auszutauschen.':''}</p>${xiEditable()?xiSwapCard(c,form,X):''}`;
}
function xiEditable(){return !!(ST&&(ST.career||ST.rv>=5)&&['matchday','halftime'].includes(ST.phase)&&!ST.ready[me()]&&myC());}
function xiSwapCard(c,form,X){
  const S=ui.xiSel;if(!S)return '';
  const all=[];for(const k of ['G','D','M','A'])X[k].forEach(x=>{if(x.p)all.push({k,p:x.p});});
  const cur=all.find(a=>a.p.id===S.id);if(!cur){ui.xiSel=null;return '';}
  const inXI=new Map(all.map(a=>[a.p.id,a.k]));
  const eff=p=>p.pos===S.k?p.rat:p.rat-(S.k==='G'||p.pos==='G'?25:12);
  const cands=c.squad.filter(p=>p.id!==S.id&&!(p.inj>0)&&!(p.sus>0)&&!p.sent).sort((a,b)=>(inXI.has(a.id)-inXI.has(b.id))||eff(b)-eff(a));
  const row=p=>{const e=eff(p);const w=inXI.get(p.id);
    return `<div class="pl" data-a="xiSwap" data-v="${p.id}" style="cursor:pointer"><span class="pos ${p.pos}">${POSL[p.pos]}</span><span class="rt" style="color:${ratCol(e)}">${e}</span><div class="pn"><b>${esc(p.name)}${p.pos!==S.k?' <span class="tag" style="background:#ff9a3d;color:#13210f">fremde Pos.</span>':''}</b><span>${p.age} J. · Stärke ${p.rat}${w?` · spielt jetzt ${POSL[w]} – Positionen tauschen`:''}</span></div><span class="mut">⇄</span></div>`;};
  const bench=cands.filter(p=>!inXI.has(p.id)),xi=cands.filter(p=>inXI.has(p.id)&&inXI.get(p.id)!==S.k&&(p.pos===S.k||cur.p.pos===inXI.get(p.id)));
  return `<div id="xiswap" class="card" style="margin:10px 0 0;padding:10px 12px;border:1px solid #d8f24a"><div class="row"><b>${esc(cur.p.name)} (${POSL[S.k]}, ${cur.p.rat}) ersetzen durch …</b><span class="sp"></span><button class="ic" data-a="xiTap" data-v="x|">✕</button></div>
  ${bench.length?`<h4 style="margin:8px 0 2px">Bank</h4>${bench.map(row).join('')}`:'<div class="mut small">Keine Bankspieler verfügbar.</div>'}
  ${xi.length?`<h4 style="margin:10px 0 2px">Positionen tauschen</h4>${xi.map(row).join('')}`:''}</div>`;
}
ACT.xiTap=function(v){const [k,id]=String(v).split('|');ui.xiSel=(k==='x'||(ui.xiSel&&ui.xiSel.id===id))?null:{k,id};render();const el=document.getElementById('xiswap');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});};
ACT.xiSwap=function(v){const c=myC();const S=ui.xiSel;if(!S)return;const form=ui.form||c.form;
  const X=pickXI(Object.assign({},c,{lineup:curLu(c)}),form);const lu={};for(const k of ['G','D','M','A'])lu[k]=X[k].filter(x=>x.p).map(x=>x.p.id);
  let other=null;for(const k of ['G','D','M','A']){const i=lu[k].indexOf(v);if(i>=0)other={k,i};}
  const i=lu[S.k].indexOf(S.id);if(i<0){ui.xiSel=null;render();return;}
  lu[S.k][i]=v;if(other)lu[other.k][other.i]=S.id;
  ui.lu=lu;ui.xiSel=null;render();};

  let h=`<div class="row" style="margin-top:12px"><button class="btn sm" data-a="plBack">‹ Zurück</button></div>`;

  ${t?`<div class="evc ${t.neg?'bad':''}" style="margin:12px 0 0"><b>${t.i} ${esc(t.n)}</b><div class="small">${esc(t.d)}</div></div>`:''}
  <div class="grid2" style="margin-top:12px"><div class="kpi"><span>Marktwert</span><b>${fm(value(p))}</b></div><div class="kpi"><span>Gehalt/Saison</span><b>${fm(salary(p))}</b></div>
  <div class="kpi"><span>Vertrag</span><b>${p.loan?'Leihe':!own?'neu 2–4 J.':p.ct!=null?p.ct+' J.':'–'}</b></div><div class="kpi"><span>Einsätze</span><b>${p.apps||0}</b></div>
  <div class="kpi"><span>Saison ⚽/🅰️</span><b>${p.gs||0} / ${p.as||0}</b></div><div class="kpi"><span>Gesamt ⚽/🅰️</span><b>${p.gc||0} / ${p.ac||0}</b></div></div>
  ${p.inj>0?`<p class="small" style="color:var(--bad)">🚑 Verletzt – fällt noch ${p.inj} Spiel${p.inj>1?'e':''} aus.</p>`:''}${p.sus>0?'<p class="small" style="color:var(--bad)">🟥 Gesperrt für das nächste Spiel.</p>':''}</div>`;
  if(own&&feat(ST)&&p.ct!=null&&p.ct<=2&&!p.loan){
    h+=`<div class="card"><h3>Vertrag verlängern</h3><p class="small mut">${p.ct===1?'Der Vertrag läuft nach dieser Saison aus – dann geht er ablösefrei!':'Noch '+p.ct+' Jahre Vertrag.'} Seine Gehaltsforderung:</p>${[1,2,3].map(y=>`<div class="pl"><div class="pn"><b>+${y} Jahr${y>1?'e':''}</b><span>${fm(extDemand(p,y))} pro Saison (bisher ${fm(salary(p))})</span></div><button class="btn sm ok" data-a="extend" data-v="${p.id}|${y}">${cl('ext'+p.id+y,'Verlängern')}</button></div>`).join('')}</div>`;
  }
  if(own&&off&&!p.loan)h+=`<button class="btn bad block" data-a="sell" data-v="${p.id}">${cl('sell'+p.id,'Verkaufen für '+fm(sellPrice(c,p)),'Wirklich für '+fm(sellPrice(c,p))+' verkaufen?')}</button>`;
  return h;
}

VIEWS.squad=function(){
  const c=myC();if(!c)return noClub();
  if(ui.pl){const p=c.squad.find(x=>x.id===ui.pl);if(p)return playerPage(p,c);ui.pl=null;}
  const subs=[['sp','Spieler'],['xi','Startelf']];if(statsOn(ST))subs.push(['st','Statistik']);if(feat(ST)){const ex=c.squad.filter(p=>p.ct===1).length;subs.push(['ct','Verträge'+(ex?' ('+ex+'📝)':'')]);}
  let h=subNav('squad',subs);const s=sub('squad');
  if(s==='sp'){
    const sal=c.squad.reduce((t,p)=>t+salary(p),0);
    h+=`<div class="row small mut" style="margin:10px 2px"><span>${c.squad.length}/${SQUAD_MAX} Spieler</span><span class="sp"></span><span>Gehälter ${fm(sal)}/Saison</span></div>`;
    let xi=new Set();if(['matchday','halftime'].includes(ST.phase)){const X=pickXI(Object.assign({},c,{lineup:curLu(c)}),ui.form||c.form);for(const k of ['G','D','M','A'])for(const x of X[k])if(x.p)xi.add(x.p.id);}
    for(const pos of ['G','D','M','A']){const ps=c.squad.filter(p=>p.pos===pos).sort((a,b)=>b.rat-a.rat);

    h+='<p class="tiny mut">Tippe auf einen Spieler für Details, Vertrag und Verkauf. 📝 = Vertrag läuft aus.</p>';
  }

  if(s==='st')h+=teamStats(c);

    const ps=c.squad.filter(p=>!p.loan).sort((a,b)=>(a.ct||9)-(b.ct||9)||b.rat-a.rat);

  }
  return h;
};

  const c=myC();if(!c)return noClub();

  const rd=!!ST.ready[me()];const lim=ST.rv>=2&&(c.buys||0)>=buyMax(ST);
  const offs=(c.offers||[]).length;
  let h=feat(ST)?subNav('market',[['buy','Kaufen'],['off',`Angebote${offs?' ('+offs+')':''}`]]):'';
  if(c.bid){const p=ST.market.find(x=>x.id===c.bid.pid);if(p)h+=`<div class="evc" style="border-color:var(--gold)"><div class="tiny" style="color:var(--gold)">WETTBIETEN</div><b>${esc(c.bid.rival)} will ${esc(p.name)} auch!</b><div class="small" style="margin:4px 0 10px">Um ihn zu bekommen, musst du ${fm(c.bid.price)} zahlen.</div><div class="row"><button class="btn sm pri" data-a="bidOk" ${c.cash<c.bid.price?'disabled':''}>Mitbieten (${fm(c.bid.price)})</button><button class="btn sm" data-a="bidNo">Aussteigen</button></div></div>`;}
  if(feat(ST)&&sub('market')==='off'){
    h+=`<div class="card"><h3>Angebote für deine Spieler</h3>${offs?c.offers.map(o=>{const p=c.squad.find(x=>x.id===o.pid);if(!p)return '';return `<div class="pl" style="flex-wrap:wrap"><span class="pos ${p.pos}">${POSL[p.pos]}</span><span class="rt" style="color:${ratCol(p.rat)}">${p.rat}</span><div class="pn"><b>${esc(p.name)}</b><span>${esc(o.club)} bietet <b style="color:var(--acc2)">${fm(o.price)}</b> (Wert ${fm(value(p))})</span></div><div class="row" style="width:100%;margin:6px 0 0 72px"><button class="btn sm ok" data-a="offerOk" data-v="${o.id}">${cl('of'+o.id,'Annehmen')}</button><button class="btn sm" data-a="offerNo" data-v="${o.id}">Ablehnen</button></div></div>`;}).join(''):'<div class="empty small">Gerade keine Angebote. Neue kommen in jeder Sommerpause.</div>'}</div>`;
    return h;
  }
  const vis=ST.market.filter(p=>visible(c,p));const hidden=ST.market.length-vis.length;
  h+=`<div class="row small mut" style="margin:10px 2px"><span>Transfers ${c.buys||0}/${buyMax(ST)} · Kader ${c.squad.length}/${SQUAD_MAX}</span><span class="sp"></span><span>${fm(c.cash)}</span></div>`;
  h+=posChips();
  const list=vis.filter(p=>ui.pos==='all'||p.pos===ui.pos).sort((a,b)=>b.rat-a.rat);
  h+=`<div class="card" style="padding:8px 14px">${list.map(p=>{const pr=buyPrice(c,p);return crow(p,{tap:1,mk:1,sub:`${p.age} J.${p.free?' · ablösefrei':''} · Gehalt ${fm(salary(p))}`,right:`<button class="btn sm ok" data-a="buy" data-v="${p.id}" ${rd||lim||c.cash<pr||c.squad.length>=SQUAD_MAX?'disabled':''}>${fm(pr)}</button>`});}).join('')||'<div class="empty">Keine Spieler sichtbar.</div>'}</div>`;
  if(hidden)h+=`<p class="tiny mut">🔭 ${hidden} weitere Spieler kennt nur ein besseres Scouting-Netzwerk.</p>`;
  if(feat(ST))h+='<p class="tiny mut">Achtung: Andere Vereine kaufen mit – gute Spieler sind schnell weg, und manchmal bietet jemand mit.</p>';
  return h;
};

// ---------- Spieltag (online + Karriere) ----------
function oppInfo(c){
  if(ST.career){const fx=ST.sched[c.lg][ST.md].find(m=>m.includes('me'));const home=fx[0]==='me';return{home,opp:ST.clubs[home?fx[1]:fx[0]]};}
  const fx=ST.schedule[ST.md].find(m=>m.includes(c.id));const home=fx[0]===c.id;return{home,opp:ST.clubs[home?fx[1]:fx[0]]};
}
function pendingCard(c){
  if(c.pending)return `<div class="evc"><div class="tiny mut">EREIGNISKARTE – ENTSCHEIDUNG</div><b>🃏 ${esc(c.pending.t)}</b><div class="small" style="margin:4px 0 10px">${esc(c.pending.x)}</div><div class="row">${c.pending.opts.map((o,i)=>`<button class="btn sm ${i===0?'pri':''}" data-a="choose" data-v="${i}">${esc(o)}</button>`).join('')}</div></div>`;
  return '';
}
function planBCard(c,rd){
  if(!feat(ST)||ST.career)return '';
  const pb=ui.planB!==undefined?ui.planB:(c.planB||'');
  return `<div class="card"><h3>Plan B zur Halbzeit</h3><p class="small mut">Liegst du zur Pause hinten, stellt dein Team automatisch um auf:</p><div class="chips">${[['','Nichts ändern']].concat(Object.keys(TAC).map(k=>[k,TAC[k].n])).map(([k,l])=>`<span class="chip ${pb===k?'on':''}" ${rd?'':`data-a="planB" data-v="${k}"`}>${l}</span>`).join('')}</div></div>`;
}
function matchPage(c){
  const rd=!!ST.ready[me()];const form=ui.form||c.form,tac=ui.tac||c.tac;
  const {home,opp}=oppInfo(c);
  const tabs=[['g','Spiel'],['t','Taktik'],['e','Elf']];if(ST.rv>=2||ST.career)tabs.push(['x','Extras']);
  let h=subNav('match',tabs);const s=sub('match');
  if(s==='g'){
    h+=pendingCard(c);
    const R=teamRat(Object.assign({},c,{lineup:curLu(c)}),form,tac,'bal',home);const O=teamRat(opp,opp.human?opp.form:'4-4-2','bal',tac,!home);
    let extra='';
    if(ST.career)extra=cupToday(c).map(x=>`<div class="small" style="margin-top:6px">🏆 Außerdem ${esc(x.cup.name)} (${x.rn}): <b>${esc(x.opp.name)}</b></div>`).join('');
    else{const ci=ST.cupMds.indexOf(ST.md);if(ci>=0&&!ST.cup.winner){const i=ST.cup.alive.indexOf(c.id);if(i>=0)extra=`<div class="small" style="margin-top:6px">🏆 Außerdem ${esc(CUPN[ci])}: <b>${esc(ST.clubs[ST.cup.alive[i^1]].name)}</b></div>`;}}
    const pos=ST.career?careerTable(ST,c.lg).findIndex(x=>x.id==='me')+1:sortedTable(ST).findIndex(x=>x.id===c.id)+1;
    h+=`<div class="card" style="text-align:center"><div class="mut small">${ST.career?LNAME[c.lg]+' · ':''}Spieltag ${ST.md+1} · Platz ${pos} · ${home?'Heim':'Auswärts'}</div>
    <div class="row" style="justify-content:center;gap:14px;margin:10px 0"><div style="flex:1">${crest(home?c:opp,40)}<div class="small" style="font-weight:700">${esc((home?c:opp).name)}</div></div><div class="h" style="font-size:26px">VS</div><div style="flex:1">${crest(home?opp:c,40)}<div class="small" style="font-weight:700">${esc((home?opp:c).name)}</div></div></div>${extra}</div>
    <div class="card"><div class="row tiny mut"><span style="width:82px"></span><span class="sp">Du</span><span>Gegner${opp.human?' (geschätzt)':''}</span></div>${rbar('Angriff',R.A,O.A)}${rbar('Mittelfeld',R.M,O.M)}${rbar('Abwehr',R.D,O.D)}<p class="tiny mut" style="margin:6px 0 0">${esc(TAC[tac].n)} · ${form} · Moral ${c.moral}/5</p></div>`;
    const L=ST.last;
    if(L&&L.season===ST.season&&L.md!=='CL'){const mine=L.results.filter(m=>m.h===me()||m.a===me());const card=L.cards[me()];
      h+=`<div class="card"><h4 style="margin-top:0">Letzter Spieltag</h4>${mine.map(resLine).join('')}${mine.length?'<button class="btn sm" style="margin-top:8px" data-a="ticker">▶ Ticker</button>':''}${card&&!c.pending?`<div class="evc ${card.g?'':'bad'}"><b>🃏 ${esc(card.t)}</b><div class="small">${esc(card.x)}</div></div>`:''}</div>`;}
  }
  if(s==='t')h+=tacPicker(c,form,tac,rd)+planBCard(c,rd);
  if(s==='e')h+=`<div class="card">${pitchSvg(c,form)}</div>`+luCard(c,form,rd);
  if(s==='x')h+=campCard(c,rd)||'<div class="card empty small">Keine Extras.</div>';
  return h;
}

function evLine(e){return `<div class="tk ${e.s}"><span class="m">${e.m}′</span><span>${evText(e)}</span></div>`;}
function evText(e){
  if(e.t==='g')return `⚽ <b>Tor!</b> ${esc(e.x)} <span class="mut">(${e.sc})</span>${e.as?`<br><span class="tiny mut">Vorlage: ${esc(e.as)}</span>`:''}`;
  if(e.t==='p')return `⚽ <b>Elfmeter – drin!</b> ${esc(e.x)} <span class="mut">(${e.sc})</span>`;
  if(e.t==='pm')return `🧤 Elfmeter vergeben!${e.x?' '+esc(e.x)+' hält.':''}`;
  if(e.t==='r')return `🟥 <b>Rote Karte</b> für ${esc(e.x)}`;
  if(e.t==='t')return `🔄 Umstellung auf ${esc(e.x)}`;
  if(e.t==='c')return `💨 Chance für ${esc(e.x)}`;
  return `🚑 ${esc(e.x)} verletzt (${e.n} Sp.)`;
}

// ---------- Elfmeterschießen (Pokal) ----------
function soSeq(m){
  const [ph,pa]=m.pens;let hv=h32(`so|${m.h}|${m.a}|${ph}|${pa}`);const rnd=n=>{hv=h32(String(hv));return hv%n;};
  const pick=(n,k)=>{const a=Array(n).fill(0);let c=0;while(c<k){const i=rnd(n);if(!a[i]){a[i]=1;c++;}}return a;};
  let H,A;
  if(Math.max(ph,pa)<=5&&ph!==pa){H=pick(5,ph);A=pick(5,pa);}
  else{const W=Math.max(ph,pa),L=W-1;const k=Math.max(0,Math.min(5,L)-rnd(3));const both=L-k,miss=rnd(2);
    const f=pick(5,k);H=f.slice();A=pick(5,k);const sd=[];for(let i=0;i<both;i++)sd.push(1);for(let i=0;i<miss;i++)sd.splice(rnd(sd.length+1),0,0);
    for(const x of sd){H.push(x);A.push(x);}H.push(ph>pa?1:0);A.push(pa>ph?1:0);}
  const seq=[];for(let i=0;i<H.length;i++){seq.push({s:'h',hit:H[i],k:i});seq.push({s:'a',hit:A[i],k:i});}
  return seq;
}
function soName(cid,k){const c=ST.clubs[cid];if(c&&c.squad&&c.squad.length){const xs=c.squad.filter(p=>p.pos!=='G').sort((a,b)=>b.rat-a.rat);if(xs.length)return xs[k%xs.length].name;}return (k+1)+'. Schütze';}
function soStart(){
  const m=TK.ms[TK.i];const so={seq:soSeq(m),i:-1,done:false};TK.so=so;
  const step=()=>{if(!TK||TK.so!==so||so.done)return;so.i++;
    if(so.i>=so.seq.length){so.done=true;TK.pen=null;drawTicker();return;}
    const s=so.seq[so.i];const e={m:100+so.i,t:s.hit?'p':'pm',s:s.s,x:soName(s.s==='h'?m.h:m.a,s.k),so:true};
    TK.pen=e;drawTicker();animPen(e,m);setTimeout(step,2400);};
  step();
}
function soDots(m){const so=TK.so;const row=side=>{const xs=so.seq.slice(0,so.i+(TK.pen?0:1)).filter(x=>x.s===side);
  const shown=so.seq.filter((x,j)=>j<so.i||(j===so.i&&!TK.pen)||so.done).filter(x=>x.s===side);
  const n=Math.max(5,so.seq.filter(x=>x.s===side).length);let h='';for(let i=0;i<n;i++){const x=shown[i];h+=`<span style="display:inline-block;width:14px;height:14px;border-radius:50%;margin:0 3px;background:${x?(x.hit?'#3fd0a0':'#ff5b4d'):'rgba(255,255,255,.15)'}"></span>`;}return h;};
  let a=0,b=0;for(let j=0;j<so.seq.length;j++){const x=so.seq[j];if(j<so.i||(j===so.i&&!TK.pen)||so.done){if(x.hit){if(x.s==='h')a++;else b++;}}}
  return `<div class="card" style="padding:10px;margin:8px 0"><div class="row small"><span>${esc(ST.clubs[m.h].name)}</span><span class="sp"></span><span>${row('h')}</span></div><div class="row small" style="margin-top:6px"><span>${esc(ST.clubs[m.a].name)}</span><span class="sp"></span><span>${row('a')}</span></div><div class="h" style="text-align:center;font-size:22px;margin-top:6px">${a}:${b}</div></div>`;}
const _penPlanSO=penPlan;
penPlan=function(e,m){if(!e.so)return _penPlanSO(e,m);
  if(e.t==='pm'){const hv=h32(`${m.h}|${m.a}|${e.m}|so`);if(hv%10<3){const opts=[[22,90],[278,90],[150,16]];const X=[78,150,222];return{bx:opts[(hv>>4)%3][0],by:opts[(hv>>4)%3][1],kx:X[(hv>>7)%3]-150,goal:false,txt:'VORBEI!'};}}
  return _penPlanSO(Object.assign({},e,{x:e.x+'#'}),m);};
const _drawTickerSO=drawTicker;

  h+='</div>';
  const hl=(c.hires||0)>=1;
  h+=`<div class="card"><h3>Auf Jobsuche</h3>${off?`<p class="small mut">Neueinstellungen diese Sommerpause: ${c.hires||0}/1</p>`:'<p class="small mut">Einstellen geht nur in der Sommerpause.</p>'}${ST.staffPool.length?ST.staffPool.map(s=>{const dis=!off||hl||c.staff.filter(x=>!x.exp).length>=3||c.staff.length>=3||has(c,s.type)||c.cash<s.fee;return `<div class="pl"><div class="pn"><b>${esc(STAFF[s.type].n)}</b><span>${esc(s.name)} · ${esc(sd(s.type))}<br>Ablöse ${fm(s.fee)} · Gehalt ${fm(s.sal)}/Saison · ${s.ct||2} Jahre</span></div><button class="btn sm ok" data-a="hire" data-v="${s.id}" ${dis?'disabled':''}>Holen</button></div>`;}).join(''):'<div class="empty small">Alle vergeben.</div>'}</div>`;
  return h;
}
ACT.staffExt=function(v){const [id,y]=String(v).split('|');send('STAFF_EXT',{staff:id,yrs:+y});};
ACT.staffGo=function(v){send('STAFF_GO',{staff:v});};

// ---------- Start ----------
async function initFirebase(cfg){
  const V='https://www.gstatic.com/firebasejs/10.12.2/';
  const {initializeApp}=await import(V+'firebase-app.js');
  const fs=await import(V+'firebase-firestore.js');
  const db=fs.getFirestore(initializeApp(cfg));
  const wrap=s=>({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()})),metadata:s.metadata});
  const docRef=p=>({set:d=>fs.setDoc(fs.doc(db,p),d)});
  const q=(path,cons)=>({
    orderBy:(f,d)=>q(path,cons.concat(fs.orderBy(f,d||'asc'))),
    limit:n=>q(path,cons.concat(fs.limit(n))),
    doc:id=>docRef(path+'/'+id),
    get:async()=>wrap(await fs.getDocs(fs.query(fs.collection(db,path),...cons))),
    onSnapshot:(next,err)=>fs.onSnapshot(fs.query(fs.collection(db,path),...cons),s=>next(wrap(s)),e=>err&&err({code:e.code,message:e.message}))
  });
  return{doc:docRef,collection:p=>q(p,[])};
}
render();
(async()=>{
  try{
    const cfg=window.FIREBASE_CONFIG;
    if(cfg&&cfg.apiKey&&!/DEIN|YOUR/.test(cfg.apiKey)){NET.web=true;NET.db=await initFirebase(cfg);NET.canWrite=true;}
    else if(window.claude&&typeof window.claude.use==='function'){
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      NET.db=db||null;NET.user=user||null;
      if(user){try{NET.canWrite=await user.can('data.write');}catch(e){}}
    }
  }catch(e){console.error(e);}
  NET.ready=true;if(ui.view==='start')render();
  if(NET.db)loadOpen();
})();
