<script>
// ================= KLUBCHEF ENGINE (deterministisch) =================
// Alle Zufälle kommen aus RNG(seed, schlüssel) – jedes Gerät berechnet denselben Spielstand.
function h32(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function RNG(seed,key){const f=mulberry(h32(seed+'|'+key));return{f,
  int:(a,b)=>a+Math.floor(f()*(b-a+1)),
  pick:arr=>arr[Math.floor(f()*arr.length)],
  chance:p=>f()<p,
  shuffle:arr=>{const x=arr.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(f()*(i+1));const t=x[i];x[i]=x[j];x[j]=t;}return x;},
  norm:(m,s)=>{let u=0;for(let i=0;i<4;i++)u+=f();return m+(u-2)*1.732*s;},
  wpick:(items)=>{let tot=0;for(const it of items)tot+=it.w;let x=f()*tot;for(const it of items){x-=it.w;if(x<0)return it;}return items[items.length-1];}
};}
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const r2=x=>Math.round(x*100)/100;

const FIRST=['Lukas','Jonas','Leon','Finn','Elias','Noah','Paul','Ben','Felix','Max','Luca','Tim','Jan','Nico','Moritz','Julian','David','Simon','Fabian','Niklas','Marco','Kevin','Dennis','Timo','Sven','Florian','Tobias','Matteo','Emil','Anton','Malik','Yusuf','Mats','Ole','Hannes','Jannik','Kai','Robin','Lars','Erik','Mika','Aaron','Samuel','Joel','Tom','Linus','Theo','Adrian','Dario','Enzo','Luis','Mateo','Nils','Piet','Rafael','Henrik','Kilian','Levin','Milan','Oskar','Ilias','Can','Davor','Jakub','Andrés','Mamadou','Tiago','Kofi','Sander','Jari'];
const LAST=['Brandt','Kessler','Vogt','Hartmann','Lindner','Schäfer','Köhler','Wendt','Brenner','Albrecht','Ruhland','Seidel','Krämer','Busch','Engel','Graf','Haas','Jäger','Kurz','Lorenz','Marx','Nagel','Otto','Pohl','Rieger','Sauer','Thiel','Ulrich','Vetter','Winter','Zeller','Adler','Bauer','Dietz','Eckert','Fink','Gerber','Heller','Iser','Jansen','Kuhn','Lang','Maier','Neumeier','Oswald','Pfeiffer','Quast','Rapp','Stein','Thoma','Unger','Vollmer','Weiß','Ziegler','Berger','Fuchs','Hesse','Kaya','Novak','Silva','Diallo','Petrović','Lindqvist','Moreau','Costa','Kowalski','Mensah','Okafor','Hansen','Rossi','Yilmaz','Dvořák','Varga','Nowak','Martín','Delgado','Sørensen','Bakker','Laurent','Esposito'];
const NPC_NAMES=['FC Rheinstadt','SV Neckartal 08','Borussia Waldau','Eintracht Hafenburg','VfL Odenwald','SC Bodensee','Union Lindenau','Rot-Weiß Elbstadt','Alemannia Hochfeld','TSV Bergheim','Fortuna Mühlbach','Viktoria Kraichgau','SpVgg Talheim','Sportfreunde Auenthal'];
const COLORS=['#e5484d','#3e8bff','#f5c542','#2fbf71','#a16bff','#ff8a3d','#1fc6d4','#f0f0f0'];
const NPC_COL=['#7c8a85','#8a7f6e','#6e7d8a','#857089','#6f8a72','#8a6f6f','#7a7a95','#94866b'];

const FORM={'4-4-2':[4,4,2],'4-3-3':[4,3,3],'3-5-2':[3,5,2],'5-3-2':[5,3,2],'4-5-1':[4,5,1],'3-4-3':[3,4,3]};
const TAC={

  off:{n:'Offensiv',d:'Angriff +5, Abwehr −4.'},
  def:{n:'Defensiv',d:'Abwehr +5, Angriff −4.'},

const STAFF={

  vid:{n:'Videoanalyst',d:'Gegneranalyse trifft zu 95 % statt 75 %'},

};
const UPS={
  training:{n:'Trainingszentrum',d:l=>`Spieler bis 26 entwickeln sich um +${String((l-1)*0.5).replace('.',',')} pro Saison besser.`},
  scouting:{n:'Scouting-Netzwerk',d:l=>`Du siehst ${l>=4?'alle':'mehr'} Spieler am Markt${l>1?`, −${(l-1)*4} % Ablöse`:''}${l>=3?', Potenzial sichtbar':''}.`},
  stadium:{n:'Stadion',d:l=>`${CAP[l].toLocaleString('de-DE')} Plätze · +${l-1} Ruhm pro Saison.`},
  youth:{n:'Jugendakademie',d:l=>`Jede Sommerpause ein Talent mit Stärke ~${40+l*4}.`}
};
const UPCOST=[0,3,5,8,12];
const CAP=[0,15000,22000,32000,45000,60000];
const TICKET=50; // Euro
const QUOTA={G:2,D:5,M:5,A:3};
const SQUAD_MAX=22,SQUAD_MIN=12,LEAGUE=8,MAXH=6;
const PLACE_FAME=[10,7,5,4,3,2,1,0];
const CATCHUP=[0,1,2,3,3.5,4,4.5,5];
const CL_CLUBS=['Real Castilla CF','AC Lombardia','Olympique Riviera','Royal Thames FC','Sporting Atlântico','FC Amstel','Inter Partenope','Athletic Bravura','Dynamo Baltika','Galatasaray Bosporus'];
const CL_NATIONS=['Brasilien','Frankreich','Argentinien','Spanien','England','Portugal','Niederlande','Italien'];
const BUY_MAX=2;
const DIFF={leicht:{n:'Leicht',o:-5},normal:{n:'Normal',o:0},schwer:{n:'Schwer',o:4},profi:{n:'Profi',o:8}};
function doff(st){return st.rv>=2?(DIFF[st.settings.diff]||DIFF.normal).o:0;}
function seasonsLeft(st){return !st.settings.seasons||st.season<st.settings.seasons;}
function titles(c){return c.trophies.filter(t=>t.startsWith('Meister')).length;}
function clEligible(c){return c.fame>=50||titles(c)>=3;}

function Rej(m){this.m=m;}
function rej(m){throw new Rej(m);}

let CAREER_VAL=false;
function value(p){if(CAREER_VAL){const af=p.age<=21?1.3:p.age<=25?1.15:p.age<=29?1:p.age<=32?0.7:0.4;return Math.max(0.01,r2(0.05*Math.pow(1.13,p.rat-40)*af));}const x=Math.max(0,(p.rat-40)/10);let v=0.6*x*x*(1+0.1*x);const af=p.age<=21?1.3:p.age<=25?1.15:p.age<=29?1:p.age<=32?0.7:0.4;v*=af;return Math.max(0.2,Math.round(v*10)/10);}
function salary(p){if(p.sal!=null)return p.sal;return calcSal(p);}
function calcSal(p){if(CAREER_VAL)return Math.max(0.005,Math.round(value(p)*0.15*1000)/1000);return Math.max(0.1,r2(value(p)*0.12));}
function ext8(st){return !!st.career||st.rv>=8;}
function effRat(c,p){return c&&c.cond&&p.fr!=null?p.rat*(1-0.05*(1-p.fr/100)):p.rat;}
function condUpdate(c,full,half){if(!c.cond)return;const rec=has(c,'fit')?40:30;for(const p of c.squad){if(p.fr==null)p.fr=100;if(full.has(p.id))p.fr-=10;else if(half.has(p.id))p.fr-=5;else p.fr+=rec;p.fr=Math.max(0,Math.min(100,p.fr));}}
function xiIds(c){const X=pickXI(c,c.form);const s=new Set();for(const k of ['G','D','M','A'])for(const x of X[k])if(x.p)s.add(x.p.id);return s;}
function applyStyle(c,a){const L=a.logo||{};const SH=['shield','circle','diamond','pennant'],PAT=['none','vs','hs','split','band'];
  c.logo={sh:SH.includes(L.sh)?L.sh:'shield',c2:typeof L.c2==='string'&&/^#[0-9a-f]{6}$/i.test(L.c2)?L.c2:'#ffffff',pat:PAT.includes(L.pat)?L.pat:'none',ini:String(L.ini||'').toUpperCase().replace(/[^A-ZÄÖÜ0-9]/g,'').slice(0,3),sym:String(L.sym||'').slice(0,4)};
  if(typeof a.color==='string'&&/^#[0-9a-f]{6}$/i.test(a.color))c.color=a.color;
  if(a.ultras!=null)c.ultras=String(a.ultras).slice(0,28);if(a.stadium!=null)c.stadium=String(a.stadium).slice(0,32);}
function has(c,t){return c.staff&&c.staff.some(s=>s.type===t&&!s.exp);}
function fmtM(x){return x<1?Math.round(x*1000)+' Tsd.':x.toFixed(1).replace('.',',')+' Mio';}
function completeBuy(st,c,p,price,a){
  st.market=st.market.filter(x=>x!==p);delete p.tier;p.inj=0;
  if(p.free){p.free=false;p.sal=Math.round(calcSal(p)*1.1*1000)/1000;}
  p.ct=RNG(st.seed,'ct'+p.id).int(2,4);
  c.squad.push(p);money(c,-price);c.buys=(c.buys||0)+1;
  feed(st,`${c.name} holt ${p.name} (${POSL[p.pos]}, ${p.rat}) für ${fmtM(price)}.`,c.id);
  const r=RNG(st.seed,'ai'+a.id);
  if(st.market.length&&r.f()<0.5){const q=r.pick(st.market);st.market=st.market.filter(x=>x!==q);feed(st,`${q.name} (${q.rat}) wechselt zu ${st.clubs[r.pick(npcNames(st,c))].name}.`);}
}
function buyPrice(c,p){if(p.free)return Math.max(0.005,r2(salary(p)));let v=value(p)*(1-0.04*(c.up.scouting-1));if(has(c,'scout'))v*=0.9;return r2(v);}
function sellPrice(c,p){let v=value(p)*0.8;if(has(c,'sd'))v*=1.15;return r2(v);}
function visible(c,p){return (p.tier||1)<=c.up.scouting+1;}
function money(c,x){c.cash=r2(c.cash+x);}
function newId(st){return 'p'+(st.nextId++);}
// Legenden-Nachnamen (ab rv9 bzw. Karriere): ehemalige Profis mit anderem Vornamen
const LEGS=['Ballack','Scholl','Effenberg','Matthäus','Klinsmann','Völler','Kahn','Lehmann','Klose','Podolski','Schweinsteiger','Lahm','Mertesacker','Frings','Häßler','Sammer','Möller','Basler','Bierhoff','Kuranyi','Kießling','Kuntz','Brehme','Littbarski','Rummenigge','Beckenbauer','Neuville','Jancker','Elber','Lizarazu','Zidane','Henry','Pirès','Vieira','Figo','Maldini','Baresi','Totti','Del Piero','Pirlo','Nesta','Cannavaro','Schewtschenko','Nedvěd','Rosický','Larsson','Bergkamp','Kluivert','Seedorf','Davids','Gullit','Rijkaard','Owen','Gerrard','Lampard','Scholes','Beckham','Shearer','Hierro','Puyol','Iniesta','Butragueño','Hagi','Stoichkov','Šuker','Litmanen','Laudrup','Schmeichel','Batistuta','Riquelme','Crespo','Zanetti','Drogba','Okocha','Yeboah','Weah','Makaay','Pizarro','Hargreaves','Deisler','Ricken','Chapuisat','Sforza','Herzog','Polster'];
const LEGM=['Ronaldinho','Rivaldo','Kaká','Romário','Bebeto','Cafu','Dunga','Juninho','Adriano','Ailton','Raúl','Xavi','Guti','Dedê','Marcelinho','Amoroso','Zé Roberto','Lúcio','Élber'];
function legOk(st){return !!st&&(st.career||st.rv>=9);}
function applyLeg(st,r,p){if(!legOk(st)||!r.chance(0.07))return;
  if(r.chance(0.25)){p.name=r.pick(LEGM);}else{let f=r.pick(FIRST);p.name=f+' '+r.pick(LEGS);}
  p.leg=1;p.rat=Math.min(90,p.rat+2);p.pot=Math.max(p.pot,p.rat);}
function pname(r){return r.pick(FIRST)+' '+r.pick(LAST);}
function tierOf(r,p){let t=p.rat>=80?5:p.rat>=75?4:p.rat>=70?3:p.rat>=62?2:1;if(p.age<=21&&p.pot>=80)t++;t+=r.int(-1,0);return clamp(t,1,5);}

function genPlayer(st,r,pos,mean,sd,amin,amax){
  const age=r.int(amin,amax);
  const rat=Math.round(clamp(r.norm(mean,sd),44,88));
  const pot=Math.min(95,rat+(age<=21?r.int(4,16):age<=24?r.int(1,8):r.int(0,2)));
  return{id:newId(st),name:pname(r),pos,age,rat,pot,inj:0};
}

  spm:{n:'Spielmacher',i:'🧠',d:'Mehr Vorlagen · Mittelfeld +1',pos:'M'},
  abw:{n:'Abwehrchef',i:'🛡️',d:'Abwehr +1,5',pos:'D'},

  elf:{n:'Elfmeterexperte',i:'⚽',d:'Schießt Elfmeter, wenn er spielt · trifft deutlich sicherer',fld:1,x8:1},
  tal:{n:'Frühentwickler',i:'🚀',d:'+1 Entwicklung pro Saison bis 24 Jahre',young:1},

  ver:{n:'Verletzungsanfällig',i:'🩹',d:'Doppeltes Verletzungsrisiko',neg:1}
};
function traitFor(r,p,st){if(p.pos==='G'&&st&&(st.career||st.rv>=10))return 'tw';const o=Object.keys(TRAITS).filter(k=>{const t=TRAITS[k];if(t.x8&&!(st&&ext8(st)))return false;if(t.fld&&p.pos==='G')return false;if(t.pos&&t.pos!==p.pos)return false;if(t.young&&p.age>23)return false;if(t.old&&p.age<28)return false;return true;});return r.wpick(o.map(k=>({v:k,w:TRAITS[k].neg?0.5:TRAITS[k].pos?1.6:1}))).v;}
function ensureP(st,p){
  if(!p||p.ct!=null||p.loan)return;
  const r=RNG(st.seed,'pl'+p.id);
  if(p.tr===undefined)p.tr=r.chance(0.35)?traitFor(r,p,st):null;
  p.ct=p.age<=19?3:r.int(1,4);
  p.sal=Math.round(calcSal(p)*(p.tr==='gie'?1.3:1)*1000)/1000;
}
function ensureAll(st){
  if(st.phase==='lobby')return;
  for(const pid of humans(st)){const c=st.clubs[pid];if(c)for(const p of c.squad)ensureP(st,p);}
  for(const p of st.market||[])if(!p.free)ensureP(st,p);
  if(st.draft)for(const p of (st.draft.board||st.draft.pool))ensureP(st,p);
  for(const pid of humans(st)){const c=st.clubs[pid];if(c&&c.camp)for(const p of c.camp.kids)ensureP(st,p);}
}
function extDemand(p,y){const f=y===1?1.25:y===2?1.15:1.1;return Math.round(calcSal(p)*f*(p.tr==='gie'?1.3:1)*(p.tr==='tre'?0.85:1)*1000)/1000;}
function buyMax(st){return feat(st)?5:st.career?3:BUY_MAX;}
function npcNames(st,c){const ids=st.career?st.order[Math.max(1,(c.lg||2)-1)].concat(st.order[c.lg||1]):st.league;return ids.filter(id=>!st.clubs[id].human);}
function makeOffers(st){
  for(const pid of humans(st)){const c=st.clubs[pid];const r=RNG(st.seed,'off'+st.season+pid+(st.rc||0));c.offers=[];
    const top=c.squad.filter(p=>!p.loan).sort((a,b)=>b.rat-a.rat).slice(0,8);const n=r.int(0,2);
    const used=new Set();
    for(let i=0;i<n&&top.length;i++){const p=r.pick(top);if(used.has(p.id))continue;used.add(p.id);
      c.offers.push({id:'of'+(st.nextId++),pid:p.id,price:r2(value(p)*(1.1+r.f()*0.6)),club:st.clubs[r.pick(npcNames(st,c))].name});}
  }
}
function genYouth(st,r,c){
  const pos=r.wpick([{v:'G',w:1},{v:'D',w:3},{v:'M',w:3},{v:'A',w:3}]).v;
  let rat=40+c.up.youth*4+r.int(-2,3);if(has(c,'youth'))rat+=5;
  return{id:newId(st),name:pname(r),pos,age:17,rat,pot:Math.min(93,rat+r.int(12,24)),inj:0};
}
function genMarket(st,r,n){
  const out=[];
  for(let i=0;i<n;i++){
    const pos=r.wpick([{v:'G',w:2},{v:'D',w:5},{v:'M',w:6},{v:'A',w:5}]).v;
    const p=genPlayer(st,r,pos,67,8,18,33);if(st.rv>=9)applyLeg(st,r,p);p.tier=tierOf(r,p);out.push(p);
  }
  return out;
}
function genStaff(st,r,n){
  const types=r.shuffle(Object.keys(STAFF).filter(k=>k!=='vid')).slice(0,n);
  if(st.rv>=3)return types.map(t=>({id:'s'+(st.nextId++),type:t,name:pname(r),fee:r.int(20,40)/10,sal:r.int(10,20)/10}));
  return types.map(t=>({id:'s'+(st.nextId++),type:t,name:pname(r),fee:r.int(4,12)/10,sal:r.int(3,9)/10}));
}
function humans(st){return st.players.map(p=>p.pid);}
function isHuman(st,pid){return st.players.some(p=>p.pid===pid);}
function feed(st,txt,pid){st.feed.push({s:st.season,md:st.md,txt,pid:pid||null});if(st.feed.length>120)st.feed.splice(0,st.feed.length-120);}
function isHost(st,a){return st.local||a.by===st.host;}

function createState(a){
  const s=a.settings||{};
  const rv=+a.rv||1;
  return{v:1,rv,code:String(a.code||''),seed:String(a.seed||'x'),host:a.by,local:!!a.local,phase:'lobby',
    settings:normSettings(s,rv),
    players:[],clubs:{},league:[],nextId:1,season:1,md:0,schedule:[],cupMds:[],table:{},cup:null,draft:null,
    market:[],staffPool:[],ready:{},last:null,feed:[],history:[],final:null,offFirst:false};
}

function normSettings(s,rv){
  let n=Number(s.seasons);
  const seasons=rv>=2?(n===0?0:clamp(Number.isFinite(n)&&n>0?n:3,1,20)):clamp(+s.seasons||3,1,6);
  const o={seasons,double:!!s.double,draft:s.draft==='auto'?'auto':'manual'};
  if(rv>=2)o.diff=DIFF[s.diff]?s.diff:'normal';
  if(rv>=8)o.cond=s.cond===true||s.cond==='true';
  return o;
}
function newHumanClub(p){
  return{id:p.pid,human:true,name:p.club,manager:p.name,color:p.color,cash:15,debt:0,fame:0,fans:20000,moral:3,
    squad:[],staff:[],up:{training:1,scouting:1,stadium:1,youth:1},form:'4-4-2',tac:'bal',pending:null,
    report:null,devReport:null,trophies:[]};
}

// ---------- Draft ----------
function drafterAt(st,p){const d=st.draft,n=d.order.length;const rd=Math.floor(p/n),i=p%n;if(d.board)return d.order[(rd+i)%n];return d.order[rd%2?n-1-i:i];}
function drafter(st){return drafterAt(st,st.draft.pick);}
const BOARD=10;
function boardPlayer(st,r,pos){if(!pos)pos=r.wpick([{v:'G',w:2},{v:'D',w:5},{v:'M',w:5},{v:'A',w:3}]).v;const p=genPlayer(st,r,pos,64,8,18,33);if(st.rv>=9)applyLeg(st,r,p);return p;}
function fillBoard(st){
  const d=st.draft;const r=RNG(st.seed,'board'+d.pick);
  while(d.board.length<BOARD)d.board.push(boardPlayer(st,r));
  const c=st.clubs[drafter(st)];
  if(c&&c.human&&!d.board.some(p=>canTake(c,p.pos))){const need=['G','D','M','A'].filter(p=>canTake(c,p));if(need.length)d.board.push(boardPlayer(st,r,r.pick(need)));}
}
function npcDraft(st){
  while(st.draft&&st.draft.board&&st.draft.pick<st.draft.total){
    const c=st.clubs[drafter(st)];if(c.human)break;
    const r=RNG(st.seed,'npcpick'+st.draft.pick);
    const top=st.draft.board.slice().sort((a,b)=>b.rat-a.rat||(a.id<b.id?-1:1)).slice(0,3);
    takeDraft(st,c,r.f()<0.6?top[0]:r.pick(top));
  }
}
function canTake(c,pos){return c.squad.filter(p=>p.pos===pos).length<QUOTA[pos];}
function autoPick(st){
  const c=st.clubs[drafter(st)];
  const cand=(st.draft.board||st.draft.pool).filter(p=>canTake(c,p.pos)).sort((a,b)=>b.rat-a.rat||(a.id<b.id?-1:1));
  takeDraft(st,c,cand[0]);
}
function takeDraft(st,c,p){
  const d=st.draft;
  if(d.board){
    d.board=d.board.filter(x=>x.id!==p.id);if(c.human)c.squad.push(p);
    d.log.push({c:c.id,n:p.name,pos:p.pos,rat:p.rat});if(d.log.length>12)d.log.shift();
    d.pick++;
    if(d.pick>=d.total){finishDraft(st);return;}
    fillBoard(st);npcDraft(st);return;
  }
  st.draft.pool=st.draft.pool.filter(x=>x.id!==p.id);c.squad.push(p);st.draft.pick++;
  if(st.draft.pick>=st.draft.total)finishDraft(st);
}
function finishDraft(st){
  const r=RNG(st.seed,'afterdraft');
  const left=(st.draft.board||st.draft.pool).map(p=>{p.tier=tierOf(r,p);return p;});
  st.market=left.concat(genMarket(st,r,8));
  st.staffPool=genStaff(st,r,6);
  st.draft=null;
  setupSeason(st);
  st.phase='offseason';st.offFirst=true;st.ready={};
  if(feat(st)){ensureAll(st);makeOffers(st);}
  for(const pid of humans(st)){st.clubs[pid].buys=0;if(st.rv>=3)st.clubs[pid].hires=0;}
  feed(st,'Der Draft ist beendet. Die Sommerpause beginnt – Transfermarkt geöffnet!');
}

// ---------- Saison ----------
function roundRobin(ids){
  const n=ids.length,arr=ids.slice(),rounds=[];
  for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];m.push((r+i)%2?[b,a]:[a,b]);}rounds.push(m);arr.splice(1,0,arr.pop());}
  return rounds;
}
function setupSeason(st){
  if(statsOn(st))st.ss={};
  const r=RNG(st.seed,'season'+st.season);
  const order=r.shuffle(st.league);
  let rr=roundRobin(order);
  if(st.settings.double)rr=rr.concat(rr.map(m=>m.map(([a,b])=>[b,a])));
  st.schedule=rr;st.md=0;
  const L=rr.length;st.cupMds=[Math.floor(L*0.25),Math.floor(L*0.55),L-1];
  st.table={};for(const id of st.league)st.table[id]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};
  const cupOrder=r.shuffle(st.league);
  st.cup={round:0,alive:cupOrder,log:[],winner:null,finalist:null};
}
function sortedTable(st){
  return st.league.map(id=>({id,...st.table[id]})).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||(a.id<b.id?-1:1));
}
const CUPN=['Viertelfinale','Halbfinale','Finale'];

function pickXI(c,form){
  const F=FORM[form]||FORM['4-4-2'];
  const E=p=>effRat(c,p);
  const avail=c.squad.filter(p=>!(p.inj>0)&&!(p.sus>0)&&!p.sent).sort((a,b)=>E(b)-E(a)||(a.id<b.id?-1:1));
  const used=new Set();
  const take=(pos,n)=>{const out=[];for(const p of avail){if(out.length>=n)break;if(p.pos===pos&&!used.has(p.id)){out.push({p,r:E(p)});used.add(p.id);}}return out;};
  let xi;
  if(c.lineup){
    xi={G:[],D:[],M:[],A:[]};const need={G:1,D:F[0],M:F[1],A:F[2]};
    for(const k of ['G','D','M','A'])for(const id of (c.lineup[k]||[])){
      if(xi[k].length>=need[k])break;const p=avail.find(q=>q.id===id);if(!p||used.has(p.id))continue;
      used.add(p.id);xi[k].push(p.pos===k?{p,r:E(p)}:{p,r:E(p)-(k==='G'||p.pos==='G'?25:12),oop:true});
    }
    for(const k of ['G','D','M','A'])xi[k]=xi[k].concat(take(k,need[k]-xi[k].length));
  }else xi={G:take('G',1),D:take('D',F[0]),M:take('M',F[1]),A:take('A',F[2])};
  for(const [k,n] of [['G',1],['D',F[0]],['M',F[1]],['A',F[2]]]){
    while(xi[k].length<n){
      const p=avail.find(q=>!used.has(q.id)&&(k==='G'||q.pos!=='G'));
      if(p){used.add(p.id);xi[k].push({p,r:E(p)-(k==='G'?25:12),oop:true});}
      else xi[k].push({p:null,r:35});
    }
  }
  return xi;
}
function teamRat(c,form,tac,oppTac,home){
  let A,M,D,xi=null;
  if(c.human){
    xi=pickXI(c,form);const F=FORM[form]||FORM['4-4-2'];
    const av=a=>a.reduce((s,x)=>s+x.r,0)/a.length;
    D=0.35*xi.G[0].r+0.65*av(xi.D)+(F[0]-4)*4;
    M=av(xi.M)+(F[1]-4)*4;
    A=0.75*av(xi.A)+0.25*av(xi.M)+(F[2]-2)*4;
    const m=(c.moral-3)*1.5;A+=m;M+=m;D+=m;
    if(has(c,'co')){A+=2;M+=2;D+=2;}
    if(c.prem){A+=c.prem;M+=c.prem;D+=c.prem;}
    if(has(c,'gk'))D+=2.5;if(has(c,'st'))A+=3;if(has(c,'def'))D+=3;if(has(c,'fit'))M+=2;
    for(const k of ['G','D','M','A'])for(const x of xi[k]){const t=x.p&&x.p.tr;if(!t)continue;if(t==='tor')A+=1;else if(t==='spm')M+=1;else if(t==='abw')D+=1.5;else if(t==='fue'){A+=0.7;M+=0.7;D+=0.7;}}
  }else{A=c.A;M=c.M;D=c.D;}
  if(home){A+=1.5;M+=1.5;D+=1.5;}
  if(tac==='off'){A+=5;D-=4;}
  else if(tac==='def'){A-=4;D+=5;}
  else if(tac==='konter'){M-=3;A+=(oppTac==='off'||oppTac==='press')?6:1;}
  else if(tac==='press'){M+=oppTac==='konter'?0:5;A+=1;D-=1;}
  return{A,M,D,xi};
}
function npcTac(r){return r.wpick([{v:'bal',w:3},{v:'off',w:2},{v:'def',w:2},{v:'konter',w:1},{v:'press',w:1}]).v;}
function scorer(c,R,r){
  if(!c.human)return r.pick(FIRST)[0]+'. '+r.pick(LAST);
  const pool=[];for(const [k,w] of [['A',6],['M',3],['D',1]])for(const x of R.xi[k])if(x.p)pool.push({v:x.p.name,w});
  return pool.length?r.wpick(pool).v:'Eigentor';
}
function statsOn(st){return st.rv>=6||!!st.career;}
function penTaker(c,R){if(!c.human||!R.xi)return null;const all=[];for(const k of ['A','M','D'])for(const x of R.xi[k])if(x.p)all.push(x.p);const e=all.find(p=>p.tr==='elf');if(e)return e;const st=R.xi.A.filter(x=>x.p).map(x=>x.p).sort((a,b)=>b.rat-a.rat)[0];return st||all.sort((a,b)=>b.rat-a.rat)[0]||null;}
function goalStat(st,c,R,r){
  if(!st.ss)st.ss={};
  const bump=(key,n,cid,f)=>{const e=st.ss[key]||(st.ss[key]={n,c:cid,lg:c.lg||0,g:0,a:0});e[f]++;e.lg=c.lg||0;};
  if(c.human){
    const pool=[];for(const [k,w] of [['A',6],['M',3],['D',1]])for(const x of R.xi[k])if(x.p)pool.push({v:x.p,w:x.p.tr==='tor'?w*2.5:w});
    if(!pool.length)return{x:'Eigentor'};
    const p=r.wpick(pool).v;p.gs=(p.gs||0)+1;p.gc=(p.gc||0)+1;bump('p'+p.id,p.name,c.id,'g');
    let an=null;
    if(r.f()<0.7){const ap=[];for(const [k,w] of [['M',5],['A',3],['D',2]])for(const x of R.xi[k])if(x.p&&x.p!==p)ap.push({v:x.p,w:x.p.tr==='spm'?w*2.5:w});
      if(ap.length){const q=r.wpick(ap).v;q.as=(q.as||0)+1;q.ac=(q.ac||0)+1;bump('p'+q.id,q.name,c.id,'a');an=q.name;}}
    return{x:p.name,as:an};
  }
  if(!c.sc){c.sc=[];for(let i=0;i<8;i++)c.sc.push({v:r.pick(FIRST)[0]+'. '+r.pick(LAST),w:[6,5,4,3,2,2,1,1][i]});}
  const sn=r.wpick(c.sc).v;bump(c.id+'|'+sn,sn,c.id,'g');
  let an=null;if(r.f()<0.7){const o=c.sc.filter(x=>x.v!==sn);if(o.length){an=r.wpick(o).v;bump(c.id+'|'+an,an,c.id,'a');}}
  return{x:sn,as:an};
}
function topScorer(st,filt){const l=Object.values(st.ss||{}).filter(e=>!filt||filt(e)).sort((a,b)=>b.g-a.g||b.a-a.a);return l[0]&&l[0].g>0?{n:l[0].n,c:l[0].c,g:l[0].g}:null;}
function feat(st){return !!st.career||st.rv>=7;}
function redPen(n){return n*3;}
function rateCtx(st,ctx){
  const h=st.clubs[ctx.h],a=st.clubs[ctx.a];
  const RH=teamRat(h,h.form,ctx.th,ctx.ta,true),RA=teamRat(a,a.form,ctx.ta,ctx.th,false);
  if(ctx.red){for(const [R,n] of [[RH,ctx.red.h],[RA,ctx.red.a]])if(n){const d=redPen(n);R.A-=d;R.M-=d;R.D-=d;}}
  ctx.RH=RH;ctx.RA=RA;
}
function mStart(st,hId,aId,r){
  const h=st.clubs[hId],a=st.clubs[aId];
  const th=h.human?h.tac:npcTac(r),ta=a.human?a.tac:npcTac(r);
  const ctx={h:hId,a:aId,th,ta,gh:0,ga:0,ev:[],s:0};
  if(feat(st))ctx.red={h:0,a:0};
  return ctx;
}
function halftimeSwitch(st,ctx,r){
  for(const side of ['h','a']){
    const c=st.clubs[ctx[side]];const mine=side==='h'?ctx.gh:ctx.ga,oth=side==='h'?ctx.ga:ctx.gh;
    if(mine>=oth)continue;
    let nt=null;
    if(c.human){if(c.planB&&TAC[c.planB])nt=c.planB;}
    else if(r.f()<0.6)nt='off';
    if(nt&&nt!==ctx['t'+side]){ctx['t'+side]=nt;ctx.ev.push({m:46,t:'t',s:side,x:TAC[nt].n});if(c.human)c.tac=nt;}
  }
}
function mRun(st,ctx,r,to,o){
  const h=st.clubs[ctx.h],a=st.clubs[ctx.a];
  const F=feat(st);
  rateCtx(st,ctx);
  for(let s=ctx.s;s<to;s++){
    if(F&&s===6&&o&&o.planB){halftimeSwitch(st,ctx,r);rateCtx(st,ctx);}
    const RH=ctx.RH,RA=ctx.RA;
    const d=RH.M-RA.M;const p=0.5+d/(2*(Math.abs(d)+14));
    const home=r.f()<p;const att=home?RH:RA,def=home?RA:RH;

function mFinish(st,ctx,r,o){

function applySus(st,ids){for(const pid of humans(st))for(const p of st.clubs[pid].squad){if(p.sus>0)p.sus--;if(ids.includes(p.id))p.sus=1;}}
function resolveMatchday(st){
  const r=RNG(st.seed,`md-${st.season}-${st.md}`);
  const results=[];const inj=[];const sus=[];
  const xiPre={};for(const pid of humans(st)){const c=st.clubs[pid];if(c.cond)xiPre[pid]=xiIds(c);}
  for(const [h,a] of st.schedule[st.md])results.push(playMatch(st,h,a,r,{cup:false,inj,sus}));
  const ci=st.cupMds.indexOf(st.md);
  if(ci>=0&&st.cup&&!st.cup.winner){
    const al=st.cup.alive,win=[],ms=[];
    for(let i=0;i<al.length;i+=2){const m=playMatch(st,al[i],al[i+1],r,{cup:true,cupName:CUPN[ci],inj,sus});ms.push(m);results.push(m);win.push(m.w);}
    st.cup.log.push({round:CUPN[ci],ms:ms.map(m=>({h:m.h,a:m.a,gh:m.gh,ga:m.ga,pens:m.pens,w:m.w}))});
    st.cup.alive=win;st.cup.round++;
    if(win.length===1){st.cup.winner=win[0];const f=ms[0];st.cup.finalist=f.w===f.h?f.a:f.h;feed(st,`🏆 ${st.clubs[win[0]].name} gewinnt den Pokal!`);
      const wc=st.clubs[win[0]];if(wc.human){money(wc,2);wc.fans+=3000;}}
  }
  for(const pid of humans(st))for(const p of st.clubs[pid].squad)if(p.inj>0)p.inj--;
  for(const [p,n] of inj)p.inj=Math.max(p.inj||0,n);
  if(feat(st))applySus(st,sus);
  for(const pid in xiPre)condUpdate(st.clubs[pid],xiPre[pid],new Set());
  const cards={};
  for(const pid of humans(st)){
    const c=st.clubs[pid];const card=r.wpick(CARDS);
    const data=card.prep?card.prep(c,r,st):{};
    if(card.prep&&!data){cards[pid]={t:'Ruhige Woche',x:'Keine Schlagzeilen.',g:1};continue;}
    const x=card.run(c,r,st,data);
    cards[pid]={t:card.t,x,g:card.g};
    if(card.opts){c.pending={k:card.k,t:card.t,x,opts:card.opts,data};cards[pid].choice=true;}

function endSeason(st){
  const tbl=sortedTable(st);
  const champ=tbl[0].id;
  feed(st,`🥇 ${st.clubs[champ].name} ist Meister der Saison ${st.season}!`);
  st.history.push({season:st.season,champ,cup:st.cup.winner,order:tbl.map(t=>t.id),top:statsOn(st)?topScorer(st):undefined});
  for(const pid of humans(st)){
    const c=st.clubs[pid];const place=tbl.findIndex(t=>t.id===pid)+1;
    if(c.pending){c.pending=null;}
    const fame=[[`Platz ${place} in der Liga`,PLACE_FAME[place-1]||0]];
    if(st.cup.winner===pid)fame.push(['Pokalsieg',5]);else if(st.cup.finalist===pid)fame.push(['Pokalfinale',2]);
    if(c.up.stadium>1)fame.push(['Stadion-Prestige',c.up.stadium-1]);
    if(place===1){c.trophies.push('Meister '+st.season);c.fans+=5000;}
    if(st.cup.winner===pid)c.trophies.push('Pokal '+st.season);
    let fsum=0;for(const f of fame)fsum+=f[1];c.fame+=fsum;
    const sal=r2(c.squad.reduce((s,p)=>s+salary(p),0));
    const ssal=r2(c.staff.reduce((s,x)=>s+x.sal,0));
    const fin=[['TV-Geld',r2(9-(place-1)*5/7)],['Sponsoring',r2(3+0.15*c.fame)]];
    if(has(c,'mkt'))fin.push(['Marketingchef',st.rv>=3?3:1.5]);
    fin.push(['Gehälter Spieler',-sal]);if(ssal)fin.push(['Gehälter Staff',-ssal]);
    if(st.rv>=2&&CATCHUP[place-1])fin.push(['Ausgleichsbonus',CATCHUP[place-1]]);
    if(c.debt>0)fin.push(['Kreditzinsen (10 %)',-r2(c.debt*0.1)]);
    for(const f of fin)money(c,f[1]);
    let emer=0;while(c.cash<0&&c.debt<60){money(c,5);c.debt+=5;emer++;}
    if(emer){fin.push(['Notkredit',emer*5]);c.fame-=emer;fame.push(['Notkredit (Imageschaden)',-emer]);}
    c.report={season:st.season,place,fin,fame};
  }
  st.cl=null;
  if(st.rv>=2){
    const ent={};
    for(const pid of humans(st)){const c=st.clubs[pid];if(!clEligible(c))continue;
      const r=RNG(st.seed,`cl-${st.season}-${pid}`);const nat=r.chance(0.4);
      const base=(nat?r.int(77,82):r.int(75,81))+Math.round(doff(st)/2);const id='cl'+st.season+pid;
      st.clubs[id]={id,human:false,cl:true,name:nat?r.pick(CL_NATIONS):r.pick(CL_CLUBS),color:'#c9a227',A:base+r.int(-2,2),M:base+r.int(-2,2),D:base+r.int(-2,2)};
      ent[pid]=id;feed(st,`⭐ ${c.name} hat sich für die Champions League qualifiziert – Gegner: ${st.clubs[id].name}!`);}
    if(Object.keys(ent).length)st.cl={season:st.season,ent};
  }
  st.phase='seasonEnd';st.ready={};
}
function resolveCL(st){
  if(!st.cl)return [];
  const r=RNG(st.seed,'clplay'+st.season);const results=[],winners=[];
  for(const pid of humans(st)){const oid=st.cl.ent[pid];if(!oid)continue;
    const m=playMatch(st,pid,oid,r,{cup:true,cupName:'Champions League',inj:[]});results.push(m);

    else{const old=c.fame;c.fame=Math.floor(c.fame/2);feed(st,`${c.name} verliert das CL-Finale gegen ${st.clubs[oid].name} – die Sterne halbieren sich (${old} → ${c.fame}).`);}
  }

function devHuman(st,c,r){
const dev=[],gone=[];
    const loans=c.squad.filter(p=>p.loan);for(const p of loans)gone.push(`${p.name} (Leihende)`);
    c.squad=c.squad.filter(p=>!p.loan);
    const keep=[];
    for(const p of c.squad){
      if(feat(st)){p.sus=0;if(p.ct!=null){p.ct--;if(p.ct<=0){gone.push(`${p.name} (Vertrag ausgelaufen)`);p.free=true;p.ct=null;p.inj=0;(st.freeAg=st.freeAg||[]).push(p);continue;}}}
      p.age++;p.inj=0;
      if(p.age>=34&&(p.age>=36||r.chance(0.5))){gone.push(`${p.name} (Karriereende mit ${p.age})`);continue;}
      let d=p.age<=21?r.int(1,4):p.age<=24?r.int(0,3):p.age<=28?r.int(-1,2):p.age<=31?r.int(-2,1):r.int(-4,0);

      if(statsOn(st)){p.gs=0;p.as=0;}
      let eb=0;if(st.rv>=5){const share=(p.apps||0)/Math.max(1,st.schedule.length);if(p.age<=24)eb=share>=0.7?2:share>=0.4?1:0;d+=eb;p.apps=0;}
      const before=p.rat;let nr=p.rat+d;if(d>0)nr=Math.min(nr,Math.max(p.pot,p.rat));nr=clamp(nr,35,95);
      p.rat=nr;if(p.pot<p.rat)p.pot=p.rat;
      if(nr!==before)dev.push({n:p.name,a:before,b:nr,age:p.age,eb});
      keep.push(p);
    }

    const youth=[];
    if(!st.career&&c.squad.length<SQUAD_MAX){const y=genYouth(st,r,c);c.squad.push(y);youth.push(`${y.name} (${POSL[y.pos]}, ${y.rat})`);}

function nextSeason(st){
  st.season++;

  for(const pid of humans(st))devHuman(st,st.clubs[pid],r);
  for(const id of st.league){const c=st.clubs[id];if(c.human)continue;
    if(st.rv>=2){{const o=doff(st);for(const k of ['A','M','D'])c[k]=clamp(c[k]+r.int(-2,2)+(c[k]<66+o?1:c[k]>72+o?-1:0),58+o,80+o);}}
    else{c.A=clamp(c.A+r.int(-1,3),55,84);c.M=clamp(c.M+r.int(-1,3),55,84);c.D=clamp(c.D+r.int(-1,3),55,84);}}
  st.cl=null;
  st.market=genMarket(st,r,18);
  if(feat(st)){if(st.freeAg){for(const p of st.freeAg){p.tier=1;st.market.push(p);}st.freeAg=null;}ensureAll(st);makeOffers(st);}
  st.staffPool=genStaff(st,r,6);
  setupSeason(st);

  feed(st,`Sommerpause vor Saison ${st.season}: neuer Transfermarkt, neue Trainer auf Jobsuche.`);
}

function finishGame(st,win){
  win=win||[];st.clWinner=win.length?win:null;
  const ps=humans(st).slice().sort((a,b)=>{if(win.includes(a)!==win.includes(b))return win.includes(a)?-1:1;const A=st.clubs[a],B=st.clubs[b];return B.fame-A.fame||B.trophies.length-A.trophies.length||B.cash-A.cash||(a<b?-1:1);});
  st.final=ps;st.phase='over';st.ready={};
  feed(st,`Spielende! ${st.clubs[ps[0]].manager} macht ${st.clubs[ps[0]].name} zum Klub der Legenden.`);
}

function checkAdvance(st){
  const hs=humans(st);if(!hs.length||!hs.every(p=>st.ready[p]))return;
  if(st.phase==='offseason'){if(feat(st))for(const pid of hs){st.clubs[pid].offers=[];st.clubs[pid].bid=null;}st.phase='matchday';st.ready={};st.offFirst=false;feed(st,`Anpfiff zur Saison ${st.season}!`);}
  else if(st.phase==='matchday')resolveMatchday(st);
  else if(st.phase==='seasonEnd'){
    if(st.rv>=2){const w=resolveCL(st);if(w.length)finishGame(st,w);else if(!seasonsLeft(st))finishGame(st);else nextSeason(st);}
    else{if(st.season>=st.settings.seasons)finishGame(st);else nextSeason(st);}
  }
}

  let emer=0;const ls=LOANS[t];while(me.cash<0&&emer<20){money(me,ls);me.debt=r2(me.debt+ls);emer++;}
  if(emer)fin.push(['Notkredit',r2(emer*ls)]);
  me.report={season:st.season,place,lg:t,status,fin,board:bres,fired:!!st.fired};
  const tops={};for(let L=1;L<=4;L++)tops[L]=topScorer(st,e=>e.lg===L);
  st.history.push({season:st.season,lg:t,place,status,champs:Object.assign({},champs),kreis:st.cups.kreis.winner,land:st.cups.land&&st.cups.land.winner,tops});
  st.pendingMoves=newOrder;
  feed(st,`Saison ${st.season} beendet: ${me.name} wird ${place}. in der ${LNAME[t]} – ${status}!`);
  for(let L=1;L<=4;L++)feed(st,`🥇 ${st.clubs[champs[L]].name} ist Meister der ${LNAME[L]}.`);
  st.cl=null;
  if(t===1&&place===1){const nat=r.chance(0.4);const base=nat?r.int(78,84):r.int(77,83);const id='clX'+st.season;
    st.clubs[id]={id,human:false,cl:true,name:nat?r.pick(CL_NATIONS):r.pick(CL_CLUBS),color:'#c9a227',A:base+r.int(-2,2),M:base+r.int(-2,2),D:base+r.int(-2,2)};

  st.phase='seasonEnd';st.ready={};
}

    else feed(st,`${me.name} verliert das CL-Finale gegen ${st.clubs[oid].name}.`);}

  for(const x of me.staff){x.ct=(x.ct==null?1:x.ct)-1;if(x.ct<=0){x.ct=0;x.exp=true;const f=STAFFF[me.lg];x.newSal=r2(1.6*f);x.bonus=r2(f);feed(st,`📝 Vertrag von ${x.name} (${STAFF[x.type].n}) ist ausgelaufen – im Büro › Staff verlängern oder gehen lassen.`,'me');}}

function logWrap(fn){return (st,a)=>{const c=st.clubs.me;const before=new Map(c.squad.map(p=>[p.id,p]));const cash0=c.cash;fn(st,a);const now=new Set(c.squad.map(p=>p.id));
  for(const p of c.squad)if(!before.has(p.id)&&!p.loan)tlogAdd(st,p,p.from||(p.free?'vereinslos':'Transfermarkt'),c.name,r2(cash0-c.cash));
  for(const [id,p] of before)if(!now.has(id))tlogAdd(st,p,c.name,'Transfermarkt',r2(c.cash-cash0));};}
function winterBlock(fn,msg){return (st,a)=>{if(st.winter)rej(msg);return fn(st,a);};}
const CH={
  BUY:logWrap((st,a)=>H.BUY(st,a)), SELL:logWrap((st,a)=>{if(st.winter&&(st.clubs.me.buys||0)>=buyMax(st))rej('Keine Wintertransfers mehr übrig.');H.SELL(st,a);if(st.winter)st.clubs.me.buys=(st.clubs.me.buys||0)+1;}), HIRE:winterBlock((st,a)=>H.HIRE(st,a),'Staff gibt es nur in der Sommerpause.'), FIRE:(st,a)=>H.FIRE(st,a),
  CAMP_SIGN(st,a){const c=st.clubs.me;if(!c.camp)rej('Kein Camp offen.');const p=c.camp.kids.find(x=>x.id===a.player);if(!p)rej('Unbekannt.');if(!c.nlz)c.nlz=[];if(c.nlz.length>=nlzSlots(c)+2)rej('Das NLZ ist voll.');c.camp.kids=c.camp.kids.filter(x=>x!==p);ensureP(st,p);c.nlz.push(p);if(!c.camp.kids.length)c.camp=null;feed(st,`${p.name} kommt ins NLZ.`,'me');}, BID_OK:logWrap((st,a)=>H.BID_OK(st,a)), BID_NO:(st,a)=>H.BID_NO(st,a), OFFER_OK:logWrap((st,a)=>{if(st.winter&&(st.clubs.me.buys||0)>=buyMax(st))rej('Keine Wintertransfers mehr übrig.');H.OFFER_OK(st,a);if(st.winter)st.clubs.me.buys=(st.clubs.me.buys||0)+1;}), OFFER_NO:(st,a)=>H.OFFER_NO(st,a), EXTEND:(st,a)=>H.EXTEND(st,a), CAMP_SKIP:(st,a)=>H.CAMP_SKIP(st,a), UNREADY(){},
  UPGRADE(st,a){needPhase(st,'offseason');if(st.winter)rej('Ausbauen geht nur in der Sommerpause.');const c=st.clubs.me;if(!UPS[a.kind])rej('Unbekannt.');const l=c.up[a.kind];if(l>=5)rej('Maximale Stufe.');
    const cost=(a.kind==='stadium'?CUPCOST:CUPCOST2)[l];if(c.cash<cost)rej('Nicht genug Geld.');money(c,-cost);c.up[a.kind]=l+1;feed(st,`${c.name} baut ${UPS[a.kind].n} auf Stufe ${l+1} aus.`,c.id);},
  LOAN(st,a){const c=st.clubs.me;const s=LOANS[c.lg];if(c.debt+s>s*6+0.001)rej(`Die Bank gibt höchstens ${fm(s*6)}.`);c.debt=r2(c.debt+s);money(c,s);},
  REPAY(st,a){const c=st.clubs.me;const s=Math.min(c.debt,LOANS[c.lg]);if(s<=0)rej('Keine Schulden.');if(c.cash<s)rej('Nicht genug Geld.');c.debt=r2(c.debt-s);money(c,-s);},
  CAMP(st,a){if(!['matchday','offseason'].includes(st.phase))rej('Gerade nicht möglich.');const c=st.clubs.me;if(c.campSeason===st.season)rej('Diese Saison gab es schon ein Camp.');const big=a.size===2;const fp=['G','D','M','A'].includes(a.pos)?a.pos:null;const cost=r2(CAMPC[c.lg]*(big?2:1)*(fp?1.25:1));if(c.cash<cost)rej('Nicht genug Geld.');
    const r=CR(st);const kids=[];
    for(let i=0;i<(big?4:2);i++){const pos=fp||r.wpick([{v:'G',w:1},{v:'D',w:3},{v:'M',w:3},{v:'A',w:3}]).v;let rat=r.int(34,58)+Math.round((TMEAN[c.lg]-50)*0.6);if(r.chance(0.18))rat+=r.int(10,24);rat=clamp(rat,34,84);kids.push({id:newId(st),name:pname(r),pos,age:r.int(16,19),rat,pot:Math.min(94,rat+r.int(0,26)),inj:0});}
    money(c,-cost);c.campSeason=st.season;c.camp={kids};feed(st,`${c.name} veranstaltet ein Sichtungscamp.`,c.id);},
  CHOOSE(st,a){const c=st.clubs.me;const pd=c.pending;if(!pd)rej('Keine offene Entscheidung.');const card=CCARDS.find(x=>x.k===pd.k);c.pending=null;c.lastChoice={t:pd.t,x:card.choose(c,a.opt===0?0:1,st,pd.data)};},
  SPONSOR(st,a){needPhase(st,'offseason');if(st.winter)rej('Sponsoren gibt es nur in der Sommerpause.');const o=st.spOffers.find(x=>x.id===a.offer);if(!o)rej('?');if(st.clubs.me.spon)rej('Du hast schon einen Sponsor.');st.clubs.me.spon=Object.assign({},o,{paid:true});money(st.clubs.me,o.amount);st.clubs.me.sponWin=0;feed(st,`${st.clubs.me.name} unterschreibt bei ${o.n}.`,'me');},
  STAFF_EXT(st,a){needPhase(st,'offseason');const c=st.clubs.me;const x=c.staff.find(y=>y.id===a.staff);if(!x||!x.exp)rej('Kein auslaufender Vertrag.');const yrs=a.yrs===3?3:2;
    if(c.cash<x.bonus)rej('Nicht genug Geld für das Handgeld.');money(c,-x.bonus);x.sal=x.newSal;x.ct=yrs;delete x.exp;delete x.newSal;delete x.bonus;feed(st,`${c.name} verlängert mit ${x.name} (${STAFF[x.type].n}) um ${yrs} Jahre.`,c.id);},
  STAFF_GO(st,a){needPhase(st,'offseason');const c=st.clubs.me;const x=c.staff.find(y=>y.id===a.staff);if(!x)rej('?');c.staff=c.staff.filter(y=>y!==x);feed(st,`${x.name} (${STAFF[x.type].n}) verlässt ${c.name}.`,c.id);},
  SO_KICK(st,a){soKick(st,a.zone);},
  NLZ_UP(st,a){if(st.phase==='halftime')rej('Nicht in der Halbzeit.');const c=st.clubs.me;const p=(c.nlz||[]).find(x=>x.id===a.player);if(!p)rej('?');if(c.squad.length>=SQUAD_MAX)rej('Kader voll (max. 22).');const fee=nlzFee(p);if(c.cash<fee)rej('Nicht genug Geld.');
    money(c,-fee);c.nlz=c.nlz.filter(x=>x!==p);p.ct=3;if(c.cond)p.fr=100;c.squad.push(p);if(c.poach&&c.poach.id===p.id)c.poach=null;feed(st,`🎓 ${p.name} (${POSL[p.pos]}, ${p.rat}) wird aus dem NLZ zu den Profis hochgezogen.`,'me');},
  POACH_LET(st,a){const c=st.clubs.me;if(!c.poach)rej('?');const p=(c.nlz||[]).find(x=>x.id===c.poach.id);if(p){c.nlz=c.nlz.filter(x=>x!==p);money(c,c.poach.comp);feed(st,`${p.name} wechselt zu ${c.poach.club} – Entschädigung ${fm(c.poach.comp)}.`,'me');}c.poach=null;},
  STYLE(st,a){applyStyle(st.clubs.me,a);},
  PREM(st,a){st.clubs.me.prem=clamp(a.v|0,0,2);},
  SCOUT_BID(st,a){const pr=st.prep;const c=st.clubs.me;if(!pr||!pr.find||pr.find.done)rej('Kein Scout-Tipp offen.');const f=pr.find;const pct=clamp(+a.pct||1,0.7,1.5);const fee=r2(f.value*pct);
    if(c.cash<fee)rej('Nicht genug Geld.');f.done=true;f.pct=pct;const ok=CR(st).chance(clamp((pct-0.7)/0.8,0.05,0.95));f.ok=ok;
    if(ok){money(c,-fee);(c.deals||(c.deals=[])).push({p:f.p,fee,from:f.from,lg:f.lg});feed(st,`🤝 Einigung! ${f.p.name} wechselt zur ${st.md<9?'Winterpause':'neuen Saison'} für ${fm(fee)} von ${f.from} zu ${c.name}.`,'me');}
    else feed(st,`❌ ${f.from} lehnt das Angebot für ${f.p.name} ab.`,'me');},
  LOAN_IN(st,a){needPhase(st,'offseason');const c=st.clubs.me;const i=(st.loanList||[]).findIndex(x=>x.p.id===a.player);if(i<0)rej('Nicht mehr verfügbar.');const L=st.loanList[i];
    if((c.buys||0)>=buyMax(st))rej('Transferlimit erreicht.');if(c.squad.length>=SQUAD_MAX)rej('Kader voll.');if(c.cash<L.fee)rej('Nicht genug Geld.');
    money(c,-L.fee);st.loanList.splice(i,1);const p=L.p;p.loan=true;p.inj=0;c.squad.push(p);c.buys=(c.buys||0)+1;tlogAdd(st,p,L.from,c.name,L.fee,true);feed(st,`${c.name} leiht ${p.name} von ${L.from} aus.`,'me');},
  LOAN_OUT(st,a){needPhase(st,'offseason');const c=st.clubs.me;const p=c.squad.find(x=>x.id===a.player);if(!p)rej('?');if(p.loan)rej('Leihspieler kannst du nicht weiterverleihen.');
    if(c.squad.length<=SQUAD_MIN)rej('Mindestens 12 Spieler im Kader.');if(p.pos==='G'&&c.squad.filter(x=>x.pos==='G').length<2)rej('Du brauchst einen Torwart.');
    const r=CR(st);const to=st.clubs[r.pick(npcNames(st,c))].name;c.squad=c.squad.filter(x=>x!==p);(c.lent||(c.lent=[])).push({p,to});tlogAdd(st,p,c.name,to,0,true);feed(st,`${p.name} wird bis Saisonende an ${to} verliehen.`,'me');},
  TRAIN(st,a){needPhase(st,'matchday');const c=st.clubs.me;const p=c.squad.find(x=>x.id===a.player);if(!p)rej('?');if(p.loan)rej('Leihspieler trainieren nicht bei dir.');
    const slots=c.up.training||1;if(!c.trn||c.trn.md!==st.md||c.trn.s!==st.season)c.trn={md:st.md,s:st.season,n:0,ids:[]};
    if(c.trn.n>=slots)rej('Alle Trainingsplätze sind belegt.');if(c.trn.ids.includes(p.id))rej('Hat heute schon trainiert.');
    if(c.cond){if(p.fr==null)p.fr=100;if(p.fr<20)rej('Zu müde zum Trainieren (unter 20 %).');p.fr=Math.max(0,p.fr-5);}
    c.trn.n++;c.trn.ids.push(p.id);const ok=CR(st).chance(trainChance(p));
    if(ok){if(p.rat>=p.pot){p.rat=Math.min(99,p.rat+1);p.pot=Math.min(99,p.pot+1);c.lastTrain={id:p.id,ok:1,t:`${p.name}: Stärke ${p.rat} · Potenzial ${p.pot} (beide +1)`};}else{p.pot=Math.min(99,p.pot+1);c.lastTrain={id:p.id,ok:1,t:`${p.name}: Potenzial ${p.pot-1} → ${p.pot}`};}}
    else c.lastTrain={id:p.id,ok:0,t:`${p.name}: kein Fortschritt`};},
  COND(st,a){const c=st.clubs.me;c.cond=!!a.on;for(const p of c.squad){if(c.cond){if(p.fr==null)p.fr=100;}else delete p.fr;}},
  READY(st,a){const c=st.clubs.me;
    if(st.phase==='offseason'&&st.winter){if(c.cash<0)rej('Kontostand negativ – verkaufe Spieler oder nimm einen Kredit auf.');st.winter=false;c.offers=[];c.bid=null;st.phase='matchday';feed(st,`Die Rückrunde beginnt!`);return;}
    if(st.phase==='offseason'){const gone=c.staff.filter(x=>x.exp);for(const x of gone)feed(st,`${x.name} (${STAFF[x.type].n}) verlässt ${c.name} – Vertrag ausgelaufen.`,c.id);c.staff=c.staff.filter(x=>!x.exp);if(!c.spon)rej('Wähle zuerst einen Sponsor (Büro).');if(c.cash<0)rej('Kontostand negativ – verkaufe Spieler oder nimm einen Kredit auf.');c.offers=[];c.bid=null;st.phase='matchday';st.offFirst=false;feed(st,`Anpfiff zur Saison ${st.season}!`);return;}
    if(st.phase==='matchday'){if(st.so)rej('Erst das Elfmeterschießen spielen.');if(c.pending)rej('Triff erst deine offene Entscheidung.');if(a.form&&FORM[a.form])c.form=a.form;if(a.tac&&TAC[a.tac])c.tac=a.tac;setLineup(c,a.lineup);careerKickoff(st);return;}
    if(st.phase==='halftime'){const old=c.lineup,of=c.form;if(a.form&&FORM[a.form])c.form=a.form;setLineup(c,a.lineup);

      if(a.tac&&TAC[a.tac])c.tac=a.tac;careerSecondHalf(st);return;}
    if(st.phase==='seasonEnd'){if(st.cl&&!st.cl.done){if(a.form&&FORM[a.form])c.form=a.form;if(a.tac&&TAC[a.tac])c.tac=a.tac;setLineup(c,a.lineup);}careerNext(st);}
  }
};

<script>
// ================= KLUBCHEF UI =================
const ui={view:'start',tab:null,sub:null,pos:'all',confirm:null,seat:null,loadMsg:'',jColor:COLORS[0],form:null,tac:null,openList:null,tickerShown:null};
const NET={mode:null,code:null,raw:[],unsub:null,db:null,user:null,pid:null,canWrite:null,lastMeta:'',timer:null,ready:false};
let ST=null,applied=[];const mySent=new Set();
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
function rnd(n,alpha){const a=new Uint32Array(n);crypto.getRandomValues(a);let s='';for(const x of a)s+=alpha[x%alpha.length];return s;}
const rid=n=>rnd(n,'abcdefghijkmnpqrstuvwxyz23456789');
const genCode=()=>rnd(5,'ABCDEFGHJKLMNPQRSTUVWXYZ23456789');
function me(){return NET.mode==='local'?ui.seat:NET.mode==='career'?'me':NET.pid;}
function myC(){if(!ST)return null;const c=ST.clubs[me()];return c&&c.human?c:null;}
function isHostMe(){return ST&&(ST.local||ST.host===me());}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fm(x){const a=Math.abs(x);if(a>0&&a<0.995){const k=Math.round(a*1000);return (x<0?'−':'')+(k>=10?Math.round(k/10)*10:k)+' Tsd.';}const v=Math.round(x*10)/10;return (v<0?'−':'')+Math.abs(v).toFixed(1).replace('.',',')+' Mio';}
function num(x){return Math.round(x).toLocaleString('de-DE');}
function ratCol(r){return r>=80?'var(--gold)':r>=72?'var(--acc)':r>=64?'var(--ink)':'var(--mut)';}
function val(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function toast(msg,ok){const t=document.createElement('div');t.className='toast'+(ok?' ok':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3400);}
function conf(key){if(ui.confirm===key){ui.confirm=null;return true;}ui.confirm=key;render();setTimeout(()=>{if(ui.confirm===key){ui.confirm=null;render();}},4000);return false;}
function cl(key,label,sure){return ui.confirm===key?(sure||'Sicher?'):label;}

// ---------- Netz ----------
async function send(type,p){
  p=p||{};
  let by=me();
  if(type==='CREATE')by=NET.mode==='local'?'L0':NET.pid;
  if(!by){toast('Wähle zuerst deinen Platz.');return;}
  const a=Object.assign({},p,{id:String(applied.length).padStart(5,'0')+'-'+rid(6),seq:applied.length,ts:Date.now(),by,type});
  if(NET.mode==='career'){
    try{const h=CH[type];if(h)h(ST,a);ensureAll(ST);careerEnsurePrep(ST);}catch(e){if(e instanceof Rej)toast(e.m);else{console.error(e);toast('Fehler: '+e.message);}}
    saveCareer();if(ui.lastPhase!==ST.phase){scrollTo(0,0);ui.tab=null;ui.sub=null;ui.confirm=null;}ui.lastPhase=ST.phase;render();checkTicker();return;
  }
  mySent.add(a.id);
  if(NET.mode==='local'){NET.raw.push(a);LS.set('kc:local',{raw:NET.raw});recompute();return;}
  try{await NET.db.collection(`g/${NET.code}/a`).doc(a.id).set(a);writeMeta();}
  catch(e){mySent.delete(a.id);const c=e&&e.code;
    toast(c==='permission-denied'?'Die Datenbank lehnt den Zug ab (Sicherheitsregeln prüfen).':c==='invalid_argument'?'Keine Schreibrechte – der Besitzer muss dich als Bearbeiter einladen.':c==='quota_exceeded'?'Der Speicher ist voll.':'Senden fehlgeschlagen – bitte nochmal versuchen.');}
}
function recompute(){
  const acts=NET.raw.slice().sort((x,y)=>(x.seq-y.seq)||(x.ts-y.ts)||(x.id<y.id?-1:x.id>y.id?1:0));
  let ok=applied.length<=acts.length;
  if(ok)for(let i=0;i<applied.length;i++)if(acts[i].id!==applied[i]){ok=false;break;}
  if(!ok){ST=null;applied=[];}
  for(let i=applied.length;i<acts.length;i++){
    const a=acts[i];
    try{ST=reduce(ST,a);}catch(e){if(e instanceof Rej){if(mySent.has(a.id))toast(e.m);}else console.error(e);}
    mySent.delete(a.id);applied.push(a.id);
  }
  if(ST){
    if(NET.mode==='local'&&!ST.players.some(p=>p.pid===ui.seat))ui.seat=ST.players[0]?ST.players[0].pid:null;
    if(NET.mode==='local'&&ST.phase==='draft')ui.seat=drafter(ST);
    if(ui.lastPhase&&ui.lastPhase!==ST.phase){scrollTo(0,0);ui.confirm=null;ui.tab=null;ui.sub=null;}
    ui.lastPhase=ST.phase;
    updateMine();
  }
  render();checkTicker();
}
async function writeMeta(){
  if(NET.mode!=='online'||!ST)return;
  const m={code:ST.code,phase:ST.phase,season:ST.season,seasons:ST.settings.seasons,clubs:ST.players.map(p=>p.club)};
  const k=JSON.stringify(m);if(k===NET.lastMeta)return;NET.lastMeta=k;
  try{await NET.db.doc('g/'+ST.code).set(Object.assign({},m,{updated:Date.now()}));}catch(e){}
}
function saveCareer(){if(ST&&ST.career)LS.set('kc:career',ST);}
function rememberGame(code){const l=LS.get('kc:mine',[]).filter(x=>x.code!==code);l.unshift({code,t:Date.now(),club:''});LS.set('kc:mine',l.slice(0,8));}
function updateMine(){if(NET.mode!=='online')return;const c=myC();if(!c)return;const l=LS.get('kc:mine',[]);const e=l.find(x=>x.code===ST.code);if(e&&e.club!==c.name){e.club=c.name;LS.set('kc:mine',l);}}
function cleanup(){ui.lastPhase=null;CAREER_VAL=false;if(NET.unsub){try{NET.unsub();}catch(e){}}NET.unsub=null;clearTimeout(NET.timer);ST=null;applied=[];NET.raw=[];NET.lastMeta='';ui.tab=null;ui.sub=null;ui.form=null;ui.tac=null;ui.lu=undefined;ui.loadMsg='';}
async function openGame(code,create){
  cleanup();NET.mode='online';NET.code=code;ui.view='game';
  const pids=LS.get('kc:pids',{});NET.pid=pids[code]||('m'+rid(8));pids[code]=NET.pid;LS.set('kc:pids',pids);
  rememberGame(code);render();
  NET.timer=setTimeout(()=>{if(!ST){ui.loadMsg=create?'Keine Verbindung zur Datenbank.':'Spiel nicht gefunden – stimmt der Code?';render();}},10000);
  NET.unsub=NET.db.collection(`g/${code}/a`).onSnapshot(snap=>{
    NET.raw=snap.docs.map(d=>d.data());
    if(!snap.metadata.fromCache)clearTimeout(NET.timer);
    recompute();
  },err=>{clearTimeout(NET.timer);ui.loadMsg='Verbindung unterbrochen ('+(err&&err.code||'?')+'). Öffne das Spiel bitte neu.';render();});
  if(create)await send('CREATE',{seed:rid(12),code,rv:11,settings:{seasons:0,double:false,draft:'manual',diff:'normal',cond:false}});
}
async function loadOpen(){
  if(!NET.db)return;
  try{const s=await NET.db.collection('g').orderBy('updated','desc').limit(15).get();ui.openList=s.docs.map(d=>d.data());}catch(e){ui.openList=[];}
  if(ui.view==='start')render();
}

function saveInputs(){const o={};document.querySelectorAll('#app input[id]').forEach(i=>o[i.id]=i.value);const f=document.activeElement;return{o,f:f&&f.id&&f.tagName==='INPUT'?f.id:null,s:f&&f.selectionStart};}
function restoreInputs(k){for(const id in k.o){const i=document.getElementById(id);if(i)i.value=k.o[id];}if(k.f){const i=document.getElementById(k.f);if(i){i.focus();try{i.setSelectionRange(k.s,k.s);}catch(e){}}}}
function render(){const app=document.getElementById('app');const k=saveInputs();app.innerHTML=ui.view==='start'?vStart():vGame();restoreInputs(k);}

function rulesCard(){return `<div class="card"><details><summary>So funktioniert's</summary><div class="small" style="margin-top:8px">
<p><b>Ziel:</b> Gewinne die <b>Champions League</b>. Dafür brauchst du am Saisonende 50 Sterne ★ oder 3 Meistertitel. Verlierst du das CL-Finale, halbieren sich deine Sterne.</p>
<p><b>1. Draft:</b> Alle 8 Vereine – auch die Computer – wählen reihum aus 10 ausliegenden Spielern, nach jedem Pick wird nachgelegt. Jede Runde beginnt ein anderer Klub. Du brauchst 15 Spieler: 2 Torhüter, 5 Abwehr, 5 Mittelfeld, 3 Sturm.</p>
<p><b>2. Sommerpause:</b> Bis zu 2 Spieler kaufen, beliebig verkaufen, bis zu 3 Mitarbeiter einstellen, Trainingszentrum, Scouting, Stadion und Jugendakademie ausbauen, notfalls Kredit aufnehmen. Wer fertig ist, tippt auf <i>Bereit</i>.</p>
<p><b>3. Spieltage:</b> Formation, Taktik und – wenn du willst – deine Startelf selbst wählen. Spieler bis 24 mit viel Einsatzzeit entwickeln sich schneller. Konter schlägt offensive und pressende Gegner, Pressing gewinnt das Mittelfeld, Defensiv mauert. Sind alle bereit, wird simuliert – mit Live-Ticker, Verletzungen und einer Ereigniskarte für jeden.</p>
<p><b>Verträge & Eigenschaften:</b> Spieler haben Verträge (📝 = läuft aus, sonst geht er ablösefrei) und manche besondere Eigenschaften wie 🎯 Torjäger oder 🩹 verletzungsanfällig. Andere Vereine kaufen mit, bieten mit und machen Angebote für deine Stars – dafür sind 5 Transfers pro Sommerpause erlaubt.</p><p><b>Spielereignisse:</b> Elfmeter, Rote Karten (Sperre fürs nächste Spiel) und Halbzeit: Im Karriere-Modus greifst du in der Pause selbst ein, online stellst du vorher einen Plan B ein.</p><p><b>Pokal:</b> Läuft nebenher mit Viertelfinale, Halbfinale und Finale.</p><p><b>Sichtungscamp:</b> Einmal pro Saison Talente (16–19) für 1–2 Mio sichten – mit etwas Glück ist ein Rohdiamant dabei.</p>
<p><b>Saisonende:</b> Ruhm für die Platzierung (10/7/5/4/3/2/1/0), Pokalsieg +5, Finale +2, Stadion-Prestige. Geld gibt es aus TV-Vertrag, Sponsoring und dem Ausgleichsbonus (Letzter 5 Mio … Meister 0), Gehälter und Zinsen gehen ab. Spieler altern, Talente wachsen, Veteranen hören auf.</p>
<p class="mut">Ein eigenständiges Spiel – Vereine und Spieler sind frei erfunden.</p></div></details></div>`;}

// ---------- Live-Ticker ----------
let TK=null;
function checkTicker(){
  if(!ST||!ST.last)return;const c=myC();if(!c)return;
  const tag=`${ST.code}:${me()}:${ST.last.season}-${ST.last.md}`;
  if(ui.tickerShown===tag)return;
  const seen=LS.get('kc:seen',{});const key=ST.code+':'+(ST.career?ST.seed+':':'')+me();
  ui.tickerShown=tag;
  if(seen[key]===`${ST.last.season}-${ST.last.md}`)return;
  seen[key]=`${ST.last.season}-${ST.last.md}`;LS.set('kc:seen',seen);
  showTicker(true);
}
function showTicker(auto){
  const c=myC();if(!c||!ST.last)return;
  const ms=ST.last.results.filter(m=>m.h===c.id||m.a===c.id);if(!ms.length)return;
  if(TK&&TK.iv)clearInterval(TK.iv);
  TK={ms,i:0,min:0,card:ST.last.cards[c.id],showCard:false,md:ST.last.md,auto:!!auto};
  document.getElementById('ov').style.display='flex';
  runTicker();
}
function runTicker(){clearInterval(TK.iv);const m0=TK.ms[TK.i];TK.min=TK.auto&&m0&&m0.ht?45:0;drawTicker();TK.iv=setInterval(()=>{TK.min++;if(TK.min>=90){TK.min=90;clearInterval(TK.iv);}drawTicker();},75);}
function drawTicker(){
  const box=document.getElementById('ovb');
  if(TK.showCard){const k=TK.card;box.innerHTML=`<div class="row"><span class="pill">Ereigniskarte</span><span class="sp"></span><button class="ic" data-ov="close">✕</button></div><div class="evc ${k.g?'':'bad'}" style="margin-top:12px;padding:18px"><div class="h" style="font-size:28px">🃏 ${esc(k.t)}</div><div>${esc(k.x)}</div>${k.choice?'<p class="small" style="margin-bottom:0"><b>Deine Entscheidung ist gefragt</b> – im Spieltag-Tab.</p>':''}</div><button class="btn pri block" data-ov="close">Weiter</button>`;return;}
  const m=TK.ms[TK.i];const H=ST.clubs[m.h],A=ST.clubs[m.a];
  const ev=m.ev.filter(e=>e.m<=TK.min);let gh=0,ga=0;for(const e of ev)if(e.t==='g'){if(e.s==='h')gh++;else ga++;}
  const done=TK.min>=90;
  const more=TK.i<TK.ms.length-1;
  box.innerHTML=`<div class="row"><span class="pill">${m.cup?'Pokal · '+esc(m.cup):'Liga · Spieltag '+(TK.md+1)}</span><span class="sp"></span><button class="ic" data-ov="close">✕</button></div>
  <div class="score"><div class="tm">${dot(H)}<br>${esc(H.name)}</div><div class="sc">${gh}:${ga}</div><div class="tm">${dot(A)}<br>${esc(A.name)}</div></div>
  <div class="row tiny mut"><span class="sp" style="text-align:center">${esc(TAC[m.th].n)}</span><span class="sp" style="text-align:center">${esc(TAC[m.ta].n)}</span></div>
  <div class="clock" style="margin-top:6px">${done?(m.pens?`Elfmeterschießen ${m.pens[0]}:${m.pens[1]}`:'Abpfiff'):TK.min+'′'}</div>
  <div style="margin-top:10px;min-height:120px">${ev.slice().reverse().map(e=>`<div class="tk ${e.s}"><span class="m">${e.m}′</span><span>${e.t==='g'?`⚽ <b>Tor!</b> ${esc(e.x)} <span class="mut">(${e.sc})</span>${e.as?`<br><span class="tiny mut">Vorlage: ${esc(e.as)}</span>`:''}`:e.t==='c'?`💨 Chance für ${esc(e.x)}`:`🚑 ${esc(e.x)} verletzt (${e.n} Sp.)`}</span></div>`).join('')||'<div class="mut small" style="text-align:center;padding-top:30px">Anpfiff…</div>'}</div>
  ${done?(more?'<button class="btn pri block" style="margin-top:12px" data-ov="next">Nächstes Spiel</button>':TK.card?'<button class="btn pri block" style="margin-top:12px" data-ov="card">Ereigniskarte aufdecken</button>':'<button class="btn pri block" style="margin-top:12px" data-ov="close">Schließen</button>'):'<button class="btn block" style="margin-top:12px" data-ov="skip">Überspringen</button>'}`;
}
document.getElementById('ov').addEventListener('click',e=>{
  const b=e.target.closest('[data-ov]');if(!b||!TK)return;const a=b.dataset.ov;
  if((a==='close'||a==='skip')&&Date.now()-(TK.t0||0)<900)return;
  if(a==='close'){clearInterval(TK.iv);document.getElementById('ov').style.display='none';TK=null;return;}
  if(a==='skip'){clearInterval(TK.iv);TK.min=TK.max||90;drawTicker();}
  if(a==='next'){TK.i++;runTicker();}
  if(a==='card'){TK.showCard=true;drawTicker();}
});

const PREFIXES=['FC','SV','TSV','VfB','SC','1.','SpVgg','FV','TuS','VfL','SG','DJK'];
function initials(n){const w=String(n).split(/\s+/).filter(x=>x&&!PREFIXES.includes(x));const s=(w.length>1?w[0][0]+w[1][0]:(w[0]||n).slice(0,2));return s.toUpperCase();}

function crestLogo(c,sz){sz=sz||28;const L=c.logo,col=c.color||'#888',c2=L.c2||'#fff';const id='cl'+(CRN++);const d=SHAPES[L.sh]||SHAPES.shield;

function pitchSvg(c,form){
  const X=pickXI(Object.assign({},c,{lineup:curLu(c)}),form);
  const rows=[['A',X.A,16],['M',X.M,40],['D',X.D,64],['G',X.G,86]];
  let pl='';
  for(const [k,arr,y] of rows){const n=arr.length;arr.forEach((x,i)=>{const cx=(i+1)*100/(n+1);
    const nm=x.p?esc(x.p.name.split(' ').slice(-1)[0]):'Amateur';const r=x.p?Math.round(x.r):35;
    const ed=xiEditable()&&x.p;const sel=ed&&ui.xiSel&&ui.xiSel.id===x.p.id;

function penPlan(e,m){
  const hv=h32(`${m.h}|${m.a}|${e.m}|${e.x}|${e.t}`);

  const miss=!e.x&&((hv>>7)%10)<4;
  if(miss){const opts=[[22,90],[278,90],[150,16]];const o=opts[(hv>>9)%3];return{bx:o[0],by:o[1],kx:X[col]-150,goal:false,txt:'VORBEI!'};}
  return{bx:X[col],by:Y[row],kx:X[col]-150,goal:false,txt:'GEHALTEN!'};
}
function penSvg(e,m){

function soSeq(m){
  if(m.soK)return m.soK.map((x,i)=>({s:x.s,hit:x.res==='goal',k:Math.floor(i/2),kick:x}));
  const [ph,pa]=m.pens;let hv=h32(`so|${m.h}|${m.a}|${ph}|${pa}`);const rnd=n=>{hv=h32(String(hv));return hv%n;};
  const pick=(n,k)=>{const a=Array(n).fill(0);let c=0;while(c<k){const i=rnd(n);if(!a[i]){a[i]=1;c++;}}return a;};
  let H,A;
  if(Math.max(ph,pa)<=5&&ph!==pa){H=pick(5,ph);A=pick(5,pa);}
  else{const W=Math.max(ph,pa),L=W-1;const k=Math.max(0,Math.min(5,L)-rnd(3));const both=L-k,miss=rnd(2);
    const f=pick(5,k);H=f.slice();A=pick(5,k);const sd=[];for(let i=0;i<both;i++)sd.push(1);for(let i=0;i<miss;i++)sd.splice(rnd(sd.length+1),0,0);
    for(const x of sd){H.push(x);A.push(x);}H.push(ph>pa?1:0);A.push(pa>ph?1:0);}
  const seq=[];for(let i=0;i<H.length;i++){seq.push({s:'h',hit:H[i],k:i});seq.push({s:'a',hit:A[i],k:i});}
  return seq;
}
function soName(cid,k){const c=ST.clubs[cid];if(c&&c.squad&&c.squad.length){const xs=c.squad.filter(p=>p.pos!=='G').sort((a,b)=>(b.tr==='elf')-(a.tr==='elf')||b.rat-a.rat);if(xs.length)return xs[k%xs.length].name;}return (k+1)+'. Schütze';}
function soStart(){
  const m=TK.ms[TK.i];const so={seq:soSeq(m),i:-1,done:false};TK.so=so;
  const step=()=>{if(!TK||TK.so!==so||so.done)return;so.i++;
    if(so.i>=so.seq.length){so.done=true;TK.pen=null;drawTicker();return;}
    const s=so.seq[so.i];const e=s.kick?soEv(s.kick,so.i):{m:100+so.i,t:s.hit?'p':'pm',s:s.s,x:soName(s.s==='h'?m.h:m.a,s.k),so:true};
    TK.pen=e;drawTicker();animPen(e,m);setTimeout(step,2400);};
  step();
}
function soDots(m){const so=TK.so;const row=side=>{const xs=so.seq.slice(0,so.i+(TK.pen?0:1)).filter(x=>x.s===side);
  const shown=so.seq.filter((x,j)=>j<so.i||(j===so.i&&!TK.pen)||so.done).filter(x=>x.s===side);
  const n=Math.max(5,so.seq.filter(x=>x.s===side).length);let h='';for(let i=0;i<n;i++){const x=shown[i];h+=`<span style="display:inline-block;width:14px;height:14px;border-radius:50%;margin:0 3px;background:${x?(x.hit?'#3fd0a0':'#ff5b4d'):'rgba(255,255,255,.15)'}"></span>`;}return h;};
  let a=0,b=0;for(let j=0;j<so.seq.length;j++){const x=so.seq[j];if(j<so.i||(j===so.i&&!TK.pen)||so.done){if(x.hit){if(x.s==='h')a++;else b++;}}}
  return `<div class="card" style="padding:10px;margin:8px 0"><div class="row small"><span>${esc(ST.clubs[m.h].name)}</span><span class="sp"></span><span>${row('h')}</span></div><div class="row small" style="margin-top:6px"><span>${esc(ST.clubs[m.a].name)}</span><span class="sp"></span><span>${row('a')}</span></div><div class="h" style="text-align:center;font-size:22px;margin-top:6px">${a}:${b}</div></div>`;}
const _penPlanSO=penPlan;
penPlan=function(e,m){if(!e.so)return _penPlanSO(e,m);
  if(e.shot!=null){const X=[78,150,222],Y=[62,118];const sc=e.shot%3,sr=Math.floor(e.shot/3),dc=e.dive%3,dr=Math.floor(e.dive/3);
    let bx=X[sc],by=Y[sr];if(e.res==='miss'){if(sr===0){by=14;}else{bx=sc===0?22:sc===2?278:bx;by=sc===1?14:90;}}

    return{bx,by,kx:X[dc]-150,ky:dr,goal:e.res==='goal',txt:e.res==='goal'?'TOR!':e.res==='save'?'GEHALTEN!':'VORBEI!'};}
  if(e.t==='pm'){const hv=h32(`${m.h}|${m.a}|${e.m}|so`);if(hv%10<3){const opts=[[22,90],[278,90],[150,16]];const X=[78,150,222];return{bx:opts[(hv>>4)%3][0],by:opts[(hv>>4)%3][1],kx:X[(hv>>7)%3]-150,goal:false,txt:'VORBEI!'};}}

  const d=k=>{if(!prev||prev.key===key)return '';const v=Math.round(R[k])-Math.round(prev[k]);return v?` <b style="color:${v>0?'#3fd0a0':'#ff5b4d'}">(${v>0?'+':''}${v})</b>`:'';};

  const tot=(R.A+R.M+R.D)/3,tO=(O.A+O.M+O.D)/3,df=tot-tO;

  MUS.master=c.createGain();MUS.master.gain.value=0.22*MUS.on.vol;MUS.master.connect(comp);
  MUS.duck=c.createGain();MUS.duck.connect(MUS.master);
  const d=c.createDelay(1);d.delayTime.value=60/118*0.75;const fb=c.createGain();fb.gain.value=0.32;const dl=c.createGain();dl.gain.value=0.25;d.connect(fb);fb.connect(d);d.connect(dl);dl.connect(MUS.master);MUS.delay=d;
  const b=c.createBuffer(1,c.sampleRate*0.5,c.sampleRate);const a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;MUS.noise=b;
}
const MF=n=>440*Math.pow(2,(n-69)/12);
// vi-IV-I-V in C: Am F C G
const PROG=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],BASS=[45,41,36,43];
const LEAD=[[76,0,74,76,79,0,76,74],[72,0,74,72,69,0,72,74],[72,0,76,79,84,0,79,76],[74,0,71,74,79,0,74,71]];
function musKick(t){const c=MUS.ctx;const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+0.12);g.gain.setValueAtTime(1.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.32);o.connect(g);g.connect(MUS.master);o.start(t);o.stop(t+0.35);
  MUS.duck.gain.cancelScheduledValues(t);MUS.duck.gain.setValueAtTime(0.35,t);MUS.duck.gain.linearRampToValueAtTime(1,t+0.22);}
function musNoise(t,dur,f,type,vol){const c=MUS.ctx;const s=c.createBufferSource();s.buffer=MUS.noise;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(fl);fl.connect(g);g.connect(MUS.master);s.start(t);s.stop(t+dur+0.02);}
function musTone(t,n,dur,type,vol,cut,dest,det){const c=MUS.ctx;const o=c.createOscillator();o.type=type;o.frequency.value=MF(n);if(det)o.detune.value=det;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=cut;const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(f);f.connect(g);g.connect(dest||MUS.duck);o.start(t);o.stop(t+dur+0.05);return g;}
function musStep(t){
  const s=MUS.step%16,bar=MUS.bar,ch=Math.floor(bar/2)%4,sec=Math.floor(bar/8)%6;// 0 intro,1-3 voll,4 breakdown,5 voll
  const full=sec>=1&&sec!==4,drums=sec!==4;const sp=60/118/4;
  if(drums&&s%4===0)musKick(t);
  if(drums&&(s===4||s===12)){musNoise(t,0.18,1800,'bandpass',0.55);musNoise(t+0.01,0.12,3000,'bandpass',0.3);}
  if(s%2===1)musNoise(t,0.04,8000,'highpass',s%4===3?0.22:0.1);
  if(drums&&s===14&&bar%4===3)musNoise(t,0.25,6000,'highpass',0.18);
  // Bass
  if(drums&&[0,3,6,8,10,11,14].includes(s))musTone(t,BASS[ch]+(s===10?12:0),sp*1.6,'sawtooth',0.42,520,null);
  // Pad
  if(s===0&&bar%2===0)for(const n of PROG[ch]){musTone(t,n,sp*30,'sawtooth',0.07,1400,null,-7);musTone(t,n,sp*30,'sawtooth',0.07,1400,null,7);}
  // Stabs
  if(full&&(s===2||s===6||s===10))for(const n of PROG[ch])musTone(t,n+12,sp*0.9,'square',0.045,2600,null);
  // Lead
  if(full&&s%2===0){const n=LEAD[ch][(s/2+(bar%2)*0)%8];if(n){const g=musTone(t,n,sp*1.8,'triangle',0.16,4200,null);if(MUS.delay)g.connect(MUS.delay);}}
  // Breakdown-Arp
  if(sec===4&&s%2===0){const n=PROG[ch][(s/2)%3]+12;const g=musTone(t,n,sp*1.4,'triangle',0.12,3000,null);if(MUS.delay)g.connect(MUS.delay);}
}
function musTick(){const c=MUS.ctx;if(!c||c.state!=='running')return;const sp=60/118/4;if(MUS.next<c.currentTime-0.2)MUS.next=c.currentTime+0.05;while(MUS.next<c.currentTime+0.12){musStep(MUS.next);MUS.next+=sp;MUS.step++;if(MUS.step%16===0)MUS.bar++;}}
function musStart(){if(!MUS.on.on)return;musInit();if(!MUS.ctx)return;if(MUS.ctx.state==='suspended')MUS.ctx.resume();if(MUS.timer)return;MUS.next=MUS.ctx.currentTime+0.05;MUS.timer=setInterval(musTick,25);
  MUS.master.gain.cancelScheduledValues(MUS.ctx.currentTime);MUS.master.gain.setValueAtTime(0.0001,MUS.ctx.currentTime);MUS.master.gain.linearRampToValueAtTime(0.22*MUS.on.vol,MUS.ctx.currentTime+1.5);}
function musStop(){if(MUS.timer){clearInterval(MUS.timer);MUS.timer=null;}if(MUS.ctx&&MUS.ctx.state==='running')MUS.ctx.suspend();}
function musSave(){LS.set('kc:music',MUS.on);if(MUS.master&&MUS.ctx)MUS.master.gain.setTargetAtTime(0.22*MUS.on.vol,MUS.ctx.currentTime,0.1);}
function musUnlock(){if(!MUS.on.on||document.visibilityState!=='visible')return;musInit();const c=MUS.ctx;if(!c)return;
  if(c.state!=='running'){c.resume();try{const b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0);}catch(e){}}
  if(!MUS.timer)musStart();else if(MUS.next<c.currentTime)MUS.next=c.currentTime+0.05;}
['pointerdown','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,musUnlock,true));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')musStop();else if(MUS.on.on&&MUS.ctx)musStart();});
ACT.musToggle=function(){MUS.on.on=!MUS.on.on;musSave();if(MUS.on.on)musStart();else musStop();render();};
ACT.musVol=function(v){MUS.on.vol=+v;musSave();render();};
function musicCard(){const o=MUS.on;return `<div class="card"><div class="row"><b>🎵 Musik</b><span class="sp"></span><span class="chip ${o.on?'on':''}" data-a="musToggle">${o.on?'An':'Aus'}</span></div>${o.on?`<div class="row" style="margin-top:8px;gap:6px"><span class="small mut">Lautstärke</span><span class="sp"></span>${[[0.3,'Leise'],[0.6,'Mittel'],[1,'Laut']].map(([v,l])=>`<span class="chip ${Math.abs(o.vol-v)<0.01?'on':''}" style="padding:5px 9px;font-size:13px" data-a="musVol" data-v="${v}">${l}</span>`).join('')}</div>`:''}<p class="tiny mut" style="margin:6px 0 0">Eigener Stadion-Elektro-Track. Auf dem iPhone muss der Stumm-Schalter aus sein.</p></div>`;}

function tutShow(){

    d.addEventListener('click',e=>{const b=e.target.closest('[data-tut]');if(!b)return;e.stopPropagation();const a=b.dataset.tut;if(a==='next'){ui.tut++;if(ui.tut>=TUT.length)tutEnd();else tutGo();}else if(a==='back'){ui.tut=Math.max(0,ui.tut-1);tutGo();}else tutEnd();});}

  <div class="row" style="margin-top:10px;gap:6px"><button class="btn sm" data-tut="skip">Überspringen</button><span class="sp"></span>${ui.tut>0?'<button class="btn sm" data-tut="back">‹</button>':''}<button class="btn sm pri" data-tut="next">${ui.tut===TUT.length-1?'Los geht’s!':'Weiter ›'}</button></div></div>`;
}
function tutGo(){const s=TUT[ui.tut];if(!s)return;const tabs=tabsFor().map(t=>t[0]);if(tabs.includes(s.t))ui.tab=s.t;if(s.s)ui.sub=s.s;if(s.ms)ui.subs.market=s.ms;if(s.qs)ui.subs.squad=s.qs;ui.pl=null;render();scrollTo(0,0);}

const APP_BUILD='47',APP_RV=11;
function updBanner(txt){if(document.getElementById('updb'))return;const d=document.createElement('div');d.id='updb';d.style.cssText='position:fixed;left:10px;right:10px;top:10px;z-index:80;max-width:520px;margin:0 auto';
  d.innerHTML=`<div class="card" style="margin:0;border:1px solid var(--acc);background:var(--panel2);box-shadow:0 8px 30px rgba(0,0,0,.6)"><div class="row" style="gap:10px"><span style="font-size:24px">🔄</span><div style="flex:1" class="small">${txt}</div><button class="btn sm pri" id="updgo">Aktualisieren</button></div></div>`;
  document.body.appendChild(d);document.getElementById('updgo').onclick=()=>{location.replace(location.pathname+'?v='+Date.now());};}
async function updCheck(){try{const t=await (await fetch(location.pathname+'?chk='+Date.now(),{cache:'no-store'})).text();const m=t.match(/APP_BUILD='(\d+)'/);if(m&&+m[1]>+APP_BUILD)updBanner('Es gibt eine neue Version von Klubchef.');}catch(e){}}

async function initFirebase(cfg){
  const V='https://www.gstatic.com/firebasejs/10.12.2/';
  const {initializeApp}=await import(V+'firebase-app.js');
  const fs=await import(V+'firebase-firestore.js');
  const db=fs.getFirestore(initializeApp(cfg));
  const wrap=s=>({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()})),metadata:s.metadata});
  const docRef=p=>({set:d=>fs.setDoc(fs.doc(db,p),d)});
  const q=(path,cons)=>({
    orderBy:(f,d)=>q(path,cons.concat(fs.orderBy(f,d||'asc'))),
    limit:n=>q(path,cons.concat(fs.limit(n))),
    doc:id=>docRef(path+'/'+id),
    get:async()=>wrap(await fs.getDocs(fs.query(fs.collection(db,path),...cons))),
    onSnapshot:(next,err)=>fs.onSnapshot(fs.query(fs.collection(db,path),...cons),s=>next(wrap(s)),e=>err&&err({code:e.code,message:e.message}))
  });
  return{doc:docRef,collection:p=>q(p,[])};
}
render();
(async()=>{
  try{
    const cfg=window.FIREBASE_CONFIG;
    if(cfg&&cfg.apiKey&&!/DEIN|YOUR/.test(cfg.apiKey)){NET.web=true;NET.db=await initFirebase(cfg);NET.canWrite=true;}
    else if(window.claude&&typeof window.claude.use==='function'){
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      NET.db=db||null;NET.user=user||null;
      if(user){try{NET.canWrite=await user.can('data.write');}catch(e){}}
    }
  }catch(e){console.error(e);}
  NET.ready=true;if(ui.view==='start')render();
  if(NET.db)loadOpen();
})();
