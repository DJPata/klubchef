function npcDraft(st){

    const r=RNG(st.seed,'npcpick'+st.draft.pick);
    const top=st.draft.board.slice().sort((a,b)=>b.rat-a.rat||(a.id<b.id?-1:1)).slice(0,3);

}

function teamRat(c,form,tac,oppTac,home){

function npcTac(r){return r.wpick([{v:'bal',w:3},{v:'off',w:2},{v:'def',w:2},{v:'konter',w:1},{v:'press',w:1}]).v;}

const ROLEK={cap:'Kapitän',pen:'Elfmeter',fk:'Freistoß',ck:'Ecken'};

function topScorer(st,filt){const l=Object.values(st.ss||{}).filter(e=>!filt||filt(e)).sort((a,b)=>b.g-a.g||b.a-a.a);return l[0]&&l[0].g>0?{n:l[0].n,c:l[0].c,g:l[0].g}:null;}
function feat(st){return !!st.career||st.rv>=7;}

function mStart(st,hId,aId,r){

function mRun(st,ctx,r,to,o){
  const h=st.clubs[ctx.h],a=st.clubs[ctx.a];

    let RH=ctx.RH,RA=ctx.RA;if(st.career&&s>=10){const up=R=>Object.assign({},R,{A:R.A+1,M:R.M+1,D:R.D+1});if(h.human&&ctx.red&&ctx.red.h>0)RH=up(RH);if(a.human&&ctx.red&&ctx.red.a>0)RA=up(RA);}

        else if(r.f()<pr){if(hs)ctx.gh++;else ctx.ga++;let gx;if(tk){tk.gs=(tk.gs||0)+1;tk.gc=(tk.gc||0)+1;if(statsOn(st)){if(!st.ss)st.ss={};const c0=hs?h:a;const e=st.ss['p'+tk.id]||(st.ss['p'+tk.id]={n:tk.name,c:c0.id,lg:c0.lg||0,g:0,a:0});e.g++;}gx=tk.name;}else gx=goalStat(st,hs?h:a,hs?RH:RA,r).x;ctx.ev.push({m:min,t:'p',s:hs?'h':'a',x:gx,sc:ctx.gh+':'+ctx.ga});}

      // Rote Karte

        const c=side==='h'?h:a,R=side==='h'?RH:RA;const min=Math.floor(s*7.5)+r.int(1,7);let nm='';

function mFinish(st,ctx,r,o){

// ---------- Spieltag ----------
function applySus(st,ids){for(const pid of humans(st))for(const p of st.clubs[pid].squad){if(p.sus>0)p.sus--;if(ids.includes(p.id))p.sus=1;}}
function resolveMatchday(st){
  const r=RNG(st.seed,`md-${st.season}-${st.md}`);
  const results=[];const inj=[];const sus=[];
  const xiPre={};for(const pid of humans(st)){const c=st.clubs[pid];if(c.cond)xiPre[pid]=xiIds(c);}
  for(const [h,a] of st.schedule[st.md])results.push(playMatch(st,h,a,r,{cup:false,inj,sus}));
  const ci=st.cupMds.indexOf(st.md);
  if(ci>=0&&st.cup&&!st.cup.winner){
    const al=st.cup.alive,win=[],ms=[];
    for(let i=0;i<al.length;i+=2){const m=playMatch(st,al[i],al[i+1],r,{cup:true,cupName:CUPN[ci],inj,sus});ms.push(m);results.push(m);win.push(m.w);}
    st.cup.log.push({round:CUPN[ci],ms:ms.map(m=>({h:m.h,a:m.a,gh:m.gh,ga:m.ga,pens:m.pens,w:m.w}))});
    st.cup.alive=win;st.cup.round++;
    if(win.length===1){st.cup.winner=win[0];const f=ms[0];st.cup.finalist=f.w===f.h?f.a:f.h;feed(st,`🏆 ${st.clubs[win[0]].name} gewinnt den Pokal!`);
      const wc=st.clubs[win[0]];if(wc.human){money(wc,2);wc.fans+=3000;}}
  }
  for(const pid of humans(st))for(const p of st.clubs[pid].squad)if(p.inj>0)p.inj--;
  for(const [p,n] of inj)p.inj=Math.max(p.inj||0,n);
  if(feat(st))applySus(st,sus);
  for(const pid in xiPre)condUpdate(st.clubs[pid],xiPre[pid],new Set());
  const cards={};
  for(const pid of humans(st)){
    const c=st.clubs[pid];const card=r.wpick(CARDS);
    const data=card.prep?card.prep(c,r,st):{};
    if(card.prep&&!data){cards[pid]={t:'Ruhige Woche',x:'Keine Schlagzeilen.',g:1};continue;}
    const x=card.run(c,r,st,data);
    cards[pid]={t:card.t,x,g:card.g};
    if(card.opts){c.pending={k:card.k,t:card.t,x,opts:card.opts,data};cards[pid].choice=true;}
  }
  st.last={season:st.season,md:st.md,results,cards};
  st.md++;st.ready={};
  if(st.md>=st.schedule.length)endSeason(st);
}

function endSeason(st){
  const tbl=sortedTable(st);
  const champ=tbl[0].id;
  feed(st,`🥇 ${st.clubs[champ].name} ist Meister der Saison ${st.season}!`);
  st.history.push({season:st.season,champ,cup:st.cup.winner,order:tbl.map(t=>t.id),top:statsOn(st)?topScorer(st):undefined});
  for(const pid of humans(st)){
    const c=st.clubs[pid];const place=tbl.findIndex(t=>t.id===pid)+1;
    if(c.pending){c.pending=null;}
    const fame=[[`Platz ${place} in der Liga`,PLACE_FAME[place-1]||0]];
    if(st.cup.winner===pid)fame.push(['Pokalsieg',5]);else if(st.cup.finalist===pid)fame.push(['Pokalfinale',2]);
    if(c.up.stadium>1)fame.push(['Stadion-Prestige',c.up.stadium-1]);
    if(place===1){c.trophies.push('Meister '+st.season);c.fans+=5000;}
    if(st.cup.winner===pid)c.trophies.push('Pokal '+st.season);
    let fsum=0;for(const f of fame)fsum+=f[1];c.fame+=fsum;
    const sal=r2(c.squad.reduce((s,p)=>s+salary(p),0));
    const ssal=r2(c.staff.reduce((s,x)=>s+x.sal,0));
    const fin=[['TV-Geld',r2(9-(place-1)*5/7)],['Sponsoring',r2(3+0.15*c.fame)]];
    if(has(c,'mkt'))fin.push(['Marketingchef',st.rv>=3?3:1.5]);
    fin.push(['Gehälter Spieler',-sal]);if(ssal)fin.push(['Gehälter Staff',-ssal]);
    if(st.rv>=2&&CATCHUP[place-1])fin.push(['Ausgleichsbonus',CATCHUP[place-1]]);

function posPen1(p,k,slot){if(k===slot)return 0;if(k==='TW'||slot==='TW')return 25;const key=[k,slot].sort().join('|');const c=PCAT[key]||4;const j=h01(p.id+'|pp|'+key);

function pickXIc(c,form){
  const F=FORM[form]||FORM['4-4-2'];const S=slotsOf(form);const E=p=>effRat(c,p);
  const avail=c.squad.filter(p=>!(p.inj>0)&&!(p.sus>0)&&!p.sent).sort((a,b)=>E(b)-E(a)||(a.id<b.id?-1:1));
  const used=new Set();const need={D:F[0],M:F[1],A:F[2]};const pl={G:[],D:[],M:[],A:[]};const redN={D:0,M:0,A:0};
  for(const p of c.squad.filter(q=>q.red)){let k=p.pos==='G'?'D':p.pos;if(c.lineup)for(const kk of ['D','M','A'])if((c.lineup[kk]||[]).includes(p.id))k=kk;if(redN[k]<need[k])redN[k]++;}
  const cap=k=>k==='G'?1:need[k]-redN[k];
  if(c.lineup)for(const k of ['G','D','M','A'])for(const id of (c.lineup[k]||[])){if(pl[k].length>=cap(k))break;const p=avail.find(q=>q.id===id);if(!p||used.has(p.id))continue;used.add(p.id);pl[k].push(p);}
  if(!pl.G.length){const g=avail.find(p=>p.pos==='G'&&!used.has(p.id));if(g){used.add(g.id);pl.G.push(g);}}
  const xi={G:[],D:[],M:[],A:[]};
  for(const k of ['D','M','A']){const sl=S[k];const n=cap(k);const ps=pl[k].slice();
    // beste Zuordnung der gesetzten Spieler, dann freie Plätze der Reihe nach füllen
    let asg=new Array(sl.length).fill(null);
    if(ps.length){let best=null,bs=1e9;const rec=(i,usedS,acc,cost)=>{if(cost>=bs)return;if(i===ps.length){bs=cost;best=acc.slice();return;}for(let j=0;j<sl.length;j++){if(usedS&(1<<j))continue;acc.push(j);rec(i+1,usedS|(1<<j),acc,cost+posPenC(ps[i],sl[j]));acc.pop();}};rec(0,0,[],0);
      if(best)best.forEach((j,i)=>{asg[j]=ps[i];});}
    let cnt=ps.length;
    for(const p of avail){if(cnt>=n)break;if(used.has(p.id)||p.pos==='G'||!knownSp(p).some(x=>SPLINE[x]===k))continue;let bj=-1,bp=99;for(let j=0;j<sl.length;j++){if(asg[j])continue;const pe=posPenC(p,sl[j]);if(pe<bp){bp=pe;bj=j;}}if(bj>=0&&bp<=4){used.add(p.id);asg[bj]=p;cnt++;}}
    for(let j=0;j<sl.length&&cnt<n;j++){if(asg[j])continue;let b=null,bv=-1e9;for(const p of avail){if(used.has(p.id)||p.pos==='G')continue;const v=E(p)-posPenC(p,sl[j]);if(v>bv){bv=v;b=p;}}if(b){used.add(b.id);asg[j]=b;cnt++;}}
    // Feinschliff: beste Verteilung aller Spieler der Reihe auf die Plätze
    {const q=asg.filter(Boolean);if(q.length>1&&q.length<=5){let best=null,bs=1e9;const rec=(i,usedS,acc,cost)=>{if(cost>=bs)return;if(i===q.length){bs=cost;best=acc.slice();return;}for(let j=0;j<sl.length;j++){if(usedS&(1<<j))continue;acc.push(j);rec(i+1,usedS|(1<<j),acc,cost+posPenC(q[i],sl[j]));acc.pop();}};rec(0,0,[],0);
      if(best){asg=new Array(sl.length).fill(null);best.forEach((j,i)=>{asg[j]=q[i];});}}}
    let reds=redN[k];
    for(let j=0;j<sl.length;j++){const p=asg[j];if(p){const pe=posPenC(p,sl[j]);const x={p,r:E(p)-pe,slot:sl[j]};if(pe>=10)x.oop=true;if(pe>0)x.sw=pe;xi[k].push(x);}}
    for(let j=sl.length-1;j>=0;j--){if(asg[j])continue;if(reds>0){reds--;xi[k].push({p:null,r:0,red:true,slot:sl[j]});}else xi[k].push({p:null,r:35,slot:sl[j]});}
    xi[k].sort((a,b)=>sl.indexOf(a.slot)-sl.indexOf(b.slot)||0);
    // gleiche Slotnamen (IV, IV): stabile Reihenfolge nach Platzindex
    {const ord=[];const tmp=xi[k].slice();for(let j=0;j<sl.length;j++){const i=tmp.findIndex(x=>x.slot===sl[j]);if(i>=0)ord.push(tmp.splice(i,1)[0]);}xi[k]=ord.concat(tmp);}
  }

  return xi;}

    if(st.phase==='halftime'){if(st.ht&&st.ht.ctx.penPend)rej('Erst den Elfmeter schießen.');const old=c.lineup,of=c.form;if(a.form&&formOk(st,a.form))c.form=a.form;setLineup(c,a.lineup);
      if(st.ht&&st.ht.xi1){const x1=new Set(st.ht.xi1);const n=[...xiIds(c)].filter(i=>!x1.has(i)).length;if(n>3){c.lineup=old;c.form=of;rej(`Maximal 3 Wechsel pro Spiel (du hast ${n}).`);}}
      if(a.tac&&TAC[a.tac])c.tac=a.tac;careerResume(st);return;}
    if(st.phase==='seasonEnd'){if(st.cl&&!st.cl.done){if(a.form&&formOk(st,a.form))c.form=a.form;if(a.tac&&TAC[a.tac])c.tac=a.tac;setLineup(c,a.lineup);}careerNext(st);}
  }
};

// ================= Paket 4 =================
// ---------- Analysezentrum (Ausbau, nur Karriere) ----------
const ANA_T=['','Gesamtstärke des Gegners','+ seine Formation','+ seine Ausrichtung (75 % sicher)','+ Angriff/Mittelfeld/Abwehr einzeln, Ausrichtung 85 % sicher','+ Topspieler und Schwachstelle, Ausrichtung 95 % sicher'];
const UPSC=Object.assign({},UPS,{analysis:{n:'Analysezentrum',d:l=>'Gegner-Vorschau: '+ANA_T[l]}});
function anaLvl(c){return (c&&c.up&&c.up.analysis)||1;}
function anaMigrate(st){const me=st.clubs.me;if(!me||!me.up||me.up.analysis!=null)return;const had=has(me,'vid');me.up.analysis=had?2:1;
  if(had){me.staff=me.staff.filter(x=>x.type!=='vid');feed(st,'🎥 Der Videoanalyst ist jetzt Teil des neuen Analysezentrums (Ausbau) – du startest gratis auf Stufe 2.','me');}
  if(st.staffPool)st.staffPool=st.staffPool.filter(x=>x.type!=='vid');}
function npcForm(c){if(!c)return '4-4-2';if(c.human)return c.form||'4-4-2';const v=h32(String(c.id))%2;const mx=Math.max(c.A,c.M,c.D),mn=Math.min(c.A,c.M,c.D);
  if(mx-mn<2)return '4-4-2';if(c.A===mx)return v?'4-3-3':'3-4-3';if(c.M===mx)return v?'4-5-1':'4-4-2R';return v?'5-3-2':'3-5-2D';}
// ---------- Spielstatistik ----------
function matchStats(ctx,m){const S=ctx.sx||{p:0,n:0,h:0,a:0};const hz=k=>h32(String(m.h)+m.a+m.gh+m.ga+k+(ctx.ev?ctx.ev.length:0));
  const pAvg=S.n?S.p/S.n:0.5;let ph=Math.round(clamp(50+(pAvg-0.5)*90+(hz('p')%7-3),28,72));
  const ev=ctx.ev||[];const cnt=(t,s)=>ev.filter(e=>(Array.isArray(t)?t.includes(e.t):e.t===t)&&e.s===s).length;
  const side=s=>{const g=cnt(['g','p','pm'],s),ch=cnt('c',s),at=S[s]||0;const sh=g+ch+Math.round(at*0.7)+hz('s'+s)%4;const on=Math.min(sh,cnt(['g','p'],s)+Math.round((sh-cnt(['g','p'],s))*0.35)+hz('o'+s)%2);
    return {sh,on,co:Math.round(sh*0.42)+hz('c'+s)%3,fo:8+hz('f'+s)%8,y:cnt('y',s)+cnt('yr',s),r:cnt('r',s)+cnt('yr',s)};};
  return {ph,h:side('h'),a:side('a')};}
// ---------- Transferverhandlungen ----------
function swapVal(p,s){let v=value(s);if(s.rat<p.rat-8&&!(s.age<=21&&s.pot>=p.rat))v*=0.5;return r2(v);}
function swapOk(c,s){if(!s)return 'Spieler nicht gefunden.';if(s.loan)return 'Leihspieler kann man nicht tauschen.';if(s.inj>0)return 'Verletzte Spieler will niemand.';if(s.sold)return 'Er ist schon verkauft.';if(s.pos==='G'&&c.squad.filter(x=>x.pos==='G').length<2)return 'Du brauchst einen Torwart.';return '';}
function offerCalc(c,p,pct,s){const price=buyPrice(c,p);const sv=s?swapVal(p,s):0;const tot=r2(price*pct);const pay=r2(Math.max(0,tot-sv));const ratio=Math.max(pct,price?sv/price:0);
  const ch=ratio>=1?1:Math.pow(clamp((ratio-0.65)/0.35,0,1),1.5);return {price,sv,tot,pay,ratio,ch};}
function buyPrecheck(st,c,p){needPhase(st,'offseason');if(!p)rej('Der Spieler ist schon vergeben.');if(!visible(c,p))rej('Dein Scouting kennt diesen Spieler nicht.');if(p.free)rej('Ablösefreie Spieler kosten nur Handgeld – da gibt es nichts zu verhandeln.');
  if((c.buys||0)>=buyMax(st))rej(`Maximal ${buyMax(st)} Transfers in diesem Fenster.`);if(c.bid)rej('Erst das laufende Wettbieten entscheiden.');}
function doSwapBuy(st,c,p,pay,s,a){if(s){c.squad=c.squad.filter(x=>x!==s);c.offers=(c.offers||[]).filter(o=>o.pid!==s.id);feed(st,`🔁 ${s.name} wechselt im Tausch für ${p.name}.`,'me');}
  if(c.squad.length>=SQUAD_MAX)rej(`Kader voll (max. ${SQUAD_MAX}).`);delete p.counter;completeBuy(st,c,p,pay,a);}
function buyOffer(st,a){const c=st.clubs.me;const p=st.market.find(x=>x.id===a.player);buyPrecheck(st,c,p);
  if(p.counter)rej('Es liegt ein Gegenangebot vor – nimm es an oder lass es.');if((p.negB||0)>=3)rej('Der Verein verhandelt nicht mehr – nur noch Kauf zum vollen Preis.');
  const pct=clamp(Math.round((+a.pct||1)*100)/100,0.7,1.1);let s=null;if(a.swap){s=c.squad.find(x=>x.id===a.swap);const e=swapOk(c,s);if(e)rej(e);}
  const O=offerCalc(c,p,pct,s);if(c.cash<O.pay)rej('Nicht genug Geld für die Zuzahlung.');if(!s&&c.squad.length>=SQUAD_MAX)rej(`Kader voll (max. ${SQUAD_MAX}).`);
  p.negB=(p.negB||0)+1;const r=RNG(st.seed,'bo'+p.id+':'+p.negB);
  if(r.f()<O.ch){c.lastNeg={ok:true,t:`✅ Einigung! ${p.name} kommt${s?' im Tausch gegen '+s.name:''}${O.pay?' für '+fm(O.pay):''}.`};doSwapBuy(st,c,p,O.pay,s,a);return;}
  if(O.ratio>=0.75&&r.f()<0.6){const cr=Math.min(1.1,Math.ceil(((O.ratio+1)/2)*20)/20);p.counter={pct:cr,swap:s?s.id:null};c.lastNeg={ok:false,t:`↩️ Gegenangebot: Der Verein will ${Math.round(cr*100)} %${s?' (mit Tausch)':''}.`};return;}
  p.pup=r2((p.pup||1)*1.05);c.lastNeg={ok:false,t:`❌ Abgelehnt – der Preis steigt um 5 %.${p.negB>=3?' Keine weiteren Verhandlungen.':''}`};}
function buyCounter(st,a){const c=st.clubs.me;const p=st.market.find(x=>x.id===a.player);buyPrecheck(st,c,p);if(!p.counter)rej('Kein Gegenangebot offen.');
  if(a.no){delete p.counter;p.pup=r2((p.pup||1)*1.05);c.lastNeg={ok:false,t:'Gegenangebot abgelehnt – der Preis steigt um 5 %.'};return;}
  let s=null;if(p.counter.swap){s=c.squad.find(x=>x.id===p.counter.swap);const e=swapOk(c,s);if(e)rej(e);}
  const O=offerCalc(c,p,p.counter.pct,s);if(c.cash<O.pay)rej('Nicht genug Geld.');if(!s&&c.squad.length>=SQUAD_MAX)rej(`Kader voll (max. ${SQUAD_MAX}).`);
  c.lastNeg={ok:true,t:`✅ ${p.name} kommt${s?' im Tausch gegen '+s.name:''}${O.pay?' für '+fm(O.pay):''}.`};doSwapBuy(st,c,p,O.pay,s,a);}
function offerUp(st,a){const c=st.clubs.me;const o=(c.offers||[]).find(x=>x.id===a.offer);if(!o)rej('Angebot nicht mehr gültig.');if(o.up)rej('Du hast schon nachverhandelt.');
  const pct=+a.pct===1.2?1.2:1.1;const r=RNG(st.seed,'ou'+o.id);o.up=true;
  if(r.f()<(pct>=1.2?0.3:0.6)){o.price=r2(o.price*pct);c.lastNeg={ok:true,t:`✅ ${o.club} erhöht auf ${fm(o.price)}.`};}
  else{c.offers=c.offers.filter(x=>x!==o);c.lastNeg={ok:false,t:`❌ ${o.club} zieht das Angebot zurück.`};}}
// ---------- Potenzial-Spanne je nach Scouting ----------
function potRange(c,p){if(!c||c.squad.includes(p)||(c.nlz||[]).includes(p))return [p.pot,p.pot];const l=c.up.scouting||1;if(l>=3)return [p.pot,p.pot];const half=l>=2?4:8;const w=half*2;const off=h32(p.id+'pr')%(w+1);
  let lo=p.pot-off,hi=lo+w;if(lo<p.rat){hi+=p.rat-lo;lo=p.rat;}return [lo,Math.min(99,hi)];}

// ---------- Positionslernen durch Spielpraxis: 5 Spiele auf fremder Position = 1 Trainingseinheit ----------
function posProg(p,s){return (p.ptg===s?p.ptp:(p.pxm&&p.pxm[s]))||0;}
function posPlay(st,p,s){p.pgm=p.pgm||{};p.pgm[s]=(p.pgm[s]||0)+1;if(p.pgm[s]<5)return;p.pgm[s]=0;
  if(!p.ptg){p.ptg=s;p.ptp=0;}let n;if(p.ptg===s){p.ptp=(p.ptp||0)+1;n=p.ptp;}else{p.pxm=p.pxm||{};p.pxm[s]=(p.pxm[s]||0)+1;n=p.pxm[s];}
  if(n>=5){p.xsp=(p.xsp||[]).concat([s]);if(p.ptg===s){delete p.ptg;delete p.ptp;}else delete p.pxm[s];delete p.pgm[s];feed(st,`🎓 ${p.name} hat durch Spielpraxis die Position ${s} gelernt!`,'me');}
  else feed(st,`🎓 ${p.name} hat 5× als ${s} gespielt – +1 Trainingseinheit (${n}/5).`,'me');}

// ---------- Ausbau jederzeit, mit Bauzeit je nach Stufe ----------
const BUILD_F=0.7;
function buildWeeks(k,to){return (k==='stadium'?2:0)+[0,0,4,6,8,10][to];}
function blds(c){if(c.build){c.builds=Object.assign({},c.builds||{},{stadium:c.build});delete c.build;}return c.builds||(c.builds={});}
function stBuilding(c){return !!(c&&(c.build||(c.builds&&c.builds.stadium)));}
function buildToday(st,days){if(st.phase==='offseason')return st.winter?mdDay(st,8)+3:mdDay(st,0)-days-5;const D=nextMyDay(st);return D!=null?D-1:mdDay(st,Math.min(17,st.md));}
function facBuild(st,k){const c=st.clubs.me;if(!UPSC[k])rej('Unbekannt.');if(st.phase==='halftime')rej('Nicht während eines Spiels.');if(st.phase==='seasonEnd')rej('Erst weiter zur Sommerpause.');
  const B=blds(c);if(B[k])rej('Hier wird schon gebaut.');const l=c.up[k]||1;if(l>=5)rej('Maximale Stufe.');const cost=(k==='stadium'?CUPCOST:CUPCOST2)[l];if(c.cash<cost)rej('Nicht genug Geld.');
  money(c,-cost);const days=buildWeeks(k,l+1)*7;const t=buildToday(st,days);B[k]={to:l+1,s:st.season,start:t,done:t+days};
  feed(st,`🏗️ Baustart: ${UPSC[k].n} Stufe ${l+1} – fertig in ca. ${buildWeeks(k,l+1)} Wochen.${k==='stadium'?' Bis dahin weniger Ticket- und Fanshop-Einnahmen.':''}`,'me');buildCheck(st);}
function buildCheck(st){const c=st.clubs.me;if(!c)return;const B=blds(c);const D=nextMyDay(st);
  for(const k of Object.keys(B)){const b=B[k];const fin=(D!=null&&D>=b.done)||(st.phase==='offseason'&&!st.winter&&st.season>b.s);if(!fin)continue;
    c.up[k]=Math.max(c.up[k]||1,b.to);delete B[k];feed(st,`${k==='stadium'?'🏟️':'🏗️'} Ausbau fertig: ${UPSC[k].n} Stufe ${c.up[k]}${k==='stadium'?' – '+CCAP[c.up[k]].toLocaleString('de-DE')+' Plätze':''}!`,'me');}}

// ---------- Spielminuten (für Frische) ----------
function minTrack(st){const ht=st.ht,ctx=ht&&ht.ctx;if(!ctx||!ctx.onAt)return;const me=st.clubs.me;
  const M=ht.brk&&ht.brk.m?ht.brk.m:Math.round(Math.min(12,ctx.s)*7.5);const now=xiIds(me);
  for(const id of Object.keys(ctx.onAt))if(!now.has(id)){ctx.pm[id]=(ctx.pm[id]||0)+Math.max(0,M-ctx.onAt[id]);delete ctx.onAt[id];}
  for(const id of now)if(ctx.onAt[id]==null)ctx.onAt[id]=M;}
// ---------- Konkurrenz verstärkt sich im Saisonverlauf (moderat) ----------
function npcGrow(st,r,winter){let n=0;for(let L=1;L<=NL;L++)for(const id of st.order[L]){if(id==='me')continue;const c=st.clubs[id];if(!c||c.human)continue;
  for(const k of ['A','M','D']){let d=winter?r.int(0,2):(r.chance(0.35)?1:0);if(winter&&r.chance(0.12)){d+=2;n++;}c[k]=clamp(c[k]+d,40,90);}}
  if(winter)feed(st,`📈 Die Konkurrenz rüstet in der Winterpause auf – ${n} Vereine haben sich gezielt verstärkt.`,'me');}
// ---------- 🔥 Lauf: 3+ Scorerpunkte in einem Spiel ----------
function fireCheck(st,m){if(!m||!m.ev)return;const me=st.clubs.me;const side=m.h==='me'?'h':m.a==='me'?'a':null;if(!side)return;
  for(const p of me.squad)if(p.fire>0)p.fire--;
  const cnt={};for(const e of m.ev){if(e.s!==side)continue;if(e.t==='g'||e.t==='p'){const n=String(e.x).split(' – ')[0];cnt[n]=(cnt[n]||0)+1;}if(e.t==='g'&&e.as)cnt[e.as]=(cnt[e.as]||0)+1;}
  for(const n in cnt)if(cnt[n]>=3){const p=me.squad.find(x=>x.name===n);if(p){p.fire=2;if(p.fr!=null)p.fr=Math.min(100,p.fr+15);feed(st,`🔥 ${p.name} ist on fire: ${cnt[n]} Scorerpunkte! +3 Stärke für die nächsten 2 Spiele und +15 % Frische.`,'me');}}}

// ---------- Sichtungscamp: einmal Hinrunde, einmal Rückrunde ----------
function campKey(st){return st.season+((st.winter||st.md>=9)?'R':'H');}
function campUsed(st,c){const k=campKey(st);return c.campKey===k||(!c.campKey&&c.campSeason===st.season&&k.endsWith('H'));}
// ---------- NLZ-Talente spielen in ihrer Jugendmannschaft mit ----------
function nlzGrow(st,r){const c=st.clubs.me;if(!c||!c.nlz)return;const y=c.up.youth||1;for(const p of c.nlz){if(p.rat<p.pot&&r.chance(0.12+y*0.02))p.rat=Math.min(p.pot,p.rat+1);}}

// ---------- Sterne für Nachwuchs (bessere Akademie = öfter 4–5 Sterne, 💎 nur auf Stufe 5) ----------
function youthStars(st,r,c,p){const y=(c.up&&c.up.youth)||1;const v=r.f()+(y-1)*0.03;p.st=v<0.25?1:v<0.60?2:v<0.85?3:v<0.97?4:5;
  if(p.st>=4)p.pot=Math.max(p.pot,Math.min(94,p.rat+(p.st===5?24:18)));
  if(y>=5&&r.chance(0.001)){p.st=6;p.pot=Math.max(p.pot,92);feed(st,`💎 Sensation im Nachwuchs: ${p.name} ist ein Jahrhunderttalent!`,'me');}}

<script>
// ================= KLUBCHEF UI =================
const ui={view:'start',tab:null,sub:null,pos:'all',confirm:null,seat:null,loadMsg:'',jColor:COLORS[0],form:null,tac:null,openList:null,tickerShown:null};
const NET={mode:null,code:null,raw:[],unsub:null,db:null,user:null,pid:null,canWrite:null,lastMeta:'',timer:null,ready:false};
let ST=null,applied=[];const mySent=new Set();
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
function rnd(n,alpha){const a=new Uint32Array(n);crypto.getRandomValues(a);let s='';for(const x of a)s+=alpha[x%alpha.length];return s;}
const rid=n=>rnd(n,'abcdefghijkmnpqrstuvwxyz23456789');
const genCode=()=>rnd(5,'ABCDEFGHJKLMNPQRSTUVWXYZ23456789');
function me(){return NET.mode==='local'?ui.seat:NET.mode==='career'?'me':NET.pid;}
function myC(){if(!ST)return null;const c=ST.clubs[me()];return c&&c.human?c:null;}
function isHostMe(){return ST&&(ST.local||ST.host===me());}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fm(x){const a=Math.abs(x);if(a>0&&a<0.995){const k=Math.round(a*1000);return (x<0?'−':'')+(k>=10?Math.round(k/10)*10:k)+' Tsd.';}const v=Math.round(x*10)/10;return (v<0?'−':'')+Math.abs(v).toFixed(1).replace('.',',')+' Mio';}
function num(x){return Math.round(x).toLocaleString('de-DE');}
function ratCol(r){return r>=80?'var(--gold)':r>=72?'var(--acc)':r>=64?'var(--ink)':'var(--mut)';}
function val(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function toast(msg,ok){const t=document.createElement('div');t.className='toast'+(ok?' ok':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3400);}
function conf(key){if(ui.confirm===key){ui.confirm=null;return true;}ui.confirm=key;render();setTimeout(()=>{if(ui.confirm===key){ui.confirm=null;render();}},4000);return false;}
function cl(key,label,sure){return ui.confirm===key?(sure||'Sicher?'):label;}

// ---------- Netz ----------
async function send(type,p){
  p=p||{};
  let by=me();
  if(type==='CREATE')by=NET.mode==='local'?'L0':NET.pid;
  if(!by){toast('Wähle zuerst deinen Platz.');return;}
  const a=Object.assign({},p,{id:String(applied.length).padStart(5,'0')+'-'+rid(6),seq:applied.length,ts:Date.now(),by,type});
  if(NET.mode==='career'){
    try{const h=CH[type];if(h)h(ST,a);ensureAll(ST);careerEnsurePrep(ST);}catch(e){if(e instanceof Rej)toast(e.m);else{console.error(e);toast('Fehler: '+e.message);}}
    saveCareer();if(ui.lastPhase!==ST.phase){scrollTo(0,0);ui.tab=null;ui.sub=null;ui.confirm=null;}ui.lastPhase=ST.phase;render();checkTicker();return;
  }
  mySent.add(a.id);
  if(NET.mode==='local'){NET.raw.push(a);LS.set('kc:local',{raw:NET.raw});recompute();return;}
  try{await NET.db.collection(`g/${NET.code}/a`).doc(a.id).set(a);writeMeta();}
  catch(e){mySent.delete(a.id);const c=e&&e.code;
    toast(c==='permission-denied'?'Die Datenbank lehnt den Zug ab (Sicherheitsregeln prüfen).':c==='invalid_argument'?'Keine Schreibrechte – der Besitzer muss dich als Bearbeiter einladen.':c==='quota_exceeded'?'Der Speicher ist voll.':'Senden fehlgeschlagen – bitte nochmal versuchen.');}
}
function recompute(){
  const acts=NET.raw.slice().sort((x,y)=>(x.seq-y.seq)||(x.ts-y.ts)||(x.id<y.id?-1:x.id>y.id?1:0));
  let ok=applied.length<=acts.length;
  if(ok)for(let i=0;i<applied.length;i++)if(acts[i].id!==applied[i]){ok=false;break;}
  if(!ok){ST=null;applied=[];}
  for(let i=applied.length;i<acts.length;i++){
    const a=acts[i];
    try{ST=reduce(ST,a);}catch(e){if(e instanceof Rej){if(mySent.has(a.id))toast(e.m);}else console.error(e);}
    mySent.delete(a.id);applied.push(a.id);
  }
  if(ST){
    if(NET.mode==='local'&&!ST.players.some(p=>p.pid===ui.seat))ui.seat=ST.players[0]?ST.players[0].pid:null;
    if(NET.mode==='local'&&ST.phase==='draft')ui.seat=drafter(ST);
    if(ui.lastPhase&&ui.lastPhase!==ST.phase){scrollTo(0,0);ui.confirm=null;ui.tab=null;ui.sub=null;}
    ui.lastPhase=ST.phase;
    updateMine();
  }
  render();checkTicker();
}
async function writeMeta(){
  if(NET.mode!=='online'||!ST)return;
  const m={code:ST.code,phase:ST.phase,season:ST.season,seasons:ST.settings.seasons,clubs:ST.players.map(p=>p.club)};
  const k=JSON.stringify(m);if(k===NET.lastMeta)return;NET.lastMeta=k;
  try{await NET.db.doc('g/'+ST.code).set(Object.assign({},m,{updated:Date.now()}));}catch(e){}
}
function saveCareer(){if(ST&&ST.career)LS.set('kc:career',ST);}
function rememberGame(code){const l=LS.get('kc:mine',[]).filter(x=>x.code!==code);l.unshift({code,t:Date.now(),club:''});LS.set('kc:mine',l.slice(0,8));}
function updateMine(){if(NET.mode!=='online')return;const c=myC();if(!c)return;const l=LS.get('kc:mine',[]);const e=l.find(x=>x.code===ST.code);if(e&&e.club!==c.name){e.club=c.name;LS.set('kc:mine',l);}}
function cleanup(){SQUAD_MAX=22;ui.lastPhase=null;CAREER_VAL=false;if(NET.unsub){try{NET.unsub();}catch(e){}}NET.unsub=null;clearTimeout(NET.timer);ST=null;applied=[];NET.raw=[];NET.lastMeta='';ui.tab=null;ui.sub=null;ui.form=null;ui.tac=null;ui.lu=undefined;ui.loadMsg='';}
async function openGame(code,create){
  cleanup();NET.mode='online';NET.code=code;ui.view='game';
  const pids=LS.get('kc:pids',{});NET.pid=pids[code]||('m'+rid(8));pids[code]=NET.pid;LS.set('kc:pids',pids);
  rememberGame(code);render();
  NET.timer=setTimeout(()=>{if(!ST){ui.loadMsg=create?'Keine Verbindung zur Datenbank.':'Spiel nicht gefunden – stimmt der Code?';render();}},10000);
  NET.unsub=NET.db.collection(`g/${code}/a`).onSnapshot(snap=>{
    NET.raw=snap.docs.map(d=>d.data());
    if(!snap.metadata.fromCache)clearTimeout(NET.timer);
    recompute();
  },err=>{clearTimeout(NET.timer);ui.loadMsg='Verbindung unterbrochen ('+(err&&err.code||'?')+'). Öffne das Spiel bitte neu.';render();});
  if(create)await send('CREATE',{seed:rid(12),code,rv:13,settings:{seasons:0,double:false,draft:'manual',diff:'normal',cond:false}});
}
async function loadOpen(){
  if(!NET.db)return;
  try{const s=await NET.db.collection('g').orderBy('updated','desc').limit(15).get();ui.openList=s.docs.map(d=>d.data());}catch(e){ui.openList=[];}
  if(ui.view==='start')render();
}

function saveInputs(){const o={};document.querySelectorAll('#app input[id]').forEach(i=>o[i.id]=i.value);const f=document.activeElement;return{o,f:f&&f.id&&f.tagName==='INPUT'?f.id:null,s:f&&f.selectionStart};}
function restoreInputs(k){for(const id in k.o){const i=document.getElementById(id);if(i)i.value=k.o[id];}if(k.f){const i=document.getElementById(k.f);if(i){i.focus();try{i.setSelectionRange(k.s,k.s);}catch(e){}}}}
function render(){const app=document.getElementById('app');const k=saveInputs();app.innerHTML=ui.view==='start'?vStart():vGame();restoreInputs(k);}

function rulesCard(){return `<div class="card"><details><summary>So funktioniert's</summary><div class="small" style="margin-top:8px">
<p><b>Ziel:</b> Gewinne die <b>Champions League</b>. Dafür brauchst du am Saisonende 50 Sterne ★ oder 3 Meistertitel. Verlierst du das CL-Finale, halbieren sich deine Sterne.</p>
<p><b>1. Draft:</b> Alle 8 Vereine – auch die Computer – wählen reihum aus 10 ausliegenden Spielern, nach jedem Pick wird nachgelegt. Jede Runde beginnt ein anderer Klub. Du brauchst 15 Spieler: 2 Torhüter, 5 Abwehr, 5 Mittelfeld, 3 Sturm.</p>
<p><b>2. Sommerpause:</b> Bis zu 2 Spieler kaufen, beliebig verkaufen, bis zu 3 Mitarbeiter einstellen, Trainingszentrum, Scouting, Stadion und Jugendakademie ausbauen, notfalls Kredit aufnehmen. Wer fertig ist, tippt auf <i>Bereit</i>.</p>

<p><b>Verträge & Eigenschaften:</b> Spieler haben Verträge (📝 = läuft aus, sonst geht er ablösefrei) und manche besondere Eigenschaften wie 🎯 Torjäger oder 🩹 verletzungsanfällig. Andere Vereine kaufen mit, bieten mit und machen Angebote für deine Stars – dafür sind 5 Transfers pro Sommerpause erlaubt.</p><p><b>Spielereignisse:</b> Elfmeter, Rote Karten (Sperre fürs nächste Spiel) und Halbzeit: Im Karriere-Modus greifst du in der Pause selbst ein, online stellst du vorher einen Plan B ein.</p><p><b>Pokal:</b> Läuft nebenher mit Viertelfinale, Halbfinale und Finale.</p><p><b>Sichtungscamp:</b> Einmal pro Saison Talente (16–19) für 1–2 Mio sichten – mit etwas Glück ist ein Rohdiamant dabei.</p>
<p><b>Saisonende:</b> Ruhm für die Platzierung (10/7/5/4/3/2/1/0), Pokalsieg +5, Finale +2, Stadion-Prestige. Geld gibt es aus TV-Vertrag, Sponsoring und dem Ausgleichsbonus (Letzter 5 Mio … Meister 0), Gehälter und Zinsen gehen ab. Spieler altern, Talente wachsen, Veteranen hören auf.</p>
<p class="mut">Ein eigenständiges Spiel – Vereine und Spieler sind frei erfunden.</p></div></details></div>`;}

// ---------- Live-Ticker ----------
let TK=null;
function checkTicker(){
  if(!ST||!ST.last)return;const c=myC();if(!c)return;
  const tag=`${ST.code}:${me()}:${ST.last.season}-${ST.last.md}`;
  if(ui.tickerShown===tag)return;
  const seen=LS.get('kc:seen',{});const key=ST.code+':'+(ST.career?ST.seed+':':'')+me();
  ui.tickerShown=tag;
  if(seen[key]===`${ST.last.season}-${ST.last.md}`)return;
  seen[key]=`${ST.last.season}-${ST.last.md}`;LS.set('kc:seen',seen);
  showTicker(true);
}
function showTicker(auto){
  const c=myC();if(!c||!ST.last)return;
  const ms=ST.last.results.filter(m=>m.h===c.id||m.a===c.id);if(!ms.length)return;
  if(TK&&TK.iv)clearInterval(TK.iv);
  TK={ms,i:0,min:0,card:ST.last.cards[c.id],showCard:false,md:ST.last.md,auto:!!auto};
  document.getElementById('ov').style.display='flex';
  runTicker();
}
function runTicker(){clearInterval(TK.iv);const m0=TK.ms[TK.i];TK.min=TK.auto&&m0&&m0.ht?45:0;drawTicker();TK.iv=setInterval(()=>{TK.min++;if(TK.min>=90){TK.min=90;clearInterval(TK.iv);}drawTicker();},75);}
function drawTicker(){
  const box=document.getElementById('ovb');
  if(TK.showCard){const k=TK.card;box.innerHTML=`<div class="row"><span class="pill">Ereigniskarte</span><span class="sp"></span><button class="ic" data-ov="close">✕</button></div><div class="evc ${k.g?'':'bad'}" style="margin-top:12px;padding:18px"><div class="h" style="font-size:28px">🃏 ${esc(k.t)}</div><div>${esc(k.x)}</div>${k.choice?'<p class="small" style="margin-bottom:0"><b>Deine Entscheidung ist gefragt</b> – im Spieltag-Tab.</p>':''}</div><button class="btn pri block" data-ov="close">Weiter</button>`;return;}
  const m=TK.ms[TK.i];const H=ST.clubs[m.h],A=ST.clubs[m.a];
  const ev=m.ev.filter(e=>e.m<=TK.min);let gh=0,ga=0;for(const e of ev)if(e.t==='g'){if(e.s==='h')gh++;else ga++;}
  const done=TK.min>=90;
  const more=TK.i<TK.ms.length-1;
  box.innerHTML=`<div class="row"><span class="pill">${m.cup?'Pokal · '+esc(m.cup):'Liga · Spieltag '+(TK.md+1)}</span><span class="sp"></span><button class="ic" data-ov="close">✕</button></div>
  <div class="score"><div class="tm">${dot(H)}<br>${esc(H.name)}</div><div class="sc">${gh}:${ga}</div><div class="tm">${dot(A)}<br>${esc(A.name)}</div></div>
  <div class="row tiny mut"><span class="sp" style="text-align:center">${esc(TAC[m.th].n)}</span><span class="sp" style="text-align:center">${esc(TAC[m.ta].n)}</span></div>
  <div class="clock" style="margin-top:6px">${done?(m.pens?`Elfmeterschießen ${m.pens[0]}:${m.pens[1]}`:'Abpfiff'):TK.min+'′'}</div>
  <div style="margin-top:10px;min-height:120px">${ev.slice().reverse().map(e=>`<div class="tk ${e.s}"><span class="m">${e.m}′</span><span>${e.t==='g'?`⚽ <b>Tor!</b> ${esc(e.x)} <span class="mut">(${e.sc})</span>${e.as?`<br><span class="tiny mut">Vorlage: ${esc(e.as)}</span>`:''}`:e.t==='c'?`💨 Chance für ${esc(e.x)}`:`🚑 ${esc(e.x)} verletzt (${e.n} Sp.)`}</span></div>`).join('')||'<div class="mut small" style="text-align:center;padding-top:30px">Anpfiff…</div>'}</div>
  ${done?(more?'<button class="btn pri block" style="margin-top:12px" data-ov="next">Nächstes Spiel</button>':TK.card?'<button class="btn pri block" style="margin-top:12px" data-ov="card">Ereigniskarte aufdecken</button>':'<button class="btn pri block" style="margin-top:12px" data-ov="close">Schließen</button>'):'<button class="btn block" style="margin-top:12px" data-ov="skip">Überspringen</button>'}`;
}
document.getElementById('ov').addEventListener('click',e=>{
  const b=e.target.closest('[data-ov]');if(!b||!TK)return;const a=b.dataset.ov;
  if((a==='close'||a==='skip')&&Date.now()-(TK.t0||0)<900)return;
  if(a==='close'){clearInterval(TK.iv);document.getElementById('ov').style.display='none';TK=null;return;}
  if(a==='skip'){clearInterval(TK.iv);TK.min=TK.max||90;drawTicker();}
  if(a==='next'){TK.i++;runTicker();}
  if(a==='card'){TK.showCard=true;drawTicker();}
});

function pitchSvg(c,form){
  const X=pickXI(Object.assign({},c,{lineup:curLu(c)}),form);

function soSeq(m){
  if(m.soK)return m.soK.map((x,i)=>({s:x.s,hit:x.res==='goal',k:Math.floor(i/2),kick:x}));
  const [ph,pa]=m.pens;let hv=h32(`so|${m.h}|${m.a}|${ph}|${pa}`);const rnd=n=>{hv=h32(String(hv));return hv%n;};
  const pick=(n,k)=>{const a=Array(n).fill(0);let c=0;while(c<k){const i=rnd(n);if(!a[i]){a[i]=1;c++;}}return a;};
  let H,A;
  if(Math.max(ph,pa)<=5&&ph!==pa){H=pick(5,ph);A=pick(5,pa);}
  else{const W=Math.max(ph,pa),L=W-1;const k=Math.max(0,Math.min(5,L)-rnd(3));const both=L-k,miss=rnd(2);
    const f=pick(5,k);H=f.slice();A=pick(5,k);const sd=[];for(let i=0;i<both;i++)sd.push(1);for(let i=0;i<miss;i++)sd.splice(rnd(sd.length+1),0,0);
    for(const x of sd){H.push(x);A.push(x);}H.push(ph>pa?1:0);A.push(pa>ph?1:0);}
  const seq=[];for(let i=0;i<H.length;i++){seq.push({s:'h',hit:H[i],k:i});seq.push({s:'a',hit:A[i],k:i});}
  return seq;
}
function soName(cid,k){const c=ST.clubs[cid];if(c&&c.squad&&c.squad.length){const xs=c.squad.filter(p=>p.pos!=='G').sort((a,b)=>(b.tr==='elf')-(a.tr==='elf')||b.rat-a.rat);if(xs.length)return xs[k%xs.length].name;}return (k+1)+'. Schütze';}
function soStart(){
  const m=TK.ms[TK.i];const so={seq:soSeq(m),i:-1,done:false};TK.so=so;
  const step=()=>{if(!TK||TK.so!==so||so.done)return;so.i++;
    if(so.i>=so.seq.length){so.done=true;TK.pen=null;drawTicker();return;}
    const s=so.seq[so.i];const e=s.kick?soEv(s.kick,so.i):{m:100+so.i,t:s.hit?'p':'pm',s:s.s,x:soName(s.s==='h'?m.h:m.a,s.k),so:true};
    TK.pen=e;drawTicker();animPen(e,m);setTimeout(step,2400);};
  step();
}
function soDots(m){const so=TK.so;const row=side=>{const xs=so.seq.slice(0,so.i+(TK.pen?0:1)).filter(x=>x.s===side);
  const shown=so.seq.filter((x,j)=>j<so.i||(j===so.i&&!TK.pen)||so.done).filter(x=>x.s===side);
  const n=Math.max(5,so.seq.filter(x=>x.s===side).length);let h='';for(let i=0;i<n;i++){const x=shown[i];h+=`<span style="display:inline-block;width:14px;height:14px;border-radius:50%;margin:0 3px;background:${x?(x.hit?'#3fd0a0':'#ff5b4d'):'rgba(255,255,255,.15)'}"></span>`;}return h;};
  let a=0,b=0;for(let j=0;j<so.seq.length;j++){const x=so.seq[j];if(j<so.i||(j===so.i&&!TK.pen)||so.done){if(x.hit){if(x.s==='h')a++;else b++;}}}
  return `<div class="card" style="padding:10px;margin:8px 0"><div class="row small"><span>${esc(ST.clubs[m.h].name)}</span><span class="sp"></span><span>${row('h')}</span></div><div class="row small" style="margin-top:6px"><span>${esc(ST.clubs[m.a].name)}</span><span class="sp"></span><span>${row('a')}</span></div><div class="h" style="text-align:center;font-size:22px;margin-top:6px">${a}:${b}</div></div>`;}
const _penPlanSO=penPlan;
penPlan=function(e,m){if(!e.so)return _penPlanSO(e,m);
  if(e.shot!=null){const X=[78,150,222],Y=[62,118];const sc=e.shot%3,sr=Math.floor(e.shot/3),dc=e.dive%3,dr=Math.floor(e.dive/3);
    let bx=X[sc],by=Y[sr];if(e.res==='miss'){if(sr===0){by=14;}else{bx=sc===0?22:sc===2?278:bx;by=sc===1?14:90;}}

    return{bx,by,kx:X[dc]-150,ky:dr,short,goal:e.res==='goal',txt:e.res==='goal'?'TOR!':e.res==='save'?'GEHALTEN!':'VORBEI!'};}

  const tot=(R.A+R.M+R.D)/3,tO=(O.A+O.M+O.D)/3,df=tot-tO;

const MUS={ctx:null,on:LS.get('kc:music',{on:true,vol:0.6}),timer:null,step:0,next:0,bar:0,master:null,delay:null,noise:null};
function musInit(){
  if(MUS.ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  const c=new AC();MUS.ctx=c;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(c.destination);
  MUS.master=c.createGain();MUS.master.gain.value=0.22*MUS.on.vol;MUS.master.connect(comp);
  MUS.duck=c.createGain();MUS.duck.connect(MUS.master);
  const d=c.createDelay(1);d.delayTime.value=60/118*0.75;const fb=c.createGain();fb.gain.value=0.32;const dl=c.createGain();dl.gain.value=0.25;d.connect(fb);fb.connect(d);d.connect(dl);dl.connect(MUS.master);MUS.delay=d;
  const b=c.createBuffer(1,c.sampleRate*0.5,c.sampleRate);const a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;MUS.noise=b;
}
const MF=n=>440*Math.pow(2,(n-69)/12);
// vi-IV-I-V in C: Am F C G
const PROG=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],BASS=[45,41,36,43];
const LEAD=[[76,0,74,76,79,0,76,74],[72,0,74,72,69,0,72,74],[72,0,76,79,84,0,79,76],[74,0,71,74,79,0,74,71]];
function musKick(t){const c=MUS.ctx;const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+0.12);g.gain.setValueAtTime(1.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.32);o.connect(g);g.connect(MUS.master);o.start(t);o.stop(t+0.35);

function musStep(t){
  const s=MUS.step%16,bar=MUS.bar,ch=Math.floor(bar/2)%4,sec=Math.floor(bar/8)%6;// 0 intro,1-3 voll,4 breakdown,5 voll
  const full=sec>=1&&sec!==4,drums=sec!==4;const sp=60/118/4;
  if(drums&&s%4===0)musKick(t);
  if(drums&&(s===4||s===12)){musNoise(t,0.18,1800,'bandpass',0.55);musNoise(t+0.01,0.12,3000,'bandpass',0.3);}
  if(s%2===1)musNoise(t,0.04,8000,'highpass',s%4===3?0.22:0.1);
  if(drums&&s===14&&bar%4===3)musNoise(t,0.25,6000,'highpass',0.18);
  // Bass
  if(drums&&[0,3,6,8,10,11,14].includes(s))musTone(t,BASS[ch]+(s===10?12:0),sp*1.6,'sawtooth',0.42,520,null);

function musTick(){const c=MUS.ctx;if(!c||c.state!=='running')return;const sp=60/118/4;if(MUS.next<c.currentTime-0.2)MUS.next=c.currentTime+0.05;while(MUS.next<c.currentTime+0.12){musStep(MUS.next);MUS.next+=sp;MUS.step++;if(MUS.step%16===0)MUS.bar++;}}

  if(c.state!=='running'){c.resume();try{const b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0);}catch(e){}}

['pointerdown','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,musUnlock,true));

const BK={busy:false,t:null};
function bkS(){return LS.get('kc:bk',{code:null,last:0,err:'',key:'',seen:false});}

function bkB64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
function bkUn64(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function bkPack(o){const j=JSON.stringify(o);try{if(typeof CompressionStream==='function'){const buf=await new Response(new Blob([j]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();return {z:1,d:bkB64(buf)};}}catch(e){}return {z:0,d:j};}
async function bkUnpack(x){if(!x.z)return JSON.parse(x.d);const t=await new Response(new Blob([bkUn64(x.d)]).stream().pipeThrough(new DecompressionStream('gzip'))).text();return JSON.parse(t);}
function bkData(){return {kc:1,t:Date.now(),build:APP_BUILD,career:ST,rec:LS.get('kc:rec',null),reg:LS.get('kc:reg',null)};}
function bkKey(){return ST.seed+':'+ST.season+':'+ST.md+':'+ST.phase+(ST.winter?'w':'');}

async function bkUpload(manual){
  if(!ST||!ST.career||NET.mode!=='career'||BK.busy)return false;
  if(!NET.db){if(manual)toast('Keine Verbindung zur Cloud.');return false;}
  BK.busy=true;const code=bkCode(),key=bkKey();
  try{const pk=await bkPack(bkData());const id=String(Date.now())+'-'+rid(4);const c=ST.clubs.me;
    await NET.db.collection('g/KCB-'+code+'/a').doc(id).set({id,seq:0,ts:Date.now(),by:'bk',type:'BK',z:pk.z,d:pk.d,club:c.name,season:ST.season,md:ST.md});
    const s=bkS();s.last=Date.now();s.err='';s.key=key;LS.set('kc:bk',s);BK.busy=false;if(manual)toast('Spielstand in der Cloud gesichert.',true);if(manual||ui.tab==='settings')render();return true;
  }catch(e){console.warn('Backup:',e);const s=bkS();s.err=(e&&e.code)||'fehler';LS.set('kc:bk',s);BK.busy=false;if(manual){toast('Sichern fehlgeschlagen – bitte später nochmal.');render();}return false;}
}

  LS.set('kc:rec',L);}

function bracketHtml(cup,title){

  {const pts=[];for(let i=0;i<=24;i++){const a=i/24*Math.PI*2;pts.push([px+pw/2+Math.cos(a)*8,py+pd/2+Math.sin(a)*8]);}g+=L(pts);}

function fltRat(f,p){return f.pos?(f.pos==='TW'?(p.pos==='G'?p.rat:Math.max(1,p.rat-25)):(p.pos==='G'?Math.max(1,p.rat-25):posVal(p,f.pos))):p.rat;}
function fltApply(k,list,c){const f=fltGet(k);const known=p=>!c.squad.includes(p)&&(c.up.scouting||1)<3;
  let L=list.filter(p=>{if(f.pos&&(f.pos==='TW')!==(p.pos==='G'))return false;if(f.minR&&fltRat(f,p)<f.minR)return false;if(f.minF&&fitOf(p)<f.minF)return false;if(f.maxA&&p.age>f.maxA)return false;if(f.minS&&!known(p)&&starsOf(p)<f.minS)return false;if(f.afford&&c.cash<buyPrice(c,p))return false;return true;});
  const key={rat:p=>fltRat(f,p),pot:p=>p.pot,fit:p=>fitOf(p),fr:p=>p.fr==null?100:p.fr,age:p=>p.age,val:p=>value(p),ct:p=>p.ct==null?9:p.ct,st:p=>starsOf(p)}[f.sort]||(p=>p.rat);
  return L.sort((a,b)=>(key(a)-key(b))*f.dir||b.rat-a.rat);}
function fltPosTag(k,p){const f=fltGet(k);if(!f.pos)return '';const v=fltRat(f,p);return ` · <b style="color:${ratCol(v)}">${f.pos} ${v}</b>`;}
function fltBar(k,mk){const f=fltGet(k);const sel=(fld,opts)=>`<select data-flt="${k}|${fld}" style="padding:4px 6px;font-size:12px;min-height:30px;border-radius:8px">${opts.map(([v,l])=>`<option value="${v}" ${String(f[fld])===String(v)?'selected':''}>${l}</option>`).join('')}</select>`;
  return `<div class="fbar">${sel('pos',[['','Alle Pos.'],...POS12.map(x=>[x,x])])}${sel('minR',[[0,'Stärke'],[40,'ab 40'],[50,'ab 50'],[60,'ab 60'],[70,'ab 70'],[80,'ab 80']])}${sel('minF',[[0,'Fitness'],[50,'FIT ab 50'],[60,'FIT ab 60'],[70,'FIT ab 70'],[80,'FIT ab 80']])}${sel('maxA',[[0,'Alter'],[19,'bis 19'],[21,'bis 21'],[23,'bis 23'],[26,'bis 26'],[30,'bis 30']])}${sel('minS',[[0,'Sterne'],[3,'ab ★3'],[4,'ab ★4'],[5,'★5']])}${mk?`<span class="chip ${f.afford?'on':''}" style="padding:4px 9px;font-size:12px" data-a="fltT" data-v="${k}|afford">💶 bezahlbar</span>`:''}
  <span class="sp"></span>${sel('sort',[['rat',f.pos?'Wert '+f.pos:'Stärke'],['pot','Potenzial'],['fit','Fitness'],['fr','Frische'],['age','Alter'],['val','Marktwert'],['ct','Vertrag'],['st','Sterne']])}<span class="chip" style="padding:4px 9px;font-size:12px" data-a="fltT" data-v="${k}|dir">${f.dir<0?'↓':'↑'}</span>${fltActive(k)?`<span class="chip" style="padding:4px 9px;font-size:12px" data-a="fltR" data-v="${k}">✕</span>`:''}</div>`;}
document.addEventListener('change',e=>{const el=e.target;if(!el||!el.dataset||!el.dataset.flt)return;const [k,f]=el.dataset.flt.split('|');fltSet(k,f,f==='pos'||f==='sort'?el.value:+el.value);render();});
ACT.fltT=function(v){const [k,f]=String(v).split('|');const c=fltGet(k);fltSet(k,f,f==='dir'?-c.dir:(c[f]?0:1));render();};
ACT.fltR=function(k){const o=LS.get('kc:flt',{});delete o[k];LS.set('kc:flt',o);render();};
// ---------- Karten-Raster ----------
function viewMode(){return LS.get('kc:sqv','cards');}
ACT.sqv=function(v){LS.set('kc:sqv',v);render();};
function fcardMini(p,c,o){o=o||{};const f=fltGet(o.k||'sq');const v=fltRat(f,p);const fr=p.fr==null?100:Math.round(p.fr);const st=starsOf(p);
  const ic=(p.ct===1&&!p.loan?'📝':'')+(p.inj>0?'🚑':'')+(p.sus>0?'🟥':'')+(p.fire>0?'🔥':'')+(p.tr&&TRAITS[p.tr]?TRAITS[p.tr].i:'')+(p.loan?'🔁':'');
  const tier=st>=6?'dia':v>=78?'gold':v>=65?'silver':'bronze';
  return `<div class="fut ${tier}${o.xi?' xi':''}" data-a="pl" data-v="${p.id}"><div class="fut-t"><b>${v}</b><span>${f.pos||posL(p).replace('+','')}</span></div><div class="fut-s">${st>=6?'💎':'★'.repeat(st)}</div><div class="fut-n">${esc(p.name.split(' ').slice(-1)[0])}</div>
  <div class="fut-m"><span>${p.age} J.</span><span>FIT ${fitOf(p)}</span></div>${c.cond&&!p.loan?`<div class="fut-fr"><i style="width:${fr}%;background:${frCol(fr)}"></i></div>`:''}${ic?`<div class="fut-i">${ic}</div>`:''}</div>`;}
function squadOverview(c){
  const sal=c.squad.reduce((t,p)=>t+salary(p),0);const mode=viewMode();
  let xi=new Set();if(['matchday','halftime'].includes(ST.phase)){const X=pickXI(Object.assign({},c,{lineup:curLu(c)}),ui.form||c.form);for(const k of ['G','D','M','A'])for(const x of X[k])if(x.p)xi.add(x.p.id);}
  let h=`<div class="row small mut" style="margin:8px 2px 4px"><span>${c.squad.length}/${SQUAD_MAX} Spieler · Gehälter ${fm(sal)}/Saison</span><span class="sp"></span><div class="chips" style="gap:4px"><span class="chip ${mode==='cards'?'on':''}" style="padding:4px 9px;font-size:12px" data-a="sqv" data-v="cards">🃏 Karten</span><span class="chip ${mode==='list'?'on':''}" style="padding:4px 9px;font-size:12px" data-a="sqv" data-v="list">☰ Liste</span></div></div>`;
  h+=fltBar('sq',false);
  const L=fltApply('sq',c.squad,c);const grouped=!fltActive('sq');
  const render1=ps=>mode==='cards'?`<div class="futg">${ps.map(p=>fcardMini(p,c,{xi:xi.has(p.id)})).join('')}</div>`:ps.map(p=>crow(p,{tap:1,xi:xi.has(p.id),sub:undefined})).join('');
  if(grouped){for(const pos of ['G','D','M','A']){const ps=L.filter(p=>p.pos===pos);h+=`<div class="card" style="padding:8px 12px"><h4 style="margin:2px 0 6px">${{G:'Torhüter',D:'Abwehr',M:'Mittelfeld',A:'Sturm'}[pos]} <span class="mut tiny">${ps.length}</span></h4>${render1(ps)||'<div class="mut small">—</div>'}</div>`;}}
  else h+=`<div class="card" style="padding:8px 12px">${render1(L)||'<div class="empty small">Kein Spieler passt zum Filter.</div>'}</div>`;
  return h;}
const _squadC=VIEWS.squad;VIEWS.squad=function(){const h=_squadC.apply(this,arguments);if(!ST.career||sub('squad')!=='sp'||ui.pl)return h;const c=myC();const i=h.indexOf('<div class="row small mut" style="margin:10px 2px">');if(i<0)return h;return h.slice(0,i)+squadOverview(c);};
// NLZ: Karten statt Zeilen
// ---------- Spielerübersicht im Querformat: links Steckbrief, rechts Positionen ----------
const _cardHtmlC=cardHtml;cardHtml=function(){const h=_cardHtmlC();if(!h||!isLand())return h;
  const mk='<div class="tiny mut" style="margin:14px 0 6px;letter-spacing:.6px;text-transform:uppercase">';const parts=h.split(mk);const head=parts[0];
  const seg={};for(const x of parts.slice(1)){const t=x.slice(0,x.indexOf('</div>'));seg[t]=mk+x;}
  const gi=head.indexOf('<div class="pgrid">');let grid='',hd=head;if(gi>=0){let d=0,j=gi;const re=/<\/?div\b/g;re.lastIndex=gi;let m;while((m=re.exec(head))){if(m[0]==='<div')d++;else{d--;if(d===0){j=head.indexOf('>',m.index)+1;break;}}}grid=head.slice(gi,j);hd=head.slice(0,gi)+head.slice(j);}
  const c=myC();const p=c.squad.find(x=>x.id===ui.card);
  const big=p?`<div class="row" style="gap:14px;margin-bottom:6px"><div class="kpi" style="flex:1;text-align:center"><span>Stärke</span><b>${p.rat}</b></div><div class="kpi" style="flex:1;text-align:center"><span>Potenzial</span><b>${p.pot}</b></div><div class="kpi" style="flex:1;text-align:center"><span>Marktwert</span><b style="font-size:20px">${fm(value(p))}</b></div></div>`:'';
  const L=hd+(seg['Zustand']||'')+(seg['Saison']||'')+(seg['Vertrag']||'');const R=big+grid+(seg['Aktionen']||'')+(seg['Entwicklung']||'');
  return `<div class="pcl"><div>${L}</div><div>${R}</div></div>`;};

// ---------- ℹ️ Info-Knöpfe statt langer Beschreibungen ----------
const INFOT={};
function inf(t,title){const k='i'+h32(String(t));INFOT[k]=[t,title||''];return `<span class="ib" data-a="info" data-v="${k}" role="button" aria-label="Info">i</span>`;}
ACT.info=function(v){const x=INFOT[v];if(!x)return;let el=document.getElementById('infoPop');if(!el){el=document.createElement('div');el.id='infoPop';document.body.appendChild(el);el.addEventListener('click',()=>{el.classList.remove('on');});}
  el.innerHTML=`<div class="ipb">${x[1]?`<b>${x[1]}</b><br>`:''}${x[0]}<div class="tiny mut" style="margin-top:10px">Tippen zum Schließen</div></div>`;el.classList.add('on');};
// Lange Erklärtexte automatisch hinter ein ⓘ legen (nur in der Karriere)
function collapseDesc(){if(!ST||!ST.career)return;const app=document.getElementById('app');if(!app)return;
  for(const p of app.querySelectorAll('p.tiny.mut,p.small.mut,p.small,div.tiny.mut')){if(p.dataset.keep!=null||p.closest('#sheet .pcl')&&false)continue;
    const txt=(p.textContent||'').trim();if(txt.length<110)continue;if(p.querySelector('button,select,input,.chip,[data-a],.ib,.pill'))continue;
    if(p.closest('details,.tk,.evc,.todo,table'))continue;
    const card=p.closest('.card')||p.parentElement;let head=null;
    for(const h of card.querySelectorAll('h3,h4,.row > b')){if(h.compareDocumentPosition(p)&Node.DOCUMENT_POSITION_FOLLOWING)head=h;}
    const k='i'+h32(p.innerHTML);INFOT[k]=[p.innerHTML,head?head.textContent.trim():''];
    const ib=document.createElement('span');ib.className='ib';ib.dataset.a='info';ib.dataset.v=k;ib.textContent='i';
    if(head&&!head.querySelector('.ib')){head.appendChild(ib);p.remove();}
    else{const d=document.createElement('div');d.className='tiny mut';d.style.margin='2px 0 6px';d.append('Info ');d.appendChild(ib);p.replaceWith(d);}}}
{const _rCD=render;render=function(){_rCD.apply(this,arguments);try{collapseDesc();}catch(e){}};}

function preBuyCard(c,p){const pct=ui.pbPct||100;const fee=r2(buyPrice(c,p)*pct/100);const done=(c.deals||[]).some(d=>d.p.id===p.id);const L=c.lastNeg;
  if(p.free)return `<button class="btn ok block" data-a="buy" data-v="${p.id}" ${c.cash<buyPrice(c,p)||c.squad.length>=SQUAD_MAX?'disabled':''}>Vereinslos – sofort holen für ${fm(buyPrice(c,p))}</button>`;
  return `<div class="card"><h3>🤝 Angebot fürs nächste Transferfenster ${inf('Während der Saison kannst du Vertragsspieler schon verpflichten – sie kommen zur '+(ST.md<9?'Winterpause':'neuen Saison')+'. Die Ablöse zahlst du bei Einigung. Mehr bieten = höhere Chance. Nach 3 Absagen ist Schluss.')}</h3>
  ${L?`<div class="small" style="margin:0 0 8px;color:${L.ok?'var(--ok)':'var(--bad)'}">${esc(L.t)}</div>`:''}
  ${done?'<div class="small">✅ Vereinbart – kommt zum nächsten Fenster.</div>':`<div class="chips">${[90,100,110,120].map(v=>`<span class="chip ${pct===v?'on':''}" data-a="pbPct" data-v="${v}">${v} %</span>`).join('')}</div>
  <button class="btn ok block" style="margin-top:8px" data-a="preBuy" data-v="${p.id}" ${c.cash<fee||(p.negB||0)>=3?'disabled':''}>Bieten: ${fm(fee)}</button><div class="tiny mut" style="margin-top:4px">Versuch ${(p.negB||0)+1}/3</div>`}</div>`;}
ACT.pbPct=function(v){ui.pbPct=+v;render();};
ACT.preBuy=function(v){const c0=myC();if(c0)c0.lastNeg=null;send('PRE_BUY',{player:v,pct:(ui.pbPct||100)/100});};
ACT.release=function(v){if(conf('rel'+v)){send('RELEASE',{player:v});ui.card=null;}};
ACT.nlzNo=function(v){if(conf('nn'+v))send('NLZ_NO',{player:v});};

// ---------- Start ----------
async function initFirebase(cfg){
  const V='https://www.gstatic.com/firebasejs/10.12.2/';
  const {initializeApp}=await import(V+'firebase-app.js');
  const fs=await import(V+'firebase-firestore.js');
  const db=fs.getFirestore(initializeApp(cfg));
  const wrap=s=>({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()})),metadata:s.metadata});
  const docRef=p=>({set:d=>fs.setDoc(fs.doc(db,p),d)});
  const q=(path,cons)=>({
    orderBy:(f,d)=>q(path,cons.concat(fs.orderBy(f,d||'asc'))),
    limit:n=>q(path,cons.concat(fs.limit(n))),
    doc:id=>docRef(path+'/'+id),
    get:async()=>wrap(await fs.getDocs(fs.query(fs.collection(db,path),...cons))),
    onSnapshot:(next,err)=>fs.onSnapshot(fs.query(fs.collection(db,path),...cons),s=>next(wrap(s)),e=>err&&err({code:e.code,message:e.message}))
  });
  return{doc:docRef,collection:p=>q(p,[])};
}
render();
(async()=>{
  try{
    const cfg=window.FIREBASE_CONFIG;
    if(cfg&&cfg.apiKey&&!/DEIN|YOUR/.test(cfg.apiKey)){NET.web=true;NET.db=await initFirebase(cfg);NET.canWrite=true;}
    else if(window.claude&&typeof window.claude.use==='function'){
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      NET.db=db||null;NET.user=user||null;
      if(user){try{NET.canWrite=await user.can('data.write');}catch(e){}}
    }
  }catch(e){console.error(e);}
  NET.ready=true;if(ui.view==='start')render();
  if(NET.db)loadOpen();
})();
